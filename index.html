/* PP-EXT (V5 block 22 — F11/F12): TIMELINE THEME TOKENS.
   The day timeline used to hard-code its whole palette inline in `TL_TYP()` (retired by 25c, see
   `tlSurface`) and `renderDayColumn`, so
   the app's landing view stayed a pastel slab on black chrome whatever theme was selected — and the
   multi-day grid darkened weekends by 5% black, which on a near-black pane is no tint at all.

   Two rules govern the dark values, and they are the reason this is a token pass rather than a filter:

     · HUE IS MEANING, AND IT HAS EXACTLY ONE SOURCE. (V5 block 25c superseded the four per-KIND
       families that used to live here.) A block's hue is the TASK's own colour — `PCOL[priority]`, the
       same map the month calendar's chips, the sheet rows and the Gantt read — so the same work looks
       like itself everywhere. The theme contributes TONE only: `--tl-fill-base` is the near-neutral the
       task colour is mixed into and `--tl-fill-a`/`--tl-fill-b` are the two gradient strengths. Mixing
       into a NEUTRAL is what keeps the hue identical in both themes; introducing a tinted base here
       would rotate every block's hue and is the one change this block's tests exist to catch.
       There is deliberately no timeline-only palette. `block-colour.spec.js` proves the timeline's hue
       matches the calendar's for the same task, so a second palette cannot be reintroduced quietly.
     · `--tl-win-*` is the STRUCTURAL treatment for the `dayIntervals` clock windows (Lunch, Dinner,
       Free time). They are settings, not tasks, so they take no hue at all — a bare wash inside a
       dashed outline that reads as the shape of the day.
     · `--tl-lock-border` marks the RARE case: a block the USER placed (clock-fixed or hand-pinned)
       carries a `TL_LOCK_BORDER_PX` border in it, against 1px for everything the app placed. This is
       what replaced the auto-hatch, which V5 deleted: hatching covered ~90% of the week and so carried
       no information, and at 14% white it was the loudest thing on the dark pane.
     · The weekend wash LIGHTENS on dark and DARKENS on light, to a comparable Δluminance in both
       (measured: light ≈0.107, dark ≈0.023 — same order, where 5% black measured 0.0008).

   The Gantt's own `--weekend-col` is deliberately NOT touched: it is already theme-aware and paints
   1px-ish day stripes, where a column-strength wash would read as banding. */
:root,:root[data-theme="dark"]{
  --tl-fill-base:#232326;--tl-fill-a:40%;--tl-fill-b:26%;--tl-blk-fg:#f4efec;
  --tl-win-bg:rgba(255,255,255,0.05);--tl-win-border:rgba(255,255,255,0.30);--tl-win-fg:#a9b0b8;
  --tl-lock-border:#eaf3ee;
  --tl-band:rgba(255,255,255,0.028);
  --tl-blk-border:rgba(0,0,0,0.45);--tl-rail-auto:rgba(0,0,0,0.35);
  --tl-rail-fixed:#5fbf8c;--tl-rail-pinned:#7ad3a4;
  --tl-ctl-bg:rgba(28,28,30,0.88);--tl-ctl-fg:#d8ecdd;--tl-grip:rgba(255,255,255,0.32);
  --tl-grip-active:rgba(255,255,255,0.7);
  --tl-point:#7fb2f5;--tl-point-soft:rgba(127,178,245,0.5);--tl-hover-chip-soft:rgba(49,83,94,0.55);--tl-hover-chip-bg:rgba(49,83,94,0.92);--tl-hover-chip-fg:#d5e3e9;
  --tl-hover-chip-border:rgba(255,255,255,0.18);
  --tl-unsched-box-bg:rgba(230,124,0,0.14);--tl-unsched-box-border:rgba(230,124,0,0.38);
  --tl-weekend:rgba(255,255,255,0.10);
}
:root[data-theme="light"]{
  --tl-fill-base:#f4f2f0;--tl-fill-a:40%;--tl-fill-b:26%;--tl-blk-fg:#2b2724;
  --tl-win-bg:rgba(0,0,0,0.045);--tl-win-border:rgba(0,0,0,0.28);--tl-win-fg:#5f6b7a;
  --tl-lock-border:#1b1f24;
  --tl-band:rgba(0,0,0,0.035);
  --tl-blk-border:rgba(0,0,0,0.15);--tl-rail-auto:rgba(0,0,0,0.07);
  --tl-rail-fixed:#14532d;--tl-rail-pinned:#1e7a4c;
  --tl-ctl-bg:rgba(255,255,255,0.85);--tl-ctl-fg:#233529;--tl-grip:rgba(0,0,0,0.28);
  --tl-grip-active:rgba(0,0,0,0.6);
  --tl-point:#1a73e8;--tl-point-soft:rgba(26,115,232,0.5);--tl-hover-chip-soft:rgba(190,218,227,0.55);--tl-hover-chip-bg:rgba(190,218,227,0.92);--tl-hover-chip-fg:#2a3538;
  --tl-hover-chip-border:rgba(0,0,0,0.12);
  --tl-unsched-box-bg:rgba(230,81,0,0.08);--tl-unsched-box-border:rgba(230,81,0,0.3);
  --tl-weekend:rgba(0,0,0,0.05);
}
/* /PP-EXT */
/* PP-EXT: design-token scales (B0 — foundation). Type/spacing/radius/shadow/motion. Theme-agnostic
   (values, not colors) except shadows, which need separate light/dark alpha tuning below. No new
   magic literals should be introduced outside this block — extend the scale instead. */
:root{
  /* Type scale — 6 steps, whole px only (kills fractional sizes like 8.5/9.5/11.5). */
  --fs-1:11px;--fs-2:12px;--fs-3:13px;--fs-4:15px;--fs-5:18px;--fs-6:22px;
  --lh-tight:1.2;--lh-normal:1.45;--lh-loose:1.6;
  /* Spacing scale — 8pt-based (with a couple of 4px half-steps for dense chrome). */
  --sp-0:4px;--sp-1:8px;--sp-2:12px;--sp-3:16px;--sp-4:24px;--sp-5:32px;--sp-6:48px;
  /* Radius scale — 4 steps. */
  --r-1:4px;--r-2:6px;--r-3:10px;--r-4:16px;--r-pill:999px;
  /* Motion — durations + easing, shared across hover/focus/transition rules. */
  --dur-fast:120ms;--dur-med:180ms;--dur-slow:260ms;--ease-standard:cubic-bezier(.4,0,.2,1);
}
:root,:root[data-theme="dark"]{
  /* Shadow/elevation scale — 3 steps, tuned darker+softer for the dark theme. */
  --sh-1:0 1px 2px rgba(0,0,0,0.4);
  --sh-2:0 4px 12px rgba(0,0,0,0.45);
  --sh-3:0 12px 32px rgba(0,0,0,0.55);
}
:root[data-theme="light"]{
  --sh-1:0 1px 2px rgba(20,20,18,0.06);
  --sh-2:0 4px 14px rgba(20,20,18,0.09);
  --sh-3:0 16px 36px rgba(20,20,18,0.14);
}
@media (prefers-reduced-motion:reduce){
  :root{--dur-fast:0ms;--dur-med:0ms;--dur-slow:0ms}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:7px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hover)}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-corner{background:transparent}
input,select,button{font-family:inherit}
.pp-edit{outline:none}
.pp-edit:focus{background:var(--focus-bg);border-radius:3px;box-shadow:0 0 0 1px var(--focus-ring)}
.pp-num{width:100%;background:transparent;border:1px solid transparent;color:var(--text-num);font-size:12px;padding:2px 4px;border-radius:3px;text-align:right}
.pp-num:hover{border-color:var(--divider)}
.pp-num:focus{outline:none;background:var(--focus-bg);border-color:var(--focus-ring)}
/* PP-EXT: rich-text description editor + rendered output */
.pp-rich:empty:before{content:attr(data-ph);color:var(--text-faint2)}
.pp-rich:focus{border-color:var(--focus-ring)!important}
.pp-rich ul{margin:4px 0;padding-left:22px;list-style:disc}
.pp-rich ol{margin:4px 0;padding-left:22px;list-style:decimal}
.pp-rich li{margin:2px 0}
.pp-rich p{margin:4px 0}
.pp-rich h1,.pp-rich h2,.pp-rich h3{margin:8px 0 4px;font-weight:700}
.pp-rich code{background:var(--input-bg);border:1px solid var(--divider);border-radius:4px;padding:0 4px;font-size:0.92em}
.pp-rich a{color:var(--link);text-decoration:underline}
/* /PP-EXT */
.pp-sel{background:var(--input-bg);border:1px solid var(--divider);color:var(--text-num);font-size:12px;padding:2px 4px;border-radius:4px;width:100%}
.pp-sel:focus{outline:none;border-color:var(--focus-ring)}
.pp-tbtn{display:flex;align-items:center;gap:5px;height:30px;padding:0 11px;background:var(--btn-bg);border:1px solid var(--divider);color:var(--btn-text);border-radius:6px;font-size:12.5px;font-weight:500;cursor:pointer}
.pp-tbtn:hover{background:var(--btn-hover)}
.pp-tbtn:active{background:var(--btn-active)}
.pp-iconbtn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--btn-bg);border:1px solid var(--divider);color:var(--btn-text);border-radius:6px;cursor:pointer;font-size:15px;line-height:1}
.pp-iconbtn:hover{background:var(--btn-hover)}
@keyframes ppdash{to{stroke-dashoffset:-14}}
/* PP-EXT Phase D: Dashboard's Plan/Focus/Review switch — a soft crossfade+rise so tab switches read as a
   deliberate transition between three full-screen modes, not a jump-cut. */
@keyframes ppDashFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
/* PP-EXT Phase 10 (redesign): Pomodoro timer — a soft breathing glow behind the ring while a session runs,
   plus a gentle center-digit pulse each cycle. Both respect prefers-reduced-motion via the --dur tokens. */
@keyframes ppPomoBreath{0%,100%{transform:scale(1);opacity:0.45}50%{transform:scale(1.06);opacity:0.85}}
@keyframes ppPomoPop{0%{transform:scale(0.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.pp-rsz{position:absolute;top:0;bottom:0;right:-4px;width:8px;cursor:col-resize;z-index:8}
.pp-rsz::after{content:"";position:absolute;top:9px;bottom:9px;left:3px;width:2px;border-radius:1px;background:transparent}
.pp-rsz:hover::after{background:var(--focus-ring)}
/* PP-EXT V2.9 §1: text-selection suppression for the three drags that cannot preventDefault on mousedown
   (row drag, section-header drag, column reorder) because the same mousedown must also focus an inline
   editor and place a caret. Applied at DRAG BEGIN (the 4px threshold), never at mousedown.
   Scoped to the board root, never document.body — Journal and description prose stay copyable.
   The input/textarea/contenteditable carve-out is required, not defensive: user-select INHERITS, so
   without it the section rename field and the rich description editor go unselectable mid-drag. */
.pp-dragging,.pp-dragging *{user-select:none!important;-webkit-user-select:none!important;cursor:grabbing!important}
.pp-dragging input,.pp-dragging textarea,.pp-dragging [contenteditable]{user-select:text!important;-webkit-user-select:text!important}

/* PP-EXT: shared component classes (B0 — design foundation). Built on the token scales above;
   intended to replace per-instance inline style objects over time (B3 migrates usages). */
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:var(--r-1)}
.pp-card{background:var(--card-bg);border:1px solid var(--divider);border-radius:var(--r-3);
  padding:var(--sp-3);box-shadow:var(--sh-1);transition:box-shadow var(--dur-med) var(--ease-standard),
  transform var(--dur-med) var(--ease-standard)}
.pp-card--elevated{box-shadow:var(--sh-2)}
.pp-modal{background:var(--card-bg);border:1px solid var(--modal-border);border-radius:var(--r-4);
  box-shadow:var(--sh-3);padding:var(--sp-4)}
.pp-chip{display:inline-flex;align-items:center;gap:var(--sp-0);height:22px;padding:0 var(--sp-1);
  background:var(--chip-bg);border:1px solid var(--divider);border-radius:var(--r-pill);
  font-size:var(--fs-1);line-height:var(--lh-tight);color:var(--text-2);
  transition:background var(--dur-fast) var(--ease-standard)}
.pp-chip:hover{background:var(--btn-hover)}
/* PP-EXT V1.5: the due/recur signal survives the sheet-column cull as one compact timeline chip. */
.pp-due-chip{display:inline-flex;align-items:center;max-width:100%;padding:1px var(--sp-0);border:1px solid currentColor;
  border-radius:var(--r-1);font-size:var(--fs-1);line-height:var(--lh-tight);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:color-mix(in srgb,currentColor 10%,transparent)}
.pp-due-chip--overdue{color:var(--danger)}.pp-due-chip--today{color:var(--success)}
.pp-due-chip--tomorrow{color:var(--due-tomorrow)}.pp-due-chip--week{color:var(--due-week)}
.pp-due-chip--later{color:var(--due-later)}.pp-due-chip--recur{color:var(--success)}
.pp-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-0);
  height:30px;padding:0 var(--sp-2);border-radius:var(--r-2);font-size:var(--fs-2);font-weight:500;
  cursor:pointer;border:1px solid var(--divider);background:var(--btn-bg);color:var(--btn-text);
  transition:background var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard)}
.pp-btn:hover{background:var(--btn-hover)}
.pp-btn:active{background:var(--btn-active)}
.pp-btn--primary{background:var(--focus-ring);border-color:var(--focus-ring);color:var(--on-accent)}
.pp-btn--primary:hover{filter:brightness(1.08)}
.pp-btn--primary:active{filter:brightness(0.96)}
.pp-btn--danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.pp-btn--danger:hover{background:rgba(229,72,77,0.1)}
/* /PP-EXT */

</style>
</helmet>
<!-- PP-EXT (V5 block 23, F10): the shell is rendered inside `zoom`, which scales the USED height as
     well as the contents — so a plain `height:100vh` asked for a full viewport and painted it into
     80% of one, leaving a dead strip a fifth of the window tall at EVERY window size. The height rule
     now divides by the same factor, so the shell fills the real window at any viewport. The zoom
     factor is declared ONCE here as `--pp-shell-zoom` and consumed twice, so the two can never drift.
     Do NOT retune or remove the zoom itself — every size unit in the app, including `uiPt` cursor
     anchoring, was tuned inside it. De-zooming is a Design item for a later cycle. -->
<div style="--pp-shell-zoom:0.8;display:flex;flex-direction:column;height:calc(100vh / var(--pp-shell-zoom));overflow:hidden;zoom:var(--pp-shell-zoom)"><!-- /PP-EXT -->

  <!-- PP-EXT: decluttered top bar — dropped undo/redo/add-task/jump/zoom-preset/± (undo/redo stay reachable via
       Ctrl+Z/Y, zoom via Ctrl+scroll, add-task via the "q" popup / sheet footer row). The context slot
       ({{ topcontext }}) surfaces whatever the active page needs (Plan/Focus/Review tabs, Journal day-nav,
       Archive count) so the per-page header bands could be removed too. -->
  <div style="display:flex;align-items:center;gap:10px;padding:0 16px;height:46px;background:var(--top-bg);border-bottom:1px solid var(--top-border);flex:none">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(150deg,#3b82f6 0%,#6d5ce8 55%,#8957e5 100%);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 6px rgba(59,90,229,0.35),inset 0 1px 0 rgba(255,255,255,0.25)">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">

  migrateAllDayPlanned(tasks){ let n=0; tasks.forEach(t=>{ if(t.allDay && t.planned){ t.planned=0; n++; } }); return n; }
  /* PP-EXT: one-time cleanup for the pin removal. The parser used to stamp a bare day with a 9am
     placeholder and mark it startClock:false; bare days are now plain midnight, so collapse those
     starts and drop the flag back to null (derive). pinStart/pinEnd no longer exist because every
     scheduling shape is derived from the dates. Idempotent: returns the number of rows changed. */
  migratePins(tasks){ let n=0; tasks.forEach(t=>{ let hit=false;
    if(t.startClock===false && t.start!=null){ t.start=this.startOfDay(t.start); t.startClock=null; hit=true; }
    else if(t.startClock===false){ t.startClock=null; hit=true; }
    if('pinStart' in t){ delete t.pinStart; hit=true; }
    if('pinEnd' in t){ delete t.pinEnd; hit=true; }
    if(hit) n++; }); return n; }
  /* PP-EXT (04): drag-pin becomes a LIST. Converts a legacy single `{day,start,dur}` object into a
     one-element list (a whole-task pin — no `partial` flag, the pre-04 meaning). PURE, idempotent;
     returns the number of rows changed. Readers tolerate both shapes, so this is normalization only. */
  migrateDragPinList(tasks){ let n=0; (tasks||[]).forEach(t=>{
    if(t && t.pin && !Array.isArray(t.pin) && t.pin.day!=null){ t.pin=[t.pin]; n++; } }); return n; }
  runOnceMigrations(tasks){
    try{ const done=JSON.parse(this.lsGet('pp-migrations')||'{}')||{};
      if(!done['allday-planned-zero']){ const n=this.migrateAllDayPlanned(tasks); done['allday-planned-zero']=1;
        this.lsSet('pp-migrations', JSON.stringify(done)); if(n) this.saveTasks(tasks); }
      if(!done['schedule-pins-removed']){ const n=this.migratePins(tasks); done['schedule-pins-removed']=1;
        this.lsSet('pp-migrations', JSON.stringify(done)); if(n) this.saveTasks(tasks); }
      /* PP-EXT V2.6: seed sections from primary @tags, once, at promotion threshold 2. Guarded like the
         two above; only writes pp-sections when the migration actually promoted something. */
      if(!done['sections-from-primary-tag']){ const r=this.migrateSectionsFromTags(tasks);
        done['sections-from-primary-tag']=1; this.lsSet('pp-migrations', JSON.stringify(done));
        if(r.sections.length){ try{ this.lsSet('pp-sections', JSON.stringify(r.sections)); }catch(e){} }
        if(r.changed) this.saveTasks(tasks); }
      /* PP-EXT V2.11: retire "Off". `included===false` no longer exists as a state, so any task still
         holding it is folded into unpressed. Left in place it would be a value no predicate reads and no
         UI can clear — a task stuck out of today with no control that returns it. */
      if(!done['retire-off']){ const n=this.migrateRetireOff(tasks); done['retire-off']=1;
        this.lsSet('pp-migrations', JSON.stringify(done)); if(n) this.saveTasks(tasks); }
      /* PP-EXT (04): normalize the drag-pin object into the list shape. */
      if(!done['drag-pin-list']){ const n=this.migrateDragPinList(tasks); done['drag-pin-list']=1;
        this.lsSet('pp-migrations', JSON.stringify(done)); if(n) this.saveTasks(tasks); }
      /* PP-EXT (owner 2026-08-13): "Sections should not be a tag." This is the RETROACTIVE half.
         `migrateSectionsFromTags` now consumes the tag it promotes, but that migration is guarded by its
         own once-flag and has already run in every existing workspace — including the owner's — so fixing
         it there alone would fix nobody's actual data. This second flag re-sweeps a workspace that ran the
         old version, and is a no-op for one created after it. Separate flag, not a bumped one, because
         re-running `sections-from-primary-tag` would also re-promote tags in a workspace where the user has
         since deleted those sections on purpose. */
      if(!done['strip-section-tags']){ const n=this.stripSectionTags(tasks); done['strip-section-tags']=1;
        this.lsSet('pp-migrations', JSON.stringify(done)); if(n) this.saveTasks(tasks); }
      /* PP-EXT (owner 2026-08-13): the app's own calendar is IMPLICIT and no longer contributes a tag.
         Import stamped "@chronocompose" onto every task it created, so the forward fix alone would leave
         the existing ones wearing it forever. Same shape as strip-section-tags directly above, and the
         same principle behind both: a container's name is not one of the user's tags. */
      if(!done['implicit-own-calendar-tag']){ const n=this.stripOwnCalendarTag(tasks);
        done['implicit-own-calendar-tag']=1; this.lsSet('pp-migrations', JSON.stringify(done));
        if(n) this.saveTasks(tasks); }
      /* PP-EXT (owner 2026-08-14): "get rid of the calendar tags" — the retroactive half for EVERY
         calendar, not just the reserved one.
         This is the ONE flag in `runOnceMigrations` that is deliberately NOT recorded unconditionally, and
         the reason is a real trap: `stripCalendarTags` needs the calendar SUMMARIES to know which label to
         remove, but `loadGcal` rebuilds `calendars: []` on every boot and only refills it after a network
         round trip. Stamping the flag here at constructor time would therefore claim the sweep was done in
         the overwhelmingly common case where it could not possibly have run — permanently skipping it.
         So the flag is written only once a real calendar list exists. Until then the sweep re-runs on each
         boot, which is free: it is pure and idempotent. `mergeCalendarEvents` sheds the tag per task on
         import as well, and it ALWAYS has the summaries, so a workspace that syncs is cleaned either way.
         NOTE ON `this.state`: it does not exist yet at this call site (the constructor assigns it from the
         seed this method returns), so the list is read through `loadGcal`. In practice that returns an
         empty `calendars`, which is precisely why the flag must stay unrecorded here and why
         `gcalListCalendars` carries the second half of this migration — see `sweepCalendarTags`. */
      if(!done['no-calendar-tags']){
        let cals=[]; try{ cals=(this.loadGcal()||{}).calendars||[]; }catch(_){}
        const n=this.stripCalendarTags(tasks, cals);
        if(cals.length){ done['no-calendar-tags']=1; this.lsSet('pp-migrations', JSON.stringify(done)); }
        if(n) this.saveTasks(tasks); } }catch(e){}
    return tasks;
  }
  /* PURE (mutates the array it is handed, returns the count) → unit-tested. Deliberately does NOT snooze
     the tasks it converts, unlike `setIncludedOff`: the user turned these off before unpressed could bring
     anything back, so honouring the new rule means letting their triggers run. */
  migrateRetireOff(tasks){
    let n=0; (tasks||[]).forEach(t=>{ if(t && t.included===false){ t.included=null; n++; } }); return n;
  }
  /* PP-EXT: parse a calendar all-day date ("YYYY-MM-DD") as LOCAL midnight. Using new Date(str) treats it as
     UTC, which shifts the day and injects a bogus time (e.g. 17:00) depending on the viewer's timezone. */
  parseYMD(s){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? new Date(+m[1],+m[2]-1,+m[3]).getTime() : new Date(s).getTime(); }
  /* PP-EXT: whole-app JSON backup — until a backend exists, localStorage is the ONLY copy of the data.
     collectBackup/applyBackup are pure vs localStorage (unit-testable); export/import wrap them with DOM I/O.
     Non-JSON stores (pp-theme holds a bare string) round-trip via a {__raw} wrapper. */
  BACKUP_KEYS(){ return ['pp-tasks','pp-run','pp-settings','pp-gcal','pp-prefs','pp-theme','pp-migrations','pp-habits','pp-journal','pp-sections','pp-scratch','pp-journal-prompts']; /* pp-habits/pp-journal: Phase 9; pp-sections: V2.6, pp-scratch: V3.1, pp-journal-prompts: V3.2 (all local-only until the deferred sync batch, so backup is their ONLY portability) */ }
  collectBackup(){ const data={};
    this.BACKUP_KEYS().forEach(k=>{ const v=this.lsGet(k); if(v==null) return; /* PP-EXT: active-workspace scoped (pp-theme stays global) */
      try{ data[k]=JSON.parse(v); }catch(e){ data[k]={__raw:v}; } });
    /* PP-EXT (16/F9): stamp the namespace this dump came from. collectBackup/applyBackup are wsKey-scoped,
       so a backup is a snapshot of ONE workspace, but nothing in the file used to say which — export
       signed in, restore signed out, and it silently overwrote the anon namespace instead. This matters
       more than it looks: backup is the ONLY portability path for pp-scratch, pp-journal-prompts and
       pp-sections, none of which sync, so a wrong-namespace restore is unrecoverable. */
    return {app:'ChronoCompose', version:1, exportedAt:new Date().toISOString(),
      workspace:(this._workspace||'anon'), data}; }
  /* PP-EXT (16/F9): PURE — the confirmation text for an import, naming the namespace that will be
     OVERWRITTEN (always the active one; applyBackup never writes across namespaces) and, when the dump
     came from a different one, saying so in words rather than leaving the user to guess. A legacy dump
     with no `workspace` stamp is unknown, not mismatched, so it must not raise a false alarm. */
  backupImportPrompt(obj){
    const here=(this._workspace||'anon'), from=(obj && obj.workspace) || null;
    let m='Replace ALL ChronoCompose data in the "'+here+'" workspace with this backup? '
      +'Current data in that workspace will be overwritten.';
    if(from && from!==here) m+='\n\nWarning: this backup was taken from a different namespace ("'+from
      +'"). It will be restored into "'+here+'", not back into "'+from+'".';
    return m; }
  applyBackup(obj){ if(!obj||obj.app!=='ChronoCompose'||!obj.data||typeof obj.data!=='object') throw new Error('Not a ChronoCompose backup file.');
    let n=0; this.BACKUP_KEYS().forEach(k=>{ if(!(k in obj.data)) return; const v=obj.data[k];
      try{ this.lsSet(k, (v&&typeof v==='object'&&typeof v.__raw==='string')?v.__raw:JSON.stringify(v)); n++; }catch(e){} }); /* PP-EXT: active-workspace scoped */
    return n; }
  exportBackup(){ try{ const blob=new Blob([JSON.stringify(this.collectBackup(),null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    const d=new Date(); a.download='chronocompose-backup-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); }catch(e){ alert('Export failed: '+e.message); } }
  importBackupFile(file){ if(!file) return; const rd=new FileReader();
    rd.onload=()=>{ try{ const obj=JSON.parse(rd.result);
        if(!confirm(this.backupImportPrompt(obj))) return; /* PP-EXT (16/F9): name the namespace being overwritten */
        this.applyBackup(obj); location.reload(); }
      catch(e){ alert('Import failed: '+e.message); } };
    rd.readAsText(file); }
  /* ==== /PP-EXT ==== */

  /* ---------- prefs persistence ---------- */
  loadPrefs(){ try{ return JSON.parse(this.lsGet('pp-prefs')||'{}')||{}; }catch(e){ return {}; } }
  savePrefs(patch){ try{ const p=Object.assign(this.loadPrefs(),patch); this.lsSet('pp-prefs', JSON.stringify(p)); }catch(e){} }
  applyOrder(tasks, order){
    const byId={}; tasks.forEach(t=>byId[t.id]=t);
    const out=[]; order.forEach(id=>{ if(byId[id]){ out.push(byId[id]); delete byId[id]; } });
    tasks.forEach(t=>{ if(byId[t.id]) out.push(t); });
    return out;
  }
  persistRowOrder(){ this.savePrefs({rowOrder: this.state.tasks.map(t=>t.id)}); }

  /* ==== PP-EXT (31): ALPHA USAGE TRACKER ====================================================
     Owner ask, verbatim: "please build in a timestamped keystroke and action tracker to track my alpha
     test usage analytics that saves to local disk somewhere you can find it".

     THE BOUNDARY, stated once and enforced by `trackFieldKind` alone, so there is exactly one place to
     audit: **this records key IDENTITY and ACTION NAMES. It never records typed content.**

       · A key that is not a printable character (Enter, Escape, Tab, arrows, Backspace, F-keys) is
         logged by NAME, because a name carries no content.
       · A printable character typed into a text input, textarea or contenteditable is NEVER logged.
         The burst it belongs to is coalesced into ONE `type` event carrying a COUNT and the field's id.
       · A printable character typed with NOTHING focused is a SHORTCUT ("q", "a", "n"), not content,
         and is logged by name.
       · A password field or any auth surface produces NOTHING — no key name, no count, no event. A
         character count of a credential is already a weak leak, so the whole class is dropped rather
         than reduced. Same for anything whose id/name/marker matches TRACK_SECRET_RE.
       · Journal and scratchpad BODY prose is counted, never transcribed. Task titles, journal text and
         scratchpad text never appear as content anywhere in the log — ids and counts only.

     No value read off any element is ever put in an event. There is no `paste`, `input` or `change`
     hook, precisely because those carry values; the only text-adjacent signal is a length.

     Local-only by construction: the buffer lives in a wsKey-scoped `pp-usage` store, it is not in
     SYNC_FIELDS, not in KV_TABLES, and not in BACKUP_KEYS (a usage log is not user data to restore).
     Two sinks: the scoped store always, and — on demand or on a local run — a `.jsonl` file. */

  /* Session id: one per page load, sortable, and containing no account identity. */
  trackSession(){
    if(!this._trackSession){
      const d=new Date();
      const p=n=>String(n).padStart(2,'0');
      this._trackSession = d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())
        +'-'+Math.random().toString(36).slice(2,7);
      this._trackT0 = Date.now();
    }
    return this._trackSession;
  }
  trackEnabled(){ return !!(this.state && this.state.settings && this.state.settings.usageTracking); }

  /* ---- THE REDACTION GATE ------------------------------------------------------------------
     Pure over a plain descriptor so it can be unit-tested without a DOM, and so the DOM adapter below
     stays a dumb field-reader with no policy in it. Returns:
       'secret' → drop the event entirely (password / auth surface)
       'prose'  → count only, named by id (journal, scratchpad)
       'text'   → count only (any other editable field)
       null     → not an editable field at all; a printable key here is a shortcut, not content */
  trackFieldKind(desc){
    if(!desc) return null;
    const tag=String(desc.tag||'').toUpperCase();
    const type=String(desc.type||'').toLowerCase();
    if(type==='password') return 'secret';
    if(desc.auth) return 'secret';
    /* id / name / autocomplete are IDENTIFIERS, never values — matching them cannot leak content. */
    const ident=[desc.id,desc.name,desc.autocomplete].filter(Boolean).join(' ');
    if(ident && this.TRACK_SECRET_RE.test(ident)) return 'secret';
    const editable = desc.contentEditable===true || tag==='TEXTAREA'
      || (tag==='INPUT' && type!=='checkbox' && type!=='radio' && type!=='button' && type!=='submit' && type!=='range' && type!=='file');
    if(!editable) return null;
    if(desc.id && this.TRACK_PROSE_IDS[desc.id]) return 'prose';
    return 'text';
  }
  /* DOM adapter: walk the target and its ancestors into a descriptor. Ancestors matter because an auth
     surface (or the scratchpad) is a CONTAINER — a contenteditable inside it must inherit its verdict.
     Uses parentElement rather than closest() so the mocked DOM in tests can drive it too. */
  trackDescribe(el){
    if(!el) return null;
    const d={ tag:el.tagName, type:el.type, id:el.id||'', name:el.name||'',
      autocomplete:el.autocomplete||'', contentEditable:!!el.isContentEditable, auth:false };
    let n=el, hops=0;
    while(n && hops++<12){
      const ds=n.dataset||{};
      if(ds.ppAuth!=null || (n.id && this.TRACK_SECRET_RE.test(n.id))) d.auth=true;
      if(n.id && this.TRACK_PROSE_IDS[n.id]) d.id=n.id; /* inherit the prose surface's id */
      n=n.parentElement;
    }
    return d;
  }
  /* The one key funnel. `e` is a real KeyboardEvent in the app and a plain object under test. */
  trackKey(e){
    if(!this.trackEnabled() || !e || !e.key) return;
    const kind=this.trackFieldKind(this.trackDescribe(e.target));
    if(kind==='secret') return; /* hard exclusion: nothing at all, not even a count */
    /* A printable is exactly one grapheme with no ctrl/meta. Alt+letter is a combo, not typing. */
    const printable = e.key.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey;
    if(printable && kind){ this.trackTyping(kind==='prose'?('prose:'+(this.trackDescribe(e.target).id||'?')):'text'); return; }
    this.trackTypingFlush(); /* a non-printable ends the burst before the key that ended it is logged */
    const mods=(e.ctrlKey?'Ctrl+':'')+(e.metaKey?'Meta+':'')+(e.altKey?'Alt+':'')+(e.shiftKey&&e.key.length>1?'Shift+':'');
    this.track('key', { k:mods+e.key, field:kind||null });
  }
  /* Typing coalescer: characters never leave this method — only how many there were. */
  trackTyping(field){
    const b=this._trackBurst;
    if(b && b.field===field && (Date.now()-b.last)<=this.TRACK_TYPE_IDLE_MS){ b.n++; b.last=Date.now(); }
    else { this.trackTypingFlush(); this._trackBurst={ field, n:1, last:Date.now() }; }
    try{ clearTimeout(this._trackBurstT); this._trackBurstT=setTimeout(()=>this.trackTypingFlush(), this.TRACK_TYPE_IDLE_MS); }catch(err){}
  }
  trackTypingFlush(){
    const b=this._trackBurst; if(!b) return; this._trackBurst=null;
    try{ clearTimeout(this._trackBurstT); }catch(err){}
    this.track('type', { field:b.field, n:b.n });
  }
  /* Named, discrete actions — the valuable half. Callers pass NAMES and IDS, never values. */
  trackAction(name, data){ if(this.trackEnabled()) this.track('action', Object.assign({ a:name }, data||{})); }
  /* Task-mutation choke point: one call from commit() replaces sprinkling call sites. Ids and counts. */
  trackCommit(prev, next){
    if(!this.trackEnabled()) return;
    const before={}; (prev||[]).forEach(t=>before[t.id]=t);
    const after={}; (next||[]).forEach(t=>after[t.id]=t);
    const created=(next||[]).filter(t=>!before[t.id]).map(t=>t.id);
    const deleted=(prev||[]).filter(t=>!after[t.id]).map(t=>t.id);
    const completed=(next||[]).filter(t=>after[t.id] && before[t.id] && (before[t.id].pct||0)<100 && (t.pct||0)>=100).map(t=>t.id);
    const archived=(next||[]).filter(t=>before[t.id] && !before[t.id].archivedAt && t.archivedAt).map(t=>t.id);
    const edited=(next||[]).filter(t=>before[t.id] && before[t.id]!==t).length;
    if(created.length) this.trackAction('task.create',{ ids:created });
    if(deleted.length) this.trackAction('task.delete',{ ids:deleted });
    if(completed.length) this.trackAction('task.complete',{ ids:completed });
    if(archived.length) this.trackAction('task.archive',{ ids:archived });
    if(!created.length && !deleted.length && !completed.length && !archived.length) this.trackAction('task.commit',{ n:edited });
  }
  /* Drop funnel: ONE call at the top of onMouseUp names whichever drag surface is live. */
  trackDrop(){
    if(!this.trackEnabled()) return;
    const d = this._edgeDrag ? ['timeline-edge', this._edgeDrag.id, this._edgeDrag.moved]
      : this._blockDrag ? ['timeline-block', this._blockDrag.id, this._blockDrag.moved]
      : this._cardDrag ? ['card', this._cardDrag.id, !!this._cardDrag.overZone]
      : this._rowDrag ? ['sheet-row', this._rowDrag.primaryId, !!this.rowDragMoved]
      : this._secDrag ? ['section', this._secDrag.id, true]
      : this.dragState ? ['gantt-bar', this.dragState.id, true] : null;
    if(d) this.trackAction('drag.drop', { surface:d[0], id:d[1], moved:!!d[2] });
  }

  /* ---- buffer + sinks ---------------------------------------------------------------------- */
  trackBuffer(){ if(!this._trackBuf) this._trackBuf=this.trackLoad(); return this._trackBuf; }
  trackLoad(){ try{ const a=JSON.parse(this.lsGet(this.TRACK_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
  /* The single write point. Every event carries the schema version, absolute epoch ms, session-relative
     ms, and the session id — so a file can be read on its own, out of order, years later. */
  track(t, data){
    if(!this.trackEnabled()) return null;
    const sid=this.trackSession();
    const now=Date.now();
    const ev=Object.assign({ v:this.TRACK_SCHEMA, s:sid, ts:now, rel:now-(this._trackT0||now), t }, data||{});
    const buf=this.trackBuffer();
    buf.push(ev);
    /* Hard cap, oldest-first eviction: a marathon session degrades to "the last TRACK_CAP events"
       rather than throwing a QuotaExceededError and losing the lot. */
    if(buf.length>this.TRACK_CAP) buf.splice(0, buf.length-this.TRACK_CAP);
    /* PP-EXT (33): enqueue for the Supabase sink. The SAME object reference the redaction gate produced
       goes into the upload queue — there is no second construction of an event on the upload path, so
       there is no place for raw content to be reintroduced. Same hard cap, same oldest-first eviction:
       an upload that keeps failing degrades to "the last TRACK_CAP events", it never blocks or throws. */
    if(!this._trackUpQ) this._trackUpQ=[];
    this._trackUpQ.push(ev);
    if(this._trackUpQ.length>this.TRACK_CAP) this._trackUpQ.splice(0, this._trackUpQ.length-this.TRACK_CAP);
    this._trackCounts=this._trackCounts||{};
    this._trackCounts[t]=(this._trackCounts[t]||0)+1;
    this.trackScheduleFlush();
    return ev;
  }
  trackScheduleFlush(){
    try{ if(this._trackFlushT) return;
      this._trackFlushT=setTimeout(()=>{ this._trackFlushT=0; this.trackFlush(); }, this.TRACK_FLUSH_MS);
    }catch(e){ /* no timers under test — trackFlush is called explicitly there */ }
  }
  /* Persist to the scoped store, then hand the new lines to the disk sink. Idempotent and safe to call
     from visibilitychange/pagehide, which is what stops a closed tab from losing the session. */
  trackFlush(teardown){
    this.trackTypingFlush();
    const buf=this.trackBuffer();
    try{ this.lsSet(this.TRACK_KEY, JSON.stringify(buf)); }catch(e){}
    const from=this._trackSent||0;
    if(buf.length>from){ const lines=buf.slice(from); this._trackSent=buf.length; this.trackPost(lines); }
    this.trackUpload(teardown); /* PP-EXT (33): third sink — Supabase. No-op when signed out or unconfigured. */
    return buf.length;
  }

  /* ---- PP-EXT (33): Supabase upload sink -----------------------------------------------------
     Only for signed-in sessions. An anonymous/local workspace has no auth.uid(), `anon` holds no grant
     on usage_events (migration 0010, matching 0002), and that is CORRECT, not an error condition — such
     a session simply keeps buffering locally and exporting by hand. */
  trackUploadReady(){
    const c=window.PP_CONFIG||{};
    if(!this.trackEnabled()) return null;
    if(!c.supabaseUrl || !c.supabaseAnonKey) return null;
    const s=this._session;
    if(!s || !s.user || !s.access_token) return null; /* signed out → skip silently */
    return { url:String(c.supabaseUrl).replace(/\/+$/,'')+'/rest/v1/'+this.TRACK_UP_TABLE,
      key:c.supabaseAnonKey, token:s.access_token };
  }
  /* Rows are a thin envelope around the event. `payload` is the event object VERBATIM — no re-derivation,
     no re-serialization of anything the gate did not emit — and `owner_id` is left to auth.uid(). */
  trackUploadRows(evs){
    return (evs||[]).map(e=>({ session:e.s, ts:e.ts, payload:e }));
  }
  /* Batched on the existing flush points, never per event. `teardown` marks the visibilitychange/pagehide
     path: there the request must outlive the document, which is what the fetch keepalive flag is for.
     NOTE (deviation from the block-33 sketch, deliberate): navigator.sendBeacon cannot carry the
     Authorization/apikey headers PostgREST requires, and Supabase offers no query-param route for a user
     JWT — a beacon would arrive unauthenticated and be rejected by RLS. `fetch(..., {keepalive:true})`
     sets the SAME Fetch keepalive flag sendBeacon uses internally, so the teardown guarantee is kept
     while the request stays authenticated. */
  trackUpload(teardown){
    const cfg=this.trackUploadReady();
    const q=this._trackUpQ||[];
    if(!cfg || !q.length || this._trackUpBusy) return null;
    const batch=q.slice(0, this.TRACK_UP_BATCH);
    this._trackUpBusy=true;
    const done=(ok)=>{
      this._trackUpBusy=false;
      /* Success: drop exactly what went up, by identity, so events appended DURING the request survive.
         Failure: touch nothing. The events stay queued and the next flush retries them. */
      if(ok){ const sent=new Set(batch); this._trackUpQ=(this._trackUpQ||[]).filter(e=>!sent.has(e));

    };

  selectCol(e,k){

      planned:planned,spent:spent,goal:goal,labels:labels||[],description:'',
      completion: pct>=100 ? B+offEnd*D : null

      mk('t1','Research project + reading list','Proportional',0,2,1,[],20,180,20,'Send 3 emails; read 2 papers',['research']),
      mk('t2','AI project','Proportional',0,4,2,[],35,240,60,'Ship the scheduler MVP',['sim','code']),
      mk('t3','Practice problems','Proportional',0,0,3,[],0,60,0,'2 mediums',['study']),
      mk('t4','Online course lectures','Proportional',0,3,3,[],10,120,0,'',['study']),

  /* ==== PP-EXT V0.2: empty state + one-time 3-step first-run + opt-in labeled demo ====

       - renderFirstRun paints a legible empty state (with the 3-step coach on first run) when there are
         no tasks, and a floating coach once the first task exists — until the user dismisses it.

  loadDemo(){

    const cur=this.state.tasks; /* PP-EXT */

  isEditingTarget(e){

  }
  /* PP-EXT B4: the row-select Tab=indent shortcut below was hijacking Tab globally any time a task row was
     selected (a very common state — any row click), so pressing Tab never moved focus at all, even while
     focus was on a real control or a modal was open. Guard it to only fire when the keydown target isn't
     itself a focusable/interactive element, so normal Tab traversal (buttons, links, our tabIndex divs,
     inputs) keeps working; indent/outdent still works via Tab when a row is selected purely by mouse. */

           1. an in-flight drag  (`_edgeDrag`, then `_blockDrag`)

              settingsOpen › colMenu › selCols › menu
           3. the open detail sheet (`detailId`)
           4. the row selection (`selectedIds` + `selCursor`) — only when not typing.
         Exactly one rung fires per press, so each Escape undoes one layer of context and nothing more.
         Adding a rung means putting it in transience order, never at the top for convenience. */
      /* PP-EXT (04b): a drag in flight outranks every overlay — it is the most transient thing on
         screen and the only one the pointer is still holding. Dropping `_blockDrag` makes the block
         repaint at its real start and makes onMouseUp fall through without pinning, so the release
         that follows is a no-op: nothing is committed, so there is nothing to undo. */

         nothing is written until the release, so dropping the record IS the cancel. */
      if(this._edgeDrag){ this._edgeDrag=null; this.forceUpdate(); return; }
      if(this._blockDrag){ this._blockDrag=null; this.forceUpdate(); return; }

      else if(this.state.pctPop) this.closePctPop(); else if(this.state.inclPick) this.closeInclPick();
      else if(this.state.barMenu) this.closeBarMenu(); /* PP-EXT V1.4: bar menu sits under the popups it opens */
      else if(this.state.quickOpen) this.setState({quickOpen:false}); else if(this.state.scopePrompt) this.closeScope(); else if(this.state.settingsOpen) this.setState({settingsOpen:false}); else if(this.state.colMenu) this.setState({colMenu:null}); else if(this.state.selCols.length) this.setState({selCols:[]}); else if(this.state.menu) this.closeMenu(); else if(this.state.detailId) this.closeDetail();

         the selection. Deliberately last so it can never steal from the rungs above it (a drag cancel or
         an overlay close must still win), and guarded by `isEditingTarget` so Escape pressed inside an
         inline title editor, a description, or the quick-add box dismisses/leaves that field without
         also wiping the row the user is editing. */
      else if(!this.isEditingTarget(e)) this.clearSelection();

  anyRunning(){ const r=this.state.running; return !!(r && Object.keys(r).length); } /* PP-EXT: running is a map (multitasking) */
  /* PP-EXT V2.4: the timer policy lives here so every surface (sheet row, Focus row, timeline block,
     Pomodoro, shape-driven auto-start) obeys it without its own branch. Default `multitask:false` is a
     STRICT single timer — starting one stops every other, crediting each stopped task normally through
     stopTimerAt. Flipping settings.multitask on restores the legacy concurrency. Was: unconditional
     multitasking ("starting a timer does NOT stop the others"). */
  multitaskOn(){ return !!(this.state.settings && this.state.settings.multitask); }
  startTimer(id){ if(this.isRunning(id)) return;
    this.trackAction('timer.start',{ id }); /* PP-EXT (31) */
    if(!this.multitaskOn()) this.stopOtherTimers(id);
    const now=Date.now();
    const r=Object.assign({}, this.state.running, {[id]:{startedAt:now, beat:now}});
    this.setState({running:r, nowTick:now}); this.saveRun(r); }
  /* PP-EXT V2.4: stop every running timer except `keepId`. Each stop goes through stopTimerAt so spent /
     spentByDay / undo stay identical to a manual stop; the snapshot is taken first because stopTimerAt
     rewrites state.running underneath the loop. */
  stopOtherTimers(keepId){ Object.keys(this.state.running||{}).forEach(k=>{ if(k!==String(keepId)) this.stopTimerAt(k, Date.now()); }); }
  /* PP-EXT V2.4: click-to-activate. Making a task active starts its timer and pulls it to the front of
     today's plan — V2.1 already gives the active task the first slot (orderingSeam sorts on `active`, and
     its notBefore is clamped to now), so activation needs no scheduling change of its own. Switching
     active stops ONLY the prior active's timer, so independently-started multitask timers keep running;
     in strict mode startTimer then stops the rest anyway. activeTaskId() stays derived from the most
     recent start, so activation persists through pp-run with no new field. */
  activateTask(id){ if(this.isActiveTask({id})) return;
    const prev=this.activeTaskId();
    if(prev!=null && prev!==String(id) && this.isRunning(prev)) this.stopTimer(prev);
    /* already running but not the active one (multitask mode): close its segment and reopen it so the
       derived "most recently started" selector lands on it. stopTimerAt credits, so no time is lost. */
    if(this.isRunning(id)) this.stopTimer(id);

  stopTimer(id){ this.trackAction('timer.stop',{ id }); /* PP-EXT (31) */ this.stopTimerAt(id, Date.now()); }
  /* PP-EXT: stop crediting THIS task up to `ts` (clamped to [startedAt, now]). Manual stop and the pinned-end
     auto-pause both credit up to now — a running timer counts wall-clock even across a closed tab / sleep. */
  stopTimerAt(id, ts){ const run=this.state.running||{}; const r=run[id]; if(!r) return;
    const end=Math.min(Math.max(ts, r.startedAt), Date.now());
    const add=Math.max(0,(end-r.startedAt)/60000);
    /* accumulate fractional minutes (fmtDur rounds for display); rounding on every stop lost time
       across many short sessions. */
    /* PP-EXT: credit both the lifetime total and the per-day ledger (keyed by the segment's START day —
       a session running across midnight lumps to its start day, matching the single-credit model; see getSpentOn). */
    const dk=this.ymdOf(r.startedAt);
    this.commit(tasks=>{ const t=tasks.find(x=>x.id===id); if(t){ t.spent=(t.spent||0)+add;
      const by=Object.assign({}, t.spentByDay); by[dk]=(by[dk]||0)+add; t.spentByDay=by; } });
    const nr=Object.assign({}, this.state.running); delete nr[id];
    this.setState({running:nr}); this.saveRun(nr); }
  /* PP-EXT: heartbeat across ALL running timers, called from the 1s run tick and once on mount. Timers persist
     across sleep / a closed tab (owner choice) — there is no inactivity auto-stop; this only refreshes the
     persisted beat every TIMER_BEAT_MS so pp-run stays current. */
  timerHeartbeat(){ const cur=this.state.running||{}; if(!Object.keys(cur).length) return;
    const now=Date.now(); let changed=false; const nr=Object.assign({}, cur);
    Object.keys(cur).forEach(id=>{ const r=cur[id]; if(now-(r.beat||r.startedAt)>=this.TIMER_BEAT_MS){ nr[id]=Object.assign({},r,{beat:now}); changed=true; } });
    if(changed){ this.setState({running:nr}); this.saveRun(nr); } }
  toggleTimer(id){ if(this.isRunning(id)) this.stopTimer(id); else this.startTimer(id); }
  /* PP-EXT: shape-driven auto timers. A fixed appointment auto-starts its timer when the clock reaches its
     start and auto-pauses silently (no prompt) at its end. V2.4: it routes through startTimer, so under the
     default strict single-timer policy the arriving appointment stops whatever was running (you are at the
     appointment now); with `multitask` on it stacks, as it always did. A clocked start
     without an end never auto-starts because it has no defined stop; its notification remains the reminder.
     Decisions are pure (autoTimerPlan) so they're unit-testable; autoTimerTick applies them. */
  autoTimerPlan(now){ const start=[], pause=[]; (this.state.tasks||[]).forEach(t=>{
      if(this.isMilestone(t)||t.archivedAt) return;
      if(!this.isFixedToday(t)) return;
      const oc=this.occOf(t); const startMs=oc.start; const endMs=oc.end; const key=t.id+':'+startMs;
      const running=this.isRunning(t.id);
      if(running&&now>=endMs){ if(!this._autoPaused[key]) pause.push(t.id); return; }
      if(now>=startMs&&now<endMs&&!running&&!this._autoDone[key]) start.push(t.id);
    }); return {start, pause}; }
  autoTimerTick(){ const now=Date.now(); const plan=this.autoTimerPlan(now);
    plan.start.forEach(id=>{ const t=this.state.tasks.find(x=>x.id===id); if(!t) return;
      this._autoDone[id+':'+this.occOf(t).start]=true; this.startTimer(id); });
    plan.pause.forEach(id=>{ const t=this.state.tasks.find(x=>x.id===id); if(!t) return;
      this._autoPaused[id+':'+this.occOf(t).start]=true; this.stopTimer(id); /* PP-EXT: silent — no prompt/note */ }); }

  /* ==== PP-EXT Phase 10: Pomodoro — work/break cycles bound to the existing task timer. Session persists in
     `pp-pomo` so a reload resumes it (transitions only advance while the tab is open — the same "no background
     worker" limit as notifications). The decision logic (pomoState / pomoAdvance) is pure & unit-tested; the
     control methods apply it (bind the task timer, fire the interval-end notification). ==== */
  loadPomo(){ try{ const p=JSON.parse(this.lsGet('pp-pomo')||'null'); return (p&&typeof p==='object'&&p.phase)?p:null; }catch(e){ return null; } }
  savePomo(p){ try{ if(p) this.lsSet('pp-pomo', JSON.stringify(p)); else this.lsRemove('pp-pomo'); }catch(e){} }
  pomoActive(){ return !!this.state.pomo; }
  /* PP-EXT: the task whose block currently spans "now" in today's packed timeline — the pomodoro picker
     defaults to this so starting a session binds the thing you're actually supposed to be doing right now. */
  currentTimelineTaskId(){
    try{ const data=this.buildDayTimeline(this.startOfToday()); const now=this.state.nowTick||Date.now();
      const c=(data.chunks||[]).find(c=>c.id && c.type!=='meal' && c.start!=null && c.end!=null && now>=c.start && now<c.end);
      return c?c.id:null; }catch(e){ return null; }
  }
  /* Lazily seeds the (unset) picker with the active timeline task the first time the picker is shown, without
     stomping a pick the user already made. */
  pomoDefaultPick(){ if(this._pomoPick==null) this._pomoPick=this.currentTimelineTaskId()||''; return this._pomoPick; }
  pomoCfg(){ return Object.assign({work:25,break:5,long:15,cycles:4}, (this.state.settings&&this.state.settings.pomo)||{}); }
  /* PURE: minutes → ms for a phase (min 1 min so a mis-set 0 can't spin). */
  pomoPhaseDur(phase, s){ s=s||this.pomoCfg(); const m = phase==='break'?s.break : phase==='long'?s.long : s.work; return Math.max(1, +m||1)*60000; }
  /* PURE: the live state of a session at `now` — current phase, elapsed/remaining, and whether the phase is done. */
  pomoState(pomo, now, s){ if(!pomo||!pomo.phase) return null; s=s||this.pomoCfg();
    const durMs=this.pomoPhaseDur(pomo.phase, s); const elapsedMs=Math.max(0, now-(pomo.phaseStart||now));
    return { phase:pomo.phase, cycle:pomo.cycle||0, durMs, elapsedMs, remainingMs:Math.max(0, durMs-elapsedMs), done: elapsedMs>=durMs }; }
  /* PURE: the next session after a phase completes. work → break (or long every `cycles` work sessions);
     break/long → work. `phaseStart` restarts at `now` (a closed tab pauses the cycle rather than skipping many). */
  pomoAdvance(pomo, s, now){ s=s||this.pomoCfg(); const cyc=pomo.cycle||0; let phase, cycle;
    if(pomo.phase==='work'){ const nc=cyc+1; if(nc>=Math.max(1, s.cycles||4)){ phase='long'; cycle=nc; } else { phase='break'; cycle=nc; } }
    else if(pomo.phase==='long'){ phase='work'; cycle=0; }

  /* Bind the task timer to the phase: work → its timer runs; break/long → paused. No-op when standalone (no task). */
  applyPomoTimer(pomo){ const tid=pomo&&pomo.taskId; if(!tid || !this.state.tasks.find(t=>t.id===tid)) return;
    const work=pomo.phase==='work';
    if(work && !this.isRunning(tid)) this.startTimer(tid);

  startPomodoro(taskId){ const now=Date.now(); const pomo={ taskId: taskId||null, phase:'work', phaseStart:now, cycle:0 };

  stopPomodoro(){ const p=this.state.pomo; if(p && p.taskId && p.phase==='work' && this.isRunning(p.taskId)) this.stopTimer(p.taskId);
    this.setState({pomo:null}); this.savePomo(null); }
  /* Manual skip → jump to the next phase now (undo-free; it's ephemeral session state, not a task mutation). */

  /* Called from the tick loops: when the current phase is done, roll to the next and fire the interval-end alert. */
  pomoTick(now){ now=now||Date.now(); const p=this.state.pomo; if(!p) return;
    const st=this.pomoState(p, now); if(!st || !st.done) return;

    this.setState({pomo:next}); this.savePomo(next); this.applyPomoTimer(next); this.pomoNotify(p.phase, next); }
  pomoNotify(fromPhase, next){ if(!this.notifyOn('pomodoro')) return; if(this.notifyPermission()!=='granted') return;
    const toBreak = fromPhase==='work';
    const title = toBreak ? (next.phase==='long'?'🍅 Long break':'🍅 Break time') : '🍅 Back to focus';
    const body = toBreak ? ('Work interval done — take a'+(next.phase==='long'?' long':'')+' break.') : 'Break over — start your next focus interval.';
    try{ const n=new Notification(title,{ body, tag:'pomo' }); setTimeout(()=>{ try{ n.close(); }catch(e){} }, 8000); }catch(e){} }
  /* ==== /PP-EXT Phase 10: Pomodoro ==== */

  /* ===== PP-EXT Phase 8: notifications ===== */
  /* Fired-once ledger + last morning-summary day. Persisted so a reload doesn't re-fire a passed trigger.
     Prune fired keys older than a few days so the map stays bounded (they're one-shot per occurrence). */
  loadNotify(){ let n; try{ n=JSON.parse(this.lsGet('pp-notify')||'{}'); }catch(e){ n={}; }
    n=n||{}; if(!n.fired||typeof n.fired!=='object') n.fired={};
    const cut=Date.now()-3*86400000; Object.keys(n.fired).forEach(k=>{ if((+n.fired[k]||0)<cut) delete n.fired[k]; });
    return { fired:n.fired, summaryDay:n.summaryDay||null }; }
  saveNotify(){ try{ this.lsSet('pp-notify', JSON.stringify(this._notify)); }catch(e){} }
  notifyOn(key){ const n=(this.state.settings&&this.state.settings.notify)||{}; return n[key]!==false; } /* default ON */
  notifyPermission(){ try{ return (typeof Notification!=='undefined') ? Notification.permission : 'unsupported'; }catch(e){ return 'unsupported'; } }
  notifySupported(){ return this.notifyPermission()!=='unsupported'; }
  requestNotifyPermission(){ if(!this.notifySupported()) return;
    try{ Notification.requestPermission().then(()=>this.forceUpdate()); }catch(e){} }
  clockLabel(ms){ const d=new Date(ms); let hh=d.getHours(), mm=d.getMinutes(); const ap=hh<12?'a':'p'; hh=(hh%12)||12; return hh+':'+String(mm).padStart(2,'0')+ap; }

  /* Pure decision: which browser notifications are DUE at `now` and not yet in `fired`. IO-free & unit-tested
     (mirrors autoTimerPlan). Each spec: {key, type, urgent, title, body}. Enable/permission gating is in notifyTick. */
  notifyPlan(now, fired){ const out=[]; fired=fired||{}; const dayKey=this.startOfDay(now);
    (this.state.tasks||[]).forEach(t=>{
      if(this.isMilestone(t)||t.archivedAt) return;
      const active=this.isActiveToday(t); const oc=this.occOf(t);
      /* Urgent: clocked task about to start (T−LEAD .. start) */
      if(active && this.hasStartTime(t) && oc.start!=null){ const k='start:'+t.id+':'+oc.start;
        if(!fired[k] && now>=oc.start-this.NOTIFY_LEAD_MS && now<oc.start)
          out.push({key:k, type:'startPin', urgent:true, title:'Starting soon', body:t.name+' starts at '+this.clockLabel(oc.start)}); }
      /* Normal: a fixed appointment just ended */
      if(active && this.isFixedToday(t) && oc.end!=null){ const k='blockend:'+t.id+':'+oc.end;
        if(!fired[k] && now>=oc.end && now<oc.end+this.NOTIFY_GRACE_MS)
          out.push({key:k, type:'blockEnd', urgent:false, title:'Block ended', body:t.name+' — scheduled block is over'}); }
      /* Urgent: deadline at risk — remaining work exceeds the time left before it's due (throttled once/day) */
      if((+t.pct||0)<100){ const due=this.dueMsOf(t, this.startOfToday());

          if(remainingMin>0 && remainingMin>leftMin){ const k='risk:'+t.id+':'+dayKey;
            if(!fired[k]) out.push({key:k, type:'deadlineRisk', urgent:true, title:'Deadline at risk',

    }); return out; }

  /* Map a spec's type → its settings toggle. */
  notifyTypeEnabled(type){ return this.notifyOn(type); }
  /* Apply the plan: fire enabled specs whose permission is granted, mark them fired, persist. Also raises the
     once-a-day in-app morning summary. Called from the tick loops (safe to call every tick — dedup guards it). */
  notifyTick(now){ now=now||Date.now();
    if(this.notifyPermission()==='granted'){
      const plan=this.notifyPlan(now, this._notify.fired);
      plan.forEach(spec=>{ if(!this.notifyTypeEnabled(spec.type)) return;
        this._notify.fired[spec.key]=now; /* mark before firing so a throw can't loop it */
        try{ const n=new Notification(spec.title,{ body:spec.body, requireInteraction:!!spec.urgent, tag:spec.key });
          if(!spec.urgent) setTimeout(()=>{ try{ n.close(); }catch(e){} }, 8000); }catch(e){} });
      if(plan.length) this.saveNotify();
    }
    this.maybeMorningSummary(now);
  }
  /* Morning summary: once per calendar day, on the first tick of the day, raise the in-app popup. Gated by the
     toggle; auto-dismisses after SUMMARY_TTL. Persist the day even when toggled off so it stays once-a-day. */
  maybeMorningSummary(now){ now=now||Date.now(); const day=this.startOfDay(now);
    if(this._notify.summaryDay===day) return; this._notify.summaryDay=day; this.saveNotify();
    if(!this.notifyOn('morningSummary')) return;
    const data=this.morningSummaryData(now); this.setState({summary:data});
    clearTimeout(this._summaryT); this._summaryT=setTimeout(()=>this.closeSummary(), this.SUMMARY_TTL_MS); }
  closeSummary(){ clearTimeout(this._summaryT); this.setState({summary:null}); }
  /* Pure-ish snapshot for the popup: today's counts + the tasks that still need planning (Phase 7 'unplanned'). */
  morningSummaryData(now){ now=now||Date.now(); const byId={}; (this.state.tasks||[]).forEach(t=>byId[t.id]=t);
    const live=(this.state.tasks||[]).filter(t=>!t.archivedAt && !this.isMilestone(t));
    const activeToday=live.filter(t=>this.isActiveToday(t));
    const done=activeToday.filter(t=>(+t.pct||0)>=100).length;
    const overdue=live.filter(t=>(+t.pct||0)<100 && this.dueMsOf(t, this.startOfToday())<now).length;
    const unplanned=live.filter(t=>this.matchChip(t,'unplanned',byId));
    return { day:this.startOfDay(now), activeCount:activeToday.length, doneCount:done, overdueCount:overdue,
      unplanned:unplanned.slice(0,8).map(t=>t.name), unplannedTotal:unplanned.length }; }

  /* PP-EXT: the day's schedulable free intervals (ms). window [dayStart,dayEnd] minus meals minus the reserved
     freeTime block (pinned to the end of the window), optionally clamped to `from` for pack-from-now. Single
     source of truth shared by computeAllotted (pool = Σ length) and buildDayTimeline (the bins to pack into). */
  dayIntervals(B, from, extraBusy, keepClear){ /* PP-EXT: extraBusy = pinned-task blocks; keepClear = zero-width Point dividers */
    const s=this.state.settings;
    const winStart=B+this.timeParts(s.dayStart)*60000, winEnd=B+this.timeParts(s.dayEnd)*60000;
    const lo=from!=null?Math.max(winStart,Math.min(from,winEnd)):winStart;
    const busy=[];
    /* PP-EXT (10): every busy interval carries `blocking`. Lunch, Dinner and the Free-time reserve are
       BLOCKING (owner 2026-08-06) — they carry no task, so they can never hold a per-task field and need
       this default stated here. extraBusy keeps whatever fixedBlocksToday stamped on it. Annotation only:
       no consumer in this block branches on it (block 11 does). */
    const addBusy=(a,b,note,taskId,blocking)=>{ const s0=Math.max(a,winStart),e0=Math.min(b,winEnd); if(e0>s0) busy.push({start:s0,end:e0,note,taskId,blocking:(blocking==null?this.BLOCKING_DEFAULT:!!blocking)}); }; /* PP-EXT: taskId marks pinned-task blocks */
    addBusy(B+this.timeParts(s.lunchStart)*60000, B+this.timeParts(s.lunchEnd)*60000, 'Lunch', undefined, true);
    addBusy(B+this.timeParts(s.dinnerStart)*60000, B+this.timeParts(s.dinnerEnd)*60000, 'Dinner', undefined, true);
    const ft=Math.max(0, s.freeTime||0); if(ft>0) addBusy(winEnd-ft*60000, winEnd, 'Free time', undefined, true);
    (extraBusy||[]).forEach(b=>addBusy(b.start, b.end, b.note, b.taskId, b.blocking)); /* PP-EXT */
    const arr=busy.slice().sort((a,b)=>a.start-b.start);
    let free=[]; let cur=lo;
    arr.forEach(b=>{ if(b.end<=lo) return; const bs=Math.max(b.start,lo); if(bs>cur) free.push({start:cur,end:bs}); cur=Math.max(cur,b.end); });
    if(cur<winEnd) free.push({start:cur,end:winEnd});
    /* PP-EXT: keep-clear — split (do not consume) free at each Point's clock so no packed block spans it.
       Zero-width ⇒ Σ free length is unchanged, so computeAllotted's pool is untouched. */
    (keepClear||[]).forEach(x=>{ const nf=[];
      free.forEach(iv=>{ if(x>iv.start && x<iv.end){ nf.push({start:iv.start,end:x}); nf.push({start:x,end:iv.end}); } else nf.push(iv); });
      free=nf; });
    /* /PP-EXT */
    return {winStart, winEnd, lo, busy, free};
  }
  /* PP-EXT: the "from now" toggle starts the plan (and pool) at the current time — but ONLY for today's column.
     Future-day timelines always plan the whole day (B ≠ today ⇒ null). B omitted ⇒ today. */
  packStart(B){ const today=this.startOfToday();
    return (this.state.settings.packFromNow && (B==null || B===today)) ? (this.state.nowTick||Date.now()) : null; }

  /* PP-EXT: derived scheduling shapes. A clocked start plus a real, <=1-day end is a fixed appointment;
     a clocked start with no end and no planned duration is a keep-clear Point; an end with an untimed start
     is a hard deadline; everything else packs flexibly. Day-level windows remain enforced by isActiveOn. */
  occOf(t){ return t.recur ? this.currentOcc(t) : {start:t.start, end:t.end}; }
  /* PP-EXT (V1.2 ghost blocks): derive a render-time span for a task whose start and/or end are still
     null, WITHOUT mutating the task — the nulls stay in data (so gcal-outbound keeps skipping dateless
     tasks, and the task can never go overdue on a date it was never given). `today` = start-of-today ms.
     Returns {start,end,ghostStart,ghostEnd}: ghostStart/ghostEnd flag which edge is derived (grey/dotted).
       • solid (both set)      → the real span, no ghosts.
       • double-ghost (both null) → today→today+DAY, re-derived each day (always actionable, never overdue).
       • half-ghost (start set)   → a non-overdue derived end = max(start,today)+DAY.
       • deadline (end set only)  → a ghost start at today (or end-DAY if the deadline is already past),
                                    so the bar runs from now to the due date without inventing a real start. */
  ghostSpan(t, today){
    const DAY=this.DAY, s=t.start, e=t.end;
    if(s!=null && e!=null) return {start:s, end:e, ghostStart:false, ghostEnd:false};
    if(s==null && e==null) return {start:today, end:today+DAY, ghostStart:true, ghostEnd:true};
    if(s!=null && e==null) return {start:s, end:Math.max(s,today)+DAY, ghostStart:false, ghostEnd:true};
    return {start:Math.min(today, e-DAY), end:e, ghostStart:true, ghostEnd:false};
  }
  /* PP-EXT (V1.2 round2): the ghost bar's PAINT, split out of renderBar so it is IO-free and unit-testable.
     Takes an occurrence's ghost flags + the bar's base colour; returns the style pieces or null for a solid
     bar. The key insight is that a half-ghost has no committed *region*, only a committed *edge* — ghostSpan
     derives the whole width — so the paint is an ANCHOR signal, not a real-vs-derived split: the bar is fully
     the task's colour at the edge you actually set and dissolves toward the edge you didn't.
       • solid        → null (caller paints the usual rounded, flat-colour bar).
       • double-ghost → flat grey, dotted outline all round at full opacity, no anchor (nothing is committed).
       • half-ghost   → anchor 'l' (start set, dissolves right) or 'r' (due set, dissolves left); the fill
                        ramps colour→transparent while `mask` ramps the dotted outline transparent→opaque,
                        so dots fade IN exactly as colour fades OUT.
     `anchor` also tells the caller which side gets the solid base-coloured border (the committed edge reads
     as the task, not as an absence). */
  /* PP-EXT (V1.2 round3): the span a ghost is DRAWN across, which is not the span it derives. `ghostSpan` keeps
     its 1-day derived extent in data; this widens the drawing so a ghost stays legible when zoomed out, growing
     AWAY from the committed edge so the anchor never moves:
       • anchor left  (start real, end ghost) → grows right
       • anchor right (due real, start ghost) → grows left, so the due date stays pinned to its column
       • double-ghost (no anchor)             → grows right from today
     A ghost already wider than the floor (e.g. a deadline with a month of runway) is returned untouched — the
     floor is a `max`, never a shrink. Solid bars pass straight through. PURE (ms + px in, ms out) → unit-tested.
     Both the renderer and startBarDrag call this, so a ghost edge is dragged from where it is actually DRAWN
     rather than from its hidden derived date (which would make the bar jump on the first pixel of the gesture). */
  /* PP-EXT (owner 2026-08-12): where a dateless REPEAT anchors its series. `ghostSpan` is the right
     answer for a one-off (derive a single 1-day window from today), but wrong for a repeat in one
     specific way: when a start is set and a due is not, ghostSpan returns `end = max(start,today)+DAY`,
     so a series anchored months ago would give every occurrence a months-long duration and the whole
     row would collapse into one smeared overlap. A repeat missing either edge has no meaningful span,
     so each occurrence is exactly one day; only the ANCHOR is derived.
       • no dates at all   → anchor today, both edges ghost
       • start, no due     → anchor the real start, due edge ghost

     sweep — which is exactly the user-data-destroying heuristic condition 2 exists to refuse. The chosen
     failure mode is a stale tag left behind (visible, and deletable by hand) rather than a real tag
     silently destroyed. `stripOwnCalendarTag` still covers the reserved name unconditionally, since that
     one string is ours and is never a legitimate user tag. */
  stripCalendarTags(tasks, cals){
    const tagById={}; (cals||[]).forEach(c=>{ if(c&&c.id){ const g=this.calTagFor(c.summary); if(g) tagById[c.id]=g; } });
    let changed=0;
    (tasks||[]).forEach(t=>{ if(!t || !t.calendarId || !t.labels || !t.labels.length) return;
      const tag=tagById[t.calendarId]; if(!tag) return;
      const after=t.labels.filter(l=>this.normalizeTag(l)!==tag);

  }
  /* PURE, idempotent: remove from each root task's `labels` the tag that merely restates its own section's
     name. Returns the number of tasks changed.
     PP-EXT (owner 2026-08-13): "Sections should not be a tag." Sections became a first-class entity in
     V2.6, but that migration deliberately promoted a tag to a section and LEFT the tag on the task. The
     structure was fixed and the surface was not: a task in section "Research" still carried an @research
     chip on every row and card, so the app went on telling the user that a section is a kind of tag — which
     is the exact mental model V2.6 existed to break, and the one that produced the 6-of-8-singleton density
     complaint. A section is an exclusive container and a tag is a non-exclusive attribute; rendering one as
     the other is not a cosmetic duplicate, it teaches the wrong model.
     Matching is by NAME, normalized, so it also cleans up a tag the user later made redundant by renaming a
     section onto it. It never touches non-root tasks (only roots carry sectionId) or calendar-linked ones. */
  stripSectionTags(tasks, sections){
    const list=tasks||[], secs=sections||this.loadSections()||[];
    const nameById={}; secs.forEach(s=>{ if(s && s.id!=null) nameById[s.id]=this.normalizeTag(s.name); });
    let changed=0;
    list.forEach(t=>{
      if(!t || t.sectionId==null) return;

      const before=(t.labels||[]); const after=before.filter(l=>this.normalizeTag(l)!==nm);

  }
  /* One-time migration `sections-from-primary-tag` (spec §2.5). For each distinct FIRST label across ROOT
     tasks, in first-seen order, promote it to a section — but only at PROMOTION THRESHOLD 2, i.e. only when
     that tag is the first label of >=2 root tasks. Singletons land in No section, which fixes the density
     complaint on first load instead of reproducing it. The threshold is a one-time migration constant, NOT
     an ongoing rule: sections created later may hold one task forever, which is correct, because the user
     chose to create them.
     PP-EXT (owner 2026-08-13): this migration now CONSUMES the tag it promotes (via stripSectionTags)
     instead of leaving `labels` intact. Reading the tag and also keeping it produced a section and a chip
     that say the same word, which is what the owner means by "sections should not be a tag". Only the
     promoted tag goes; every other label on the task survives, and a singleton tag that was never promoted
     is untouched because it is still doing a tag's job.
     Idempotent — returns {sections, changed}. */
  migrateSectionsFromTags(tasks, threshold){
    const th=(threshold==null?2:threshold), list=tasks||[], byId={}; list.forEach(t=>byId[t.id]=t);
    const isRoot=t=>!(t.parentId!=null && byId[t.parentId]);
    const order=[], count={};
    list.forEach(t=>{ if(!isRoot(t)) return; const tag=this.normalizeTag(t.labels&&t.labels[0]); if(!tag) return;
      if(count[tag]==null){ count[tag]=0; order.push(tag); } count[tag]++; });
    const promoted=order.filter(tag=>count[tag]>=th);
    const sections=promoted.map((tag,i)=>this.normalizeSection({name:tag, order:i}));
    const idByTag={}; promoted.forEach((tag,i)=>idByTag[tag]=sections[i].id);
    let changed=0;
    /* PP-EXT (owner 2026-08-13): only ever ASSIGN a section, never clear one. Previously this wrote
       `sid` unconditionally, so a task whose tag was not promoted had its sectionId set to null. On a
       first run that is a no-op (every sectionId is already null), but now that the migration consumes the
       tags it reads, a second run would find no tags at all and null out every section it had just
       created. The pp-migrations once-flag means that never happens in a real workspace — which is exactly
       why it must not be the ONLY thing standing between the user and losing their sections. */
    list.forEach(t=>{ if(!isRoot(t)) return; const tag=this.normalizeTag(t.labels&&t.labels[0]);
      const sid=(tag&&idByTag[tag])||null; if(sid!=null && t.sectionId!==sid){ t.sectionId=sid; changed++; } });
    /* Consume the promoted tag. Counted into `changed` so the caller still saves when the ONLY thing this
       run did was strip a redundant label — otherwise a second load would find the tags back. */
    changed += this.stripSectionTags(list, sections);
    return {sections, changed};
  }
  setGroupBy(mode){ const m=(mode==='none'||mode==='inclusion')?mode:'section'; /* PP-EXT V2.9 §6 */
    this.savePrefs({groupBy:m}); this.setState({groupBy:m}); }
  /* Create-then-edit: a new section appears immediately with its name field focused, rather than blocking
     on a modal prompt. Nothing is "pending" — the section exists the moment you ask for it, and renaming is
     the same gesture as naming, so there is only one thing to learn. */
  newSectionInline(){ const s=this.addSection('New section'); this.startSectionEdit(s.id); return s; }
  startSectionEdit(id){ this.setState({secEdit:id}); }
  commitSectionEdit(id, value){ const n=String(value==null?'':value).trim();
    if(n) this.renameSection(id,n); this.setState({secEdit:null}); }
  cancelSectionEdit(){ this.setState({secEdit:null}); }
  /* Collapse is a view pref (persisted per workspace), keyed by section id — same posture as
     state.collapsed for subtasks. A collapsed section keeps its header row, so both panes still
     reserve TAG_SECTION_H and row alignment is unaffected. */
  secKey(id){ return id==null?'__none':String(id); } /* No section has a null id; give it a stable pref key */
  /* PP-EXT V2.9 §6: `effective` is the collapse state the caller is actually PAINTING, which is not always
     the stored one — the Excluded inclusion band defaults to collapsed with no pref written. Toggling off
     the stored value alone would make the first click on that band a no-op. Callers pass sec.collapsed. */
  toggleSectionCollapse(id, effective){
    const k=this.secKey(id), col=Object.assign({},this.state.collapsedSections||{});
    const isCol=(effective==null)?!!col[k]:!!effective;
    if(isCol) col[k]=0; else col[k]=1;

  }
  isSectionCollapsed(id){ return !!(this.state.collapsedSections||{})[this.secKey(id)]; }
  /* ==== /PP-EXT V2.6: Sections ==== */

  /* ==== PP-EXT Phase 9: Habits — a lightweight entity separate from tasks (own pp-habits store, no gcal/undo
     funnel). A habit is scheduled daily or on specific weekdays; a day counts as done via a MANUAL check-off
     (`done` ledger) OR automatically when any linked task (`taskIds`) was worked on / completed that day. Streaks
     count only scheduled days (today isn't broken until it ends). Pure helpers so streak/consistency are testable. */
  loadHabits(){ try{ const a=JSON.parse(this.lsGet('pp-habits')||'[]'); return Array.isArray(a)?a.map(x=>this.normalizeHabit(x)):[]; }catch(e){ return []; } }
  saveHabits(habits){ this.syncKvOut('habits', this.habitsToMap(this.state.habits), this.habitsToMap(habits)); /* PP-EXT B3a: stamps+enqueues before persist so the LWW clock is saved */
    try{ this.lsSet('pp-habits', JSON.stringify(habits)); }catch(e){} this.setState({habits}); }
  normalizeHabit(hb){ hb=hb||{}; const sk=(hb.schedule&&hb.schedule.kind==='weekdays')?'weekdays':'daily';
    return { id: hb.id||('h'+Math.random().toString(36).slice(2,8)), name: hb.name||'New habit',
      schedule: { kind:sk, days: Array.isArray(hb.schedule&&hb.schedule.days)?hb.schedule.days.slice():[] },
      taskIds: Array.isArray(hb.taskIds)?hb.taskIds.slice():[],
      done: (hb.done&&typeof hb.done==='object')?Object.assign({},hb.done):{}, createdAt: hb.createdAt||Date.now(),
      updatedAt: hb.updatedAt!=null?hb.updatedAt:null /* PP-EXT B3a: row-level LWW clock for habits sync (stamped on change by the sync funnel) */ }; }
  addHabit(){ const hb=this.normalizeHabit({name:'New habit'}); this.saveHabits([...(this.state.habits||[]), hb]); return hb.id; }
  updateHabit(id, patch){ this.saveHabits((this.state.habits||[]).map(hb=> hb.id===id ? this.normalizeHabit(Object.assign({}, hb, patch)) : hb)); }
  deleteHabit(id){ this.saveHabits((this.state.habits||[]).filter(hb=>hb.id!==id)); }
  toggleHabitDone(id, dayMs){ const ymd=this.ymdOf(dayMs==null?Date.now():dayMs);
    this.saveHabits((this.state.habits||[]).map(hb=>{ if(hb.id!==id) return hb; const done=Object.assign({}, hb.done);
      if(done[ymd]) delete done[ymd]; else done[ymd]=true; return Object.assign({}, hb, {done}); })); }
  /* PURE: is the habit scheduled on the given day? (daily → always; weekdays → the day's weekday is in the set). */
  habitScheduledOn(hb, dayMs){ if(!hb) return false; const s=hb.schedule||{kind:'daily'};
    if(s.kind==='weekdays') return (s.days||[]).indexOf(new Date(dayMs).getDay())>=0; return true; }
  /* PURE: did a linked task feed this habit on `dayMs` (worked on via a timer that day, or completed that day)? */
  habitAutoDoneOn(hb, dayMs, byId){ const ids=hb&&hb.taskIds; if(!ids||!ids.length) return false; const ymd=this.ymdOf(dayMs);
    const find=id=>byId?byId[id]:(this.state.tasks||[]).find(t=>t.id===id);
    return ids.some(id=>{ const t=find(id); if(!t) return false;
      if(this.getSpentOn(t, dayMs)>0) return true;
      if(t.completion && this.ymdOf(t.completion)===ymd) return true;
      if(t.recur){ const ov=t.recur.overrides||{}; return Object.keys(ov).some(oi=>ov[oi]&&ov[oi].completion&&this.ymdOf(ov[oi].completion)===ymd); }
      return false; }); }
  habitDoneOn(hb, dayMs, byId){ const ymd=this.ymdOf(dayMs); return !!(hb&&hb.done&&hb.done[ymd]) || this.habitAutoDoneOn(hb, dayMs, byId); }
  /* PURE: current streak — consecutive scheduled days done, counting back from today; a not-yet-done TODAY does
     not break it (grace), an earlier missed scheduled day does. Non-scheduled days are skipped, not counted. */
  habitStreak(hb, now, byId){ now=now||Date.now(); const today=this.startOfDay(now); let streak=0;
    for(let i=0;i<this.RECUR_MAX;i++){ const ms=today-i*this.DAY;
      if(!this.habitScheduledOn(hb, ms)) continue;
      if(this.habitDoneOn(hb, ms, byId)) streak++; else { if(i===0) continue; break; } }
    return streak; }
  /* PURE: consistency over the last `days` days = done scheduled days / total scheduled days. */
  habitConsistency(hb, now, days, byId){ now=now||Date.now(); days=days||30; const today=this.startOfDay(now); let sched=0, done=0;
    for(let i=0;i<days;i++){ const ms=today-i*this.DAY; if(!this.habitScheduledOn(hb, ms)) continue; sched++; if(this.habitDoneOn(hb, ms, byId)) done++; }
    return { sched, done, pct: sched?Math.round(done/sched*100):0 }; }
  scheduleLabel(hb){ const s=hb.schedule||{kind:'daily'}; if(s.kind!=='weekdays') return 'Daily';
    if(!s.days||!s.days.length) return 'No days'; const L=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    return s.days.slice().sort((a,b)=>a-b).map(d=>L[d]).join(' '); }
  /* ==== /PP-EXT Phase 9: Habits ==== */

  /* ==== PP-EXT V3.1: running scratchpad — ONE continuous rich-text document per workspace (`pp-scratch`).
     Not per-day and not per-task: the journal already owns "today's entry", and this is the thing that
     outlives a day. "Append-only" here means there is no processing step and nothing in the app ever
     rotates, truncates or clears the doc — only the user editing the field changes it.
     It reuses `richField` (the same editor as the journal entry and the task description) rather than
     introducing a second editor, so the stored value is exactly the sanitized HTML subset those produce.
     LOCAL-ONLY, like `pp-sections`: `KV_TABLES` names real Supabase tables, so a new store cannot ride the
     kv sync funnel without a schema migration. It joins the deferred sync batch; until then `BACKUP_KEYS`
     is its only portability, which is why it is in that list. ==== */
  loadScratch(){ try{ return this.normalizeScratch(JSON.parse(this.lsGet('pp-scratch')||'null')); }
    catch(e){ return this.normalizeScratch(null); } }
  /* PURE: coerce whatever came out of the store (or a hand-edited backup) into {html,updatedAt}. A bare
     string is read as the document itself — that is the one legacy/foreign shape worth honouring, since
     losing the user's notes to a shape mismatch is not a recoverable failure. Anything else degrades to
     an empty doc rather than throwing at render time. */

    o=(o&&typeof o==='object')?o:{};

  }

    const next={ html:clean, updatedAt:Date.now() };

  }

  renderScratchpad(opts){ opts=opts||{};

  }
