/* PP-EXT: design-token scales (B0 — foundation). Type/spacing/radius/shadow/motion. Theme-agnostic
   (values, not colors) except shadows, which need separate light/dark alpha tuning below. No new
   magic literals should be introduced outside this block — extend the scale instead. */
:root{
  /* Type scale — 6 steps, whole px only (kills fractional sizes like 8.5/9.5/11.5). */
  --fs-1:11px;--fs-2:12px;--fs-3:13px;--fs-4:15px;--fs-5:18px;--fs-6:22px;
  --lh-tight:1.2;--lh-normal:1.45;--lh-loose:1.6;
  /* Spacing scale — 8pt-based (with a couple of 4px half-steps for dense chrome). */
  --sp-0:4px;--sp-1:8px;--sp-2:12px;--sp-3:16px;--sp-4:24px;--sp-5:32px;--sp-6:48px;
  /* Radius scale — 4 steps. */
  --r-1:4px;--r-2:6px;--r-3:10px;--r-4:16px;--r-pill:999px;
  /* Motion — durations + easing, shared across hover/focus/transition rules. */
  --dur-fast:120ms;--dur-med:180ms;--dur-slow:260ms;--ease-standard:cubic-bezier(.4,0,.2,1);
}
:root,:root[data-theme="dark"]{
  /* Shadow/elevation scale — 3 steps, tuned darker+softer for the dark theme. */
  --sh-1:0 1px 2px rgba(0,0,0,0.4);
  --sh-2:0 4px 12px rgba(0,0,0,0.45);
  --sh-3:0 12px 32px rgba(0,0,0,0.55);
}
:root[data-theme="light"]{
  --sh-1:0 1px 2px rgba(20,20,18,0.06);
  --sh-2:0 4px 14px rgba(20,20,18,0.09);
  --sh-3:0 16px 36px rgba(20,20,18,0.14);
}
@media (prefers-reduced-motion:reduce){
  :root{--dur-fast:0ms;--dur-med:0ms;--dur-slow:0ms}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:7px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hover)}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-corner{background:transparent}
input,select,button{font-family:inherit}
.pp-edit{outline:none}
.pp-edit:focus{background:var(--focus-bg);border-radius:3px;box-shadow:0 0 0 1px var(--focus-ring)}
.pp-num{width:100%;background:transparent;border:1px solid transparent;color:var(--text-num);font-size:12px;padding:2px 4px;border-radius:3px;text-align:right}
.pp-num:hover{border-color:var(--divider)}
.pp-num:focus{outline:none;background:var(--focus-bg);border-color:var(--focus-ring)}
/* PP-EXT: rich-text description editor + rendered output */
.pp-rich:empty:before{content:attr(data-ph);color:var(--text-faint2)}
.pp-rich:focus{border-color:var(--focus-ring)!important}
.pp-rich ul{margin:4px 0;padding-left:22px;list-style:disc}
.pp-rich ol{margin:4px 0;padding-left:22px;list-style:decimal}
.pp-rich li{margin:2px 0}
.pp-rich p{margin:4px 0}
.pp-rich h1,.pp-rich h2,.pp-rich h3{margin:8px 0 4px;font-weight:700}
.pp-rich code{background:var(--input-bg);border:1px solid var(--divider);border-radius:4px;padding:0 4px;font-size:0.92em}
.pp-rich a{color:var(--link);text-decoration:underline}
/* /PP-EXT */
.pp-sel{background:var(--input-bg);border:1px solid var(--divider);color:var(--text-num);font-size:12px;padding:2px 4px;border-radius:4px;width:100%}
.pp-sel:focus{outline:none;border-color:var(--focus-ring)}
.pp-tbtn{display:flex;align-items:center;gap:5px;height:30px;padding:0 11px;background:var(--btn-bg);border:1px solid var(--divider);color:var(--btn-text);border-radius:6px;font-size:12.5px;font-weight:500;cursor:pointer}
.pp-tbtn:hover{background:var(--btn-hover)}
.pp-tbtn:active{background:var(--btn-active)}
.pp-iconbtn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--btn-bg);border:1px solid var(--divider);color:var(--btn-text);border-radius:6px;cursor:pointer;font-size:15px;line-height:1}
.pp-iconbtn:hover{background:var(--btn-hover)}
@keyframes ppdash{to{stroke-dashoffset:-14}}
/* PP-EXT Phase D: Dashboard's Plan/Focus/Review switch — a soft crossfade+rise so tab switches read as a
   deliberate transition between three full-screen modes, not a jump-cut. */
@keyframes ppDashFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
/* PP-EXT Phase 10 (redesign): Pomodoro timer — a soft breathing glow behind the ring while a session runs,
   plus a gentle center-digit pulse each cycle. Both respect prefers-reduced-motion via the --dur tokens. */
@keyframes ppPomoBreath{0%,100%{transform:scale(1);opacity:0.45}50%{transform:scale(1.06);opacity:0.85}}
@keyframes ppPomoPop{0%{transform:scale(0.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.pp-rsz{position:absolute;top:0;bottom:0;right:-4px;width:8px;cursor:col-resize;z-index:8}
.pp-rsz::after{content:"";position:absolute;top:9px;bottom:9px;left:3px;width:2px;border-radius:1px;background:transparent}
.pp-rsz:hover::after{background:var(--focus-ring)}
/* PP-EXT V2.9 §1: text-selection suppression for the three drags that cannot preventDefault on mousedown
   (row drag, section-header drag, column reorder) because the same mousedown must also focus an inline
   editor and place a caret. Applied at DRAG BEGIN (the 4px threshold), never at mousedown.
   Scoped to the board root, never document.body — Journal and description prose stay copyable.
   The input/textarea/contenteditable carve-out is required, not defensive: user-select INHERITS, so
   without it the section rename field and the rich description editor go unselectable mid-drag. */
.pp-dragging,.pp-dragging *{user-select:none!important;-webkit-user-select:none!important;cursor:grabbing!important}
.pp-dragging input,.pp-dragging textarea,.pp-dragging [contenteditable]{user-select:text!important;-webkit-user-select:text!important}

/* PP-EXT: shared component classes (B0 — design foundation). Built on the token scales above;
   intended to replace per-instance inline style objects over time (B3 migrates usages). */
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:var(--r-1)}
.pp-card{background:var(--card-bg);border:1px solid var(--divider);border-radius:var(--r-3);
  padding:var(--sp-3);box-shadow:var(--sh-1);transition:box-shadow var(--dur-med) var(--ease-standard),
  transform var(--dur-med) var(--ease-standard)}
.pp-card--elevated{box-shadow:var(--sh-2)}
.pp-modal{background:var(--card-bg);border:1px solid var(--modal-border);border-radius:var(--r-4);
  box-shadow:var(--sh-3);padding:var(--sp-4)}
.pp-chip{display:inline-flex;align-items:center;gap:var(--sp-0);height:22px;padding:0 var(--sp-1);
  background:var(--chip-bg);border:1px solid var(--divider);border-radius:var(--r-pill);
  font-size:var(--fs-1);line-height:var(--lh-tight);color:var(--text-2);
  transition:background var(--dur-fast) var(--ease-standard)}
.pp-chip:hover{background:var(--btn-hover)}
/* PP-EXT V1.5: the due/recur signal survives the sheet-column cull as one compact timeline chip. */
.pp-due-chip{display:inline-flex;align-items:center;max-width:100%;padding:1px var(--sp-0);border:1px solid currentColor;
  border-radius:var(--r-1);font-size:var(--fs-1);line-height:var(--lh-tight);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:color-mix(in srgb,currentColor 10%,transparent)}
.pp-due-chip--overdue{color:var(--danger)}.pp-due-chip--today{color:var(--success)}
.pp-due-chip--tomorrow{color:var(--due-tomorrow)}.pp-due-chip--week{color:var(--due-week)}
.pp-due-chip--later{color:var(--due-later)}.pp-due-chip--recur{color:var(--success)}
.pp-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-0);
  height:30px;padding:0 var(--sp-2);border-radius:var(--r-2);font-size:var(--fs-2);font-weight:500;
  cursor:pointer;border:1px solid var(--divider);background:var(--btn-bg);color:var(--btn-text);
  transition:background var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard)}
.pp-btn:hover{background:var(--btn-hover)}
.pp-btn:active{background:var(--btn-active)}
.pp-btn--primary{background:var(--focus-ring);border-color:var(--focus-ring);color:var(--on-accent)}
.pp-btn--primary:hover{filter:brightness(1.08)}
.pp-btn--primary:active{filter:brightness(0.96)}
.pp-btn--danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.pp-btn--danger:hover{background:rgba(229,72,77,0.1)}
/* /PP-EXT */

</style>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3b82f6&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#3b82f6&quot;,&quot;#2f9e5f&quot;,&quot;#8957e5&quot;,&quot;#e5484d&quot;]},&quot;showCriticalPath&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  constructor(props){
    super(props);
    /* PP-EXT: active per-account workspace ('anon' or a Supabase uid) — MUST be set before the first
       scoped localStorage read (this.loadNotify() below routes through lsGet). pp-workspace is our
       synchronous proxy for the last session; the async Supabase session restore confirms/switches it
       later in syncOnAuth. See plans/account-namespacing-plan.md. */
    try{ this._workspace = localStorage.getItem('pp-workspace') || 'anon'; }catch(e){ this._workspace = 'anon'; }
    this.DAY = 86400000;
    this.DEFAULT_TASK_MINUTES = 30; /* PP-EXT V2.1: real draggable slice for zero-planned pressed work */
    this.HOUR = 3600000; /* PP-EXT (V1.3 fix): sub-day drag snap unit — used once zoomed into the hour grid */
    /* PP-EXT: recurrence expansion bounds (named; see expandTask / recurStartIndex). */
    this.RECUR_MAX = 400;       // max occurrences materialized forward from the start index
    this.RECUR_BACKOFF = 3;     // occurrences to rewind when estimating the start index
    /* PP-EXT: timers persist across a closed tab / sleep (owner choice) — a running timer keeps counting until
       manually stopped or auto-paused at a pinned end; there is no inactivity auto-stop. See stopTimerAt / snapshot. */
    this.TIMER_BEAT_MS = 5000;    // heartbeat cadence: refresh running.beat so pp-run stays fresh across reloads
    /* PP-EXT: shape-driven auto timers — per-occurrence session guards so we don't re-autostart a stopped
       occurrence / re-fire an auto-pause. Keyed by `taskId:occurrenceStartMs`. */
    this._autoDone = {}; this._autoPaused = {};
    /* PP-EXT Phase 8: browser notifications. LEAD = how early the clocked-start heads-up fires; GRACE = a
       just-missed trigger won't re-fire on reload/tick if its moment passed more than this ago; SUMMARY_TTL =
       morning-popup auto-dismiss. Fired-once ledger + last morning-summary day persist in pp-notify. */
    this.NOTIFY_LEAD_MS = 5*60000;
    this.NOTIFY_GRACE_MS = 5*60000;
    this.SUMMARY_TTL_MS = 12000;
    this._notify = this.loadNotify();
    this.HISTORY_MAX = 200;       // undo/redo depth (applies to BOTH stacks)
    /* PP-EXT: two-way gcal sync (see computeOutboundOps / gcalFlushQueue). */
    this.GCAL_FLUSH_DEBOUNCE_MS = 2500;        // coalesce per-keystroke commits into one write
    this.GCAL_OP_MAX_TRIES = 3;                // transient-failure retries before an op is dropped
    this.GCAL_TOMBSTONE_TTL_MS = 30*86400000;  // deleted-event ids kept this long to block re-import
    /* PP-EXT B1: offline-first Supabase sync — same shape as the gcal queue above (see computeSyncOps). */
    this.SYNC_FLUSH_DEBOUNCE_MS = 2500;        // coalesce per-keystroke commits into one backend write
    this.SYNC_OP_MAX_TRIES = 3;                // transient-failure retries before an op is dropped (B2)
    this.SYNC_TOMBSTONE_TTL_MS = 30*86400000;  // deleted-row ids kept this long so a pull can't resurrect them
    /* PP-EXT B3b: gcal events.watch push (gcal-watch/gcal-notify Edge Functions + gcal_pings doorbell). */
    this.GCAL_WATCH_RESYNC_MS = 6*3600000;     // re-assert watch channels at most this often per tab
    this.GCAL_PING_DEBOUNCE_MS = 1200;         // coalesce a burst of pushes (a bulk edit) into one import
    this._syncApplying = false;                // echo guard: true while committing a pulled remote snapshot
    this._syncKvSending = false;               // PP-EXT B3a: in-flight guard for the habits/journal blob flush
    this.ARCH_SWEEP_MS = 3600000;              // PP-EXT: auto-archive sweep runs at most hourly
    this.rowH = 40;
    this.barH = 20; /* PP-EXT (C1): a few px taller than the old 16 → a bigger vertical drag target on the Gantt bar */
    this.headH = 48;
    /* PP-EXT (C1/C2): Gantt-bar draggability + sub-day zoom. */
    this.BAR_MIN_PX = 24;            // min bar width — fits two 7px edge grips + a draggable middle, so a short/zero-span bar never collapses into an undraggable, stacked sliver
    /* PP-EXT (V1.5, owner tenet 2026-07-26): "all the clickboxes are all too tiny. Humans do not have
       machine precision. They want as much leeway as possible." Every interactive handle gets a
       TRANSPARENT hit box of at least this many local px, with the small glyph drawn inside it —
       target size is decoupled from glyph size. Where the row budget can't afford it in one axis
       (the %-done caret has only (rowH−barH)/2 px under the bar), the axis that carries the
       precision — horizontal, along the bar — still gets the full box. See product-vision.md. */
    this.HIT_MIN_PX = 24;            // minimum interactive target (local px, pre-zoom)
    /* PP-EXT (V1.2 round2 — anchored ghosts): a half-ghost dissolves ALONG the bar, from the committed
       edge toward the derived one. Two mirrored ramps drive it: the fill fades colour OUT, the dotted
       outline mask fades dots IN, so "solid + no dots" and "no colour + dots" are the same axis read
       twice. Stops are percentages of bar width. */

      included:true, /* PP-EXT V2.1: pressed = in today. New tasks start pressed; false/null are unpressed legacy/off states. */
      snoozeUntil:null, /* PP-EXT Track B: date-only epoch ms, null = no active snooze. today<snoozeUntil ⇒ temporarily opted out regardless of `included`/window (see isOptedOut). Independent of `included` — see the lifecycle rules on isOptedOut/setIncludedOn/setIncludedOff. */
      archivedAt:null, /* PP-EXT: archived = hidden from views but kept for stats; delete = permanent (+ gcal DELETE) */
      parentId:null, /* PP-EXT: subtasks — id of the parent task (nested, collapsible; see buildKids) */
      sectionId:null, /* PP-EXT V2.6: id into the pp-sections entity; null = the explicit "No section" bucket.

         many-per-task, non-exclusive attribute (V2.3 derived sections from tags and produced a singleton
         explosion). Not in SYNC_FIELDS: it joins the deferred batch with snoozeUntil (spec §2.6). */
      pin:null, /* PP-EXT: drag-pin {day, start, dur} — a block dragged in the drawer, fixed for that day only (Phase 5; see dragBlock) */
      demo:false, /* PP-EXT V0.2: marks a task from the opt-in demo seed (loadDemo) — drives the dismissible "demo tasks" banner + Clear demo. Not in SYNC_FIELDS, so it never mirrors to the backend (signed-in demo becomes real data after a sync round-trip; the banner is a local convenience, chiefly for anon). */
      updatedAt:null, /* PP-EXT B1: row-level last-write-wins clock (epoch ms). Stamped by commit() when sync is on; null until then (see stampUpdated / applyRemoteSnapshot). */

  }
  /* PP-EXT: one-time cleanup — zero out planned time that old imports stamped onto all-day tasks (60m default).
     New imports already set all-day planned to 0; this only scrubs previously-persisted data, once. Planned
     stays user-editable afterwards (it is NOT re-zeroed on every load). Returns the number of tasks changed. */
  migrateAllDayPlanned(tasks){ let n=0; tasks.forEach(t=>{ if(t.allDay && t.planned){ t.planned=0; n++; } }); return n; }
  /* PP-EXT: one-time cleanup for the pin removal. The parser used to stamp a bare day with a 9am
     placeholder and mark it startClock:false; bare days are now plain midnight, so collapse those
     starts and drop the flag back to null (derive). pinStart/pinEnd no longer exist because every
     scheduling shape is derived from the dates. Idempotent: returns the number of rows changed. */
  migratePins(tasks){ let n=0; tasks.forEach(t=>{ let hit=false;
    if(t.startClock===false && t.start!=null){ t.start=this.startOfDay(t.start); t.startClock=null; hit=true; }
    else if(t.startClock===false){ t.startClock=null; hit=true; }
    if('pinStart' in t){ delete t.pinStart; hit=true; }
    if('pinEnd' in t){ delete t.pinEnd; hit=true; }
    if(hit) n++; }); return n; }
  runOnceMigrations(tasks){
    try{ const done=JSON.parse(this.lsGet('pp-migrations')||'{}')||{};
      if(!done['allday-planned-zero']){ const n=this.migrateAllDayPlanned(tasks); done['allday-planned-zero']=1;
        this.lsSet('pp-migrations', JSON.stringify(done)); if(n) this.saveTasks(tasks); }
      if(!done['schedule-pins-removed']){ const n=this.migratePins(tasks); done['schedule-pins-removed']=1;
        this.lsSet('pp-migrations', JSON.stringify(done)); if(n) this.saveTasks(tasks); }
      /* PP-EXT V2.6: seed sections from primary @tags, once, at promotion threshold 2. Guarded like the
         two above; only writes pp-sections when the migration actually promoted something. */
      if(!done['sections-from-primary-tag']){ const r=this.migrateSectionsFromTags(tasks);
        done['sections-from-primary-tag']=1; this.lsSet('pp-migrations', JSON.stringify(done));
        if(r.sections.length){ try{ this.lsSet('pp-sections', JSON.stringify(r.sections)); }catch(e){} }
        if(r.changed) this.saveTasks(tasks); }
      /* PP-EXT V2.11: retire "Off". `included===false` no longer exists as a state, so any task still
         holding it is folded into unpressed. Left in place it would be a value no predicate reads and no
         UI can clear — a task stuck out of today with no control that returns it. */
      if(!done['retire-off']){ const n=this.migrateRetireOff(tasks); done['retire-off']=1;
        this.lsSet('pp-migrations', JSON.stringify(done)); if(n) this.saveTasks(tasks); } }catch(e){}
    return tasks;
  }
  /* PURE (mutates the array it is handed, returns the count) → unit-tested. Deliberately does NOT snooze
     the tasks it converts, unlike `setIncludedOff`: the user turned these off before unpressed could bring
     anything back, so honouring the new rule means letting their triggers run. */
  migrateRetireOff(tasks){
    let n=0; (tasks||[]).forEach(t=>{ if(t && t.included===false){ t.included=null; n++; } }); return n;
  }
  /* PP-EXT: parse a calendar all-day date ("YYYY-MM-DD") as LOCAL midnight. Using new Date(str) treats it as
     UTC, which shifts the day and injects a bogus time (e.g. 17:00) depending on the viewer's timezone. */
  parseYMD(s){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? new Date(+m[1],+m[2]-1,+m[3]).getTime() : new Date(s).getTime(); }
  /* PP-EXT: whole-app JSON backup — until a backend exists, localStorage is the ONLY copy of the data.
     collectBackup/applyBackup are pure vs localStorage (unit-testable); export/import wrap them with DOM I/O.
     Non-JSON stores (pp-theme holds a bare string) round-trip via a {__raw} wrapper. */
  BACKUP_KEYS(){ return ['pp-tasks','pp-run','pp-settings','pp-gcal','pp-prefs','pp-theme','pp-migrations','pp-habits','pp-journal','pp-sections']; /* pp-habits/pp-journal: Phase 9; pp-sections: V2.6 (local-only until the deferred sync batch, so backup is its ONLY portability) */ }
  collectBackup(){ const data={};
    this.BACKUP_KEYS().forEach(k=>{ const v=this.lsGet(k); if(v==null) return; /* PP-EXT: active-workspace scoped (pp-theme stays global) */
      try{ data[k]=JSON.parse(v); }catch(e){ data[k]={__raw:v}; } });
    return {app:'ChronoCompose', version:1, exportedAt:new Date().toISOString(), data}; }
  applyBackup(obj){ if(!obj||obj.app!=='ChronoCompose'||!obj.data||typeof obj.data!=='object') throw new Error('Not a ChronoCompose backup file.');
    let n=0; this.BACKUP_KEYS().forEach(k=>{ if(!(k in obj.data)) return; const v=obj.data[k];
      try{ this.lsSet(k, (v&&typeof v==='object'&&typeof v.__raw==='string')?v.__raw:JSON.stringify(v)); n++; }catch(e){} }); /* PP-EXT: active-workspace scoped */
    return n; }
  exportBackup(){ try{ const blob=new Blob([JSON.stringify(this.collectBackup(),null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    const d=new Date(); a.download='chronocompose-backup-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); }catch(e){ alert('Export failed: '+e.message); } }
  importBackupFile(file){ if(!file) return; const rd=new FileReader();
    rd.onload=()=>{ try{ const obj=JSON.parse(rd.result);
        if(!confirm('Replace ALL current ChronoCompose data with this backup? Current data will be overwritten.')) return;
        this.applyBackup(obj); location.reload(); }
      catch(e){ alert('Import failed: '+e.message); } };
    rd.readAsText(file); }

  /* ---------- prefs persistence ---------- */
  loadPrefs(){ try{ return JSON.parse(this.lsGet('pp-prefs')||'{}')||{}; }catch(e){ return {}; } }
  savePrefs(patch){ try{ const p=Object.assign(this.loadPrefs(),patch); this.lsSet('pp-prefs', JSON.stringify(p)); }catch(e){} }
  applyOrder(tasks, order){
    const byId={}; tasks.forEach(t=>byId[t.id]=t);
    const out=[]; order.forEach(id=>{ if(byId[id]){ out.push(byId[id]); delete byId[id]; } });
    tasks.forEach(t=>{ if(byId[t.id]) out.push(t); });
    return out;
  }
  persistRowOrder(){ this.savePrefs({rowOrder: this.state.tasks.map(t=>t.id)}); }

  /* ---------- theme ---------- */
  initialTheme(){
    try{ const s=localStorage.getItem('pp-theme'); if(s==='light'||s==='dark') return s;
      return (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'; }
    catch(e){ return 'dark'; }
  }
  setTheme(t){

  /* ---------- columns ---------- */
  colDefs(){
    /* PP-EXT V2.3: Todoist-style uniform rows replace the spreadsheet field grid. Task metadata lives
       with the name; the only numeric readout is planned → allotted, flush right. Actions retain today's
       inclusion, timer, and add-time controls without reintroducing data columns. */
    return [
      {k:'check',w:50,lock:true},{k:'name',w:354,l:'Task'},
      {k:'planned',w:126,l:'Planned → Allotted'},
      {k:'actions',w:104,l:'Actions',lock:true}
    ];
  }
  orderedCols(){
    const base=this.colDefs(); const byK={}; base.forEach(c=>byK[c.k]=c);
    let order=this.state.colOrder ? this.state.colOrder.slice() : base.map(c=>c.k);
    base.forEach(c=>{ if(!order.includes(c.k)) order.push(c.k); });
    order=order.filter(k=>byK[k]);
    order=['check', ...order.filter(k=>k!=='check')];
    return order.map(k=>({...byK[k], w:(this.state.colW[k]!=null?this.state.colW[k]:byK[k].w), defW:byK[k].w, hidden:!!this.state.colHidden[k]}));
  }
  visibleCols(){ return this.orderedCols().filter(c=>!c.hidden); }
  colMin(k){ return k==='check'?44:54; }
  resetColW(k){ const sel=this.state.selCols; const keys=(sel.includes(k)&&sel.length>1)?sel:[k]; const cw=Object.assign({},this.state.colW); keys.forEach(x=>delete cw[x]); this.setState({colW:cw}); this.savePrefs({colW:cw}); }
  setColW(patch){ const cw=Object.assign({}, this.state.colW, patch); this.setState({colW:cw}); this.savePrefs({colW:cw}); }
  resetCols(){ this.setState({colW:{}, colHidden:{}, colOrder:null, selCols:[], colMenu:null}); this.savePrefs({colW:{}, colHidden:{}, colOrder:null}); }
  setColHidden(keys, hidden){
    const ch=Object.assign({}, this.state.colHidden);
    keys.forEach(k=>{ if(k==='check') return; if(hidden) ch[k]=true; else delete ch[k]; });
    this.setState({colHidden:ch, colMenu:null, selCols:this.state.selCols.filter(k=>!ch[k])});
    this.savePrefs({colHidden:ch});
  }
  selectCol(e,k){
    if(k==='check') return;
    const sel=this.state.selCols;
    if(e.shiftKey && sel.length){
      const order=this.visibleCols().map(c=>c.k);
      const a=order.indexOf(sel[sel.length-1]), b=order.indexOf(k);
      if(a>=0&&b>=0){ const lo=Math.min(a,b),hi=Math.max(a,b); const range=order.slice(lo,hi+1).filter(x=>x!=='check'); this.setState({selCols:range}); return; }
    }
    if(e.ctrlKey||e.metaKey){ this.setState({selCols: sel.includes(k)?sel.filter(x=>x!==k):[...sel,k]}); return; }
    this.setState({selCols: (sel.length===1&&sel[0]===k)?[]:[k]});
  }
  colCtx(e,k){
    e.preventDefault(); e.stopPropagation();
    let sel=this.state.selCols;
    if(!sel.includes(k)){ sel=k==='check'?[]:[k]; this.setState({selCols:sel}); }
    const cp=this.uiPt(e.clientX,e.clientY); /* PP-EXT V1.4: overlay space, not rendered px (see scaleFixedPt) */
    this.setState({colMenu:{x:cp.x,y:cp.y,keys:sel.length?sel:(k==='check'?[]:[k])}});
  }
  moveColumn(fromK, toK){
    if(fromK===toK||fromK==='check') return;
    let order=this.orderedCols().map(c=>c.k);
    order=order.filter(k=>k!==fromK);
    let ti=order.indexOf(toK); if(ti<0) ti=order.length;
    order.splice(ti,0,fromK);
    order=['check',...order.filter(k=>k!=='check')];
    this.setState({colOrder:order}); this.savePrefs({colOrder:order});
  }
  moveColumns(keys, toK){
    const moving=this.orderedCols().map(c=>c.k).filter(k=>keys.includes(k) && k!=='check');
    if(!moving.length || moving.includes(toK)) return;
    let order=this.orderedCols().map(c=>c.k).filter(k=>!moving.includes(k));
    let ti=order.indexOf(toK); if(ti<0) ti=order.length;
    order.splice(ti,0,...moving);
    order=['check',...order.filter(k=>k!=='check')];
    this.setState({colOrder:order}); this.savePrefs({colOrder:order});
  }
  hiddenColList(){
    const h=React.createElement;
    const hidden=this.orderedCols().filter(c=>c.hidden);
    const items=[];
    if(hidden.length){
      items.push(h('div',{key:'hl',style:{fontSize:'11px',color:'var(--text-mut)',marginBottom:'8px'}},'Hidden columns — click to restore'));
      items.push(h('div',{key:'hc',style:{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'12px'}},
        hidden.map(c=>h('div',{key:c.k,onClick:()=>this.setColHidden([c.k],false),
          style:{fontSize:'11.5px',color:'var(--text-2)',background:'var(--input-bg)',border:'1px solid var(--divider)',
            borderRadius:'6px',padding:'3px 9px',cursor:'pointer'}}, '+ '+c.l))));
    }
    items.push(h('div',{key:'rs',onClick:()=>this.resetCols(),
      style:{fontSize:'12px',color:'var(--text-mut2)',cursor:'pointer',display:'inline-flex',alignItems:'center',gap:'5px'},
      onMouseEnter:e=>e.currentTarget.style.color='var(--text)',onMouseLeave:e=>e.currentTarget.style.color='var(--text-mut2)'},'↺ Reset columns'));
    return h('div',{key:'hcl',style:{paddingTop:'14px'}}, items);
  }

  /* ---------- seed data ---------- */
  /* PP-EXT: life-schedule seed demonstrating scheduling modes + @tags. `planned`/`spent` are MINUTES.
     Tasks are centered on "today" so the drawer timeline has something to schedule out of the box. */
  buildSeed(){
    const D = this.DAY;
    const t0 = new Date(); t0.setHours(0,0,0,0); const B=t0.getTime();
    /* PP-EXT: `extra` merges optional fields (e.g. included:false) — scheduling is derived now, no Mode column. */
    const mk=(id,name,type,offStart,offEnd,pri,deps,pct,planned,spent,goal,labels,extra)=>this.normalizeTask(Object.assign({
      id,name,type,start:B+offStart*D+9*3600000,end:B+offEnd*D+9*3600000,priority:pri,deps,pct,
      planned:planned,spent:spent,goal:goal,labels:labels||[],description:'',
      completion: pct>=100 ? B+offEnd*D : null
    }, extra||{}));
    return [
      mk('t1','Research project + reading list','Proportional',0,2,1,[],20,180,20,'Send 3 emails; read 2 papers',['research']),
      mk('t2','AI project','Proportional',0,4,2,[],35,240,60,'Ship the scheduler MVP',['sim','code']),
      mk('t3','Practice problems','Proportional',0,0,3,[],0,60,0,'2 mediums',['study']),
      mk('t4','Online course lectures','Proportional',0,3,3,[],10,120,0,'',['study']),
      mk('t5','Exercise','Proportional',0,0,2,[],0,45,0,'Full body',['health']),
      mk('t6','Update website','Proportional',1,6,4,[],0,300,0,'Backlog — not pressed into today',['personal'],{included:null}),
      mk('t7','Team Meeting','Milestone',0,0,1,[],0,0,0,'',['work']),
    ];
  }

  /* ==== PP-EXT V0.2: empty state + one-time 3-step first-run + opt-in labeled demo ====
     A fresh workspace no longer auto-seeds (see the constructor). Instead:
       - renderFirstRun paints a legible empty state (with the 3-step coach on first run) when there are
         no tasks, and a floating coach once the first task exists — until the user dismisses it.
       - loadDemo() drops the old sample tasks in as an explicit, LABELED, dismissible demo (Clear demo).
     The "seen" flag lives in pp-prefs (per-workspace) so the coach never re-shows. Helpers below are
     pure/State-only so they're unit-testable. */
  activeTaskCount(){ return this.state.tasks.reduce((n,t)=>n+(t.archivedAt?0:1),0); }
  hasDemoTasks(){ return this.state.tasks.some(t=>t.demo); }
  /* current step of the 3-step narration, derived from state: 0 = add your first task; 1 = a task exists
     (it auto-schedules) → the "drag to adjust" step is now the live one. Kept coarse on purpose — richer
     gesture hooks (the actual drag) land with the Gantt-native editing in V1. */
  firstRunStep(){ return this.activeTaskCount()===0 ? 0 : 1; }
  markFirstRunSeen(){ this.setState({firstRunSeen:true}); this.savePrefs({firstRunSeen:true}); }
  /* Explicit opt-in: adds the sample tasks as a clearly-labeled demo. Fresh random ids (NOT the stable
     t1..t7) so a signed-in account loading the demo can't re-trigger the cross-account tasks.id collision
     the namespacing work fixed (tasks.md → namespacing). All deps in buildSeed are empty, so re-id is safe. */
  loadDemo(){
    this.commit(tasks=>{
      this.buildSeed().forEach(s=>{ tasks.push(Object.assign({}, s, {id:'d'+Math.random().toString(36).slice(2,8), demo:true})); });
    });
    if(!this.state.firstRunSeen) this.markFirstRunSeen();
  }
  clearDemo(){ this.commit(tasks=>{ for(let i=tasks.length-1;i>=0;i--){ if(tasks[i].demo) tasks.splice(i,1); } }); }

  /* ---------- lifecycle ---------- */
  componentDidMount(){

    this._onMove = (e)=>this.onMouseMove(e);
    this._onUp = (e)=>this.onMouseUp(e);

    window.addEventListener('mousemove', this._onMove);
    window.addEventListener('mouseup', this._onUp);
    /* PP-EXT V2.9 §1: blur guard. A drag that ends outside the window (alt-tab, devtools) never fires
       mouseup here, which would strand the board unselectable. Cheap insurance for the one bad state. */
    this._onBlur = ()=>this.dragSelectRelease();
    window.addEventListener('blur', this._onBlur);
    /* PP-EXT: cross-tab sync for pp-run/pp-pomo — without this, a background tab's stale in-memory
       `running`/`pomo` gets blindly re-persisted by its own heartbeat/tick and can resurrect a timer
       another tab just stopped. Adopt the externally-written value instead of clobbering it. */
    this._onStorage = (e)=>{ if(e.key==='pp-run') this.setState({running:this.loadRun()});
      else if(e.key==='pp-pomo') this.setState({pomo:this.loadPomo()}); };
    window.addEventListener('storage', this._onStorage);
    try{ document.documentElement.setAttribute('data-theme', this.state.theme); }catch(e){}
    /* PP-EXT: clock ticks — 1s while a timer runs (live spent/allotted), 30s idle (now-line) */
    this._tickRun=setInterval(()=>{ if(this.anyRunning()||this.pomoActive()){ this.timerHeartbeat(); this.autoTimerTick(); this.pomoTick(); /* PP-EXT Phase 10 */ this.notifyTick(); if(this.anyRunning()||this.pomoActive()) this.setState({nowTick:Date.now()}); } }, 1000);
    this._tickIdle=setInterval(()=>{ if(!this.anyRunning()) this.setState({nowTick:Date.now()}); this.autoTimerTick(); /* PP-EXT: catch pin-driven auto-starts while idle */ this.pomoTick(); /* PP-EXT Phase 10 */ this.notifyTick(); /* PP-EXT Phase 8 */ this.maybeAutoArchive(); /* PP-EXT */ }, 30000);
    /* PP-EXT: a run restored from pp-run may be stale (tab was closed mid-run) — settle it before it accrues */
    this.timerHeartbeat();
    this.autoTimerTick(); /* PP-EXT: fire any pin-driven auto-starts already due on load */
    this.pomoTick(); /* PP-EXT Phase 10: settle a pomodoro session restored from pp-pomo */
    this.notifyTick(); /* PP-EXT Phase 8: raise the morning summary + any due notifications on load */
    this.maybeAutoArchive(); /* PP-EXT: sweep long-completed tasks once on load (then hourly via the idle tick) */
    /* PP-EXT: Google Calendar background auto-sync — poll tick every 15s, gated by the configurable interval
       (settings.gcalPollSec, default 60), tab visibility and auth. True push (events.watch) needs a server. */
    this._gcalPoll=setInterval(()=>this.gcalMaybeSync(), 15000);
    /* PP-EXT B2: stand up the Supabase client if configured, adopting a magic-link session if the redirect
       just landed here. Also drains any pp-sync-queue writes made offline (they flush once a session exists). */
    this.syncMaybeInit();
    /* PP-EXT: first paint renders the full timeline (scroll pos unknown); re-render once mounted so the
       Gantt windows to the viewport (see ganttVWin / renderGantt virtualization). */
    requestAnimationFrame(()=>this.forceUpdate());
  }
  componentWillUnmount(){

    window.removeEventListener('mousemove', this._onMove);
    window.removeEventListener('mouseup', this._onUp);
    window.removeEventListener('blur', this._onBlur); /* PP-EXT V2.9 §1 */
    window.removeEventListener('storage', this._onStorage); /* PP-EXT */
    clearInterval(this._tickRun); clearInterval(this._tickIdle); clearInterval(this._gcalPoll); clearTimeout(this._gcalSoon); clearTimeout(this._gcalFlushT); clearTimeout(this._summaryT); /* PP-EXT */
    clearTimeout(this._syncFlushT); clearTimeout(this._syncInitT); clearTimeout(this._syncKvFlushT); this.syncUnsubscribeRealtime(); /* PP-EXT B2 + B3a */
    this.gcalPingUnsubscribe(); /* PP-EXT B3b */
  }

  /* PP-EXT (V1.3 fix5): atomic cursor-anchored zoom pin. onWheelZoom applies dayW via async setState and stashes
     the target scrollLeft (+ the scroller el). React commits the new content width here — synchronously after the
     DOM mutation, before paint — so pinning scrollLeft now lands against the already-resized scrollWidth (never
     clamped short) and the new width + new scroll paint together in ONE frame. Replaces the rAF/setTimeout chase
     loop, which could only retime the scroll-vs-render race, never close it (jitter + burst-end drift). */
  componentDidUpdate(){
    if(this._zoomPinEl && this._zoomTarget!=null){
      const el=this._zoomPinEl; this._zoomPinEl=null;
      el.scrollLeft=Math.max(0, this._zoomTarget);
    }
  }

  /* ---------- history ---------- */
  snapshot(){ this.history.push(JSON.stringify(this.state.tasks)); if(this.history.length>this.HISTORY_MAX) this.history.shift(); this.future=[]; } /* PP-EXT: named cap */
  commit(fn){
    this.snapshot();
    const prev = this.state.tasks; /* PP-EXT: pre-change reference for the outbound gcal diff */
    const tasks = this.state.tasks.map(t=>({...t, deps:[...(t.deps||[])]}));
    fn(tasks);
    this.autoSchedule(tasks); /* PP-EXT: enforce finish-to-start deps (dependency-driven scheduling) */
    this.stampUpdated(prev, tasks); /* PP-EXT B1: bump updatedAt on changed rows (LWW clock) before persisting */
    this.setState({tasks});
    this.saveTasks(tasks); /* PP-EXT */
    this.gcalSyncOut(prev, tasks); /* PP-EXT: single outbound funnel — every task mutation flows through here */
    this.syncOut(prev, tasks); /* PP-EXT B1: second funnel — same before/after diff feeds the Supabase sync queue */
  }
  undo(){
    if(!this.history.length) return;
    this.future.push(JSON.stringify(this.state.tasks)); if(this.future.length>this.HISTORY_MAX) this.future.shift(); /* PP-EXT: cap both stacks — undo/redo cycling grew `future` unbounded */
    const cur=this.state.tasks; /* PP-EXT */
    const prev = JSON.parse(this.history.pop());
    this.setState({tasks:prev});
    this.saveTasks(prev); /* PP-EXT */
    this.gcalSyncOut(cur, prev); /* PP-EXT: an undone change is pushed out too (remote follows local) */
    this.syncOut(cur, prev); /* PP-EXT B1: undo propagates to the backend too (server touch_updated_at freshens the clock) */
  }
  redo(){

  /* ===== PP-EXT V2.9 §4: shared derivations for the Selection view and the Gantt inclusion division =====
     Defined ONCE, consumed by both surfaces, for the same reason `sectionProjection` is shared: two call
     sites that agree today drift tomorrow, whereas one projection cannot disagree with itself. */

  /* PURE-ish (reads only the task + today): did today's calendar bring this task in for the first time?
     True exactly when the occurrence window STARTS today — which is the same statement as "today is in the
     window and yesterday was not", without needing a second window query.
     Dateless tasks are deliberately excluded. `ghostSpan` anchors a dateless task's derived span at today,
     so every dateless task would trivially "start today" and New would fill up with work the calendar
     never actually surfaced. They fall to Extra, which is where a discretionary pick belongs. */
  startsToday(t){
    if(!t || t.archivedAt || this.isMilestone(t)) return false;
    if(!this.isScheduled(t)) return false;
    const B=this.startOfToday();
    const win=this.occForDay(t, B);
    if(!win || win.start==null || win.end==null) return false;
    return this.startOfDay(win.start)===B && B<=this.startOfDay(win.end);
  }
  /* PP-EXT V2.11: did a snooze RUN OUT today? `snoozeUntil` is never cleared on expiry (only an explicit
     include/exclude clears it), so the field itself records the ending — no history table needed. This is
     the second half of the owner's `New` definition: work today brought back, whether the calendar or an
     expiring snooze did the bringing. */
  snoozeEndedToday(t){
    if(!t || t.snoozeUntil==null) return false;
    return this.startOfDay(t.snoozeUntil)===this.startOfToday();
  }
  /* PURE-ish: WHY a task is on today's list — the three columns of the Selection view.
     `extra` is a FALLBACK BUCKET, not a category (the same role `No section` plays, and for the same
     reason): making the third column exhaustive means nothing can fall out of the view.
     These columns are DERIVED, never chosen. No user gesture moves a task between them — only the
     calendar does. That is precisely why the Selection view's drags are vertical-only: offering a
     horizontal drop would be a lever connected to nothing.

     PP-EXT V2.11 (owner, 2026-08-04): `overdue` is a conditional FOURTH column at the far left that
     **outranks every other rule**, and the column renders only while something is in it. It is the one
     column that is about consequence rather than provenance, which is why it takes precedence: if work is
     late, why it arrived stopped being the interesting question.
     `new` also now admits a snooze that ended today, per the owner's "autostarted or snooze ended". */
  isOverdueToday(t){
    if(!t || t.archivedAt || this.isMilestone(t)) return false;
    const d=this.taskDisp(t);
    if(d.dispEnd==null) return false;
    return this.dueChipClass(Object.assign({},t,{end:d.dispEnd,pct:d.dispPct}), this.startOfToday())==='overdue';
  }
  originOf(t){
    if(this.isOverdueToday(t)) return 'overdue';    /* late — outranks provenance */
    if(this.isInheritedToday(t)) return 'existing'; /* included yesterday, still here today */
    if(this.startsToday(t) || this.snoozeEndedToday(t)) return 'new'; /* today brought it in */
    return 'extra';                                  /* everything else you pulled in */
  }
  ORIGIN_KEYS(){ return ['overdue','existing','new','extra']; }
  originLabel(k){ return k==='overdue'?'Overdue':k==='existing'?'Existing':(k==='new'?'New':'Extra'); }
  originHint(k){ return k==='overdue'?'past due — reschedule or do it'
    : k==='existing'?'left from yesterday'
    : k==='new'?'arrived today' : 'everything else'; }

  /* PP-EXT V2.11 (owner, 2026-08-04): the quick-reschedule the Overdue column carries. Moves the due date
     to the end of today and presses the task in, because a task you just rescued from overdue is one you
     have decided to do — leaving it excluded would make the button a half-gesture. Deliberately touches
     `end` only: `start` follows via setDate's window-ordering rule, and nothing else is inferred. */
  rescheduleToToday(id){
    /* `timed:false` is what makes this a DATE move rather than a datetime one — setDate floors to
       midnight, matching the schedule-pin-removal convention that a bare day is midnight. */
    this.setDate(id,'end',this.startOfToday(),false);
    this.setIncludedOn(id);
  }
  /* PURE-ish: the two ROWS. Four states (`active`,`pressed`,`unpressed`,`snoozed`) fold into two.
     `unpressed` folds into Excluded; since V2.11 retired `off` it is the ONLY undecided state there, and
     it must still not read as a decision — see isUndecided. */
  inclusionRow(t){
    const st=this.inclState(t);
    return (st==='pressed'||st==='active') ? 'included' : 'excluded';
  }
  /* The one way this design could quietly lose work: `unpressed` means "I have not looked at this yet",
     `off` means "I decided against this". Both sit in the Excluded row, so if they render identically the
     view silently converts undecided work into rejected work. Callers MUST paint these differently
     (muted, dashed edge). This predicate exists so that rule has a single source. */
  isUndecided(t){ return this.inclState(t)==='unpressed'; }

  /* Position WRITES state — dropping a card/row into a row band calls the existing mutators. Zero new
     persisted fields; snooze stays a per-row control rather than becoming a third row. */
  setInclusionRow(id, row){
    if(row==='included') this.setIncludedOn(id); else this.setIncludedOff(id);
  }
  /* PURE: tasks → the 3×2 grid, plus per-cell and per-column counts. IO-free → unit-tested.
     Both the Selection view and its header counts read this one structure. */
  selectionProjection(tasks){
    const keys=this.ORIGIN_KEYS();
    const cells={}, colCount={}, rowCount={included:0,excluded:0};
    keys.forEach(k=>{ cells[k]={included:[],excluded:[]}; colCount[k]=0; });
    (tasks||[]).forEach(t=>{
      if(!t || t.archivedAt) return;
      const col=this.originOf(t), row=this.inclusionRow(t);
      cells[col][row].push(t); colCount[col]++; rowCount[row]++;
    });
    return {keys, cells, colCount, rowCount};
  }
  /* ===== PP-EXT V2.9 §3: Eisenhower axes =====
     The two axes are NOT the same kind of fact, and that asymmetry is the design, not a shortcut:
       • URGENCY is derivable — it is a function of dates the app already holds.
       • IMPORTANCE is not — no date implies importance. But the user has already declared it via
         `priority`, so the matrix reflects a statement rather than guessing one.
     "Partially automated" means exactly this, and the UI says so, because a matrix that silently guesses
     both axes is a matrix nobody trusts. */

  /* PURE-ish: overdue, OR due within `eisenhowerUrgentDays`, OR today falls inside the occurrence window.
     UNDATED TASKS ARE NEVER URGENT — they land in the bottom row. They are never DROPPED, per the standing
     rule that the laziest path must not silently lose a deadline or a task. */
  isUrgent(t, now){
    if(!t || t.archivedAt) return false;
    const B=this.startOfDay(now==null?(this.state.nowTick||Date.now()):now);
    const days=+((this.state.settings||{}).eisenhowerUrgentDays);
    const horizon=B+(isFinite(days)?days:2)*this.DAY;
    const oc=this.occOf(t);
    if(oc && oc.end!=null){
      const due=this.startOfDay(oc.end);
      if(due<B) return true;        /* overdue */
      if(due<=horizon) return true; /* due within the horizon */
    }
    if(oc && oc.start!=null && oc.end!=null
      && this.startOfDay(oc.start)<=B && B<=this.startOfDay(oc.end)) return true; /* today inside the window */
    return false;
  }
  /* Importance is DECLARED, never inferred. `normalizeTask` defaults priority to 4, so an untouched task
     reads as not-important — which is honest: you have not said it matters. */
  isImportant(t){ return (+((t&&t.priority)||4))<=2; }
  /* PURE: task → one of the four quadrant keys. */
  quadrantOf(t, now){
    const u=this.isUrgent(t, now), i=this.isImportant(t);
    return i ? (u?'do':'schedule') : (u?'delegate':'drop');
  }
  EISENHOWER_QUADRANTS(){ return [
    {k:'do',       label:'Do',            hint:'important · urgent',      important:true,  urgent:true },
    {k:'schedule', label:'Schedule',      hint:'important · not urgent',  important:true,  urgent:false},
    {k:'delegate', label:'Delegate/trim', hint:'not important · urgent',  important:false, urgent:true },
    {k:'drop',     label:'Drop',          hint:'not important · not urgent',important:false,urgent:false} ]; }
  /* PURE: tasks → {quadrantKey: [tasks]}. IO-free → unit-tested. */
  eisenhowerProjection(tasks, now){
    const out={do:[],schedule:[],delegate:[],drop:[]};
    (tasks||[]).forEach(t=>{ if(!t||t.archivedAt||this.isMilestone(t)) return; out[this.quadrantOf(t, now)].push(t); });
    return out;
  }
  /* PP-EXT V2.9 §3: a quadrant drag writes `priority` ONLY — never dates.
     The alternative (a horizontal drag rewrites the due date) is more "complete" but lossy in a way the
     user cannot see at drop time: a careless drop would silently reschedule real work. So vertical
     movement is a real edit and horizontal movement is read-only; the only way to change urgency is to
     change the dates, on a surface that shows you the dates. */
  setQuadrantImportance(id, important){
    this.commit(tasks=>{ const t=tasks.find(x=>x.id===id); if(t) t.priority=important?2:3; });
  }
  /* PP-EXT Track B: explicit include/exclude/snooze mutators (design doc §2 lifecycle) — the popover UI
     (Task 4) calls these instead of the old binary include toggle. Turning on presses and clears snooze;
     snoozing never touches `included` (so an expired snooze always falls back to whatever `included`
     already was). */
  setIncludedTrue(id){ this.commit(tasks=>{ const t=tasks.find(x=>x.id===id); if(t) t.included=true; }); }
  /* ==== PP-EXT V2.11: "Off" is RETIRED (owner rule, 2026-08-04: *Off is a dangerous button*) ====
     `included===false` used to mean "decided against, permanently, until you say otherwise" — a state
     nothing could rescue you from, which is exactly the failure the standing tenet forbids (the
     shortest-effort path must never silently drop a deadline). Turning a task off now returns it to
     **unpressed**, where its own triggers — start date, occurrence window — can press it back later.

     One wrinkle makes this more than deleting a branch: unpressing a task that V2.2 is *inheriting* from
     yesterday is a no-op, because inheritance re-includes it on the spot. So an unpress that would be
     immediately undone snoozes until tomorrow instead. That is not a special case bolted on — it is the
     division of labour the owner named: **snooze means "not today", unpressed means "not chosen"**, and
     turning off a carried-over task is a statement about today. */
  setIncludedOff(id){ this.commit(tasks=>{ const t=tasks.find(x=>x.id===id); if(!t) return;
    t.included=null;
    if(this.isInheritedToday(t)) t.snoozeUntil=this.startOfToday()+this.DAY; }); }
  setIncludedOn(id){ this.commit(tasks=>{ const t=tasks.find(x=>x.id===id); if(t){ t.included=true; t.snoozeUntil=null; } }); }
  snoozeToday(id){ this.commit(tasks=>{ const t=tasks.find(x=>x.id===id); if(t) t.snoozeUntil=this.startOfToday()+this.DAY; }); }
  /* PP-EXT Track B: returns false (no commit) on an unparseable phrase, so the popover input can leave
     the draft untouched instead of silently clearing a snooze on a typo. */
  snoozeUntilText(id, text){
    const ms=this.parseSnoozeText(text, this.state.nowTick||Date.now());
    if(ms==null) return false;
    this.commit(tasks=>{ const t=tasks.find(x=>x.id===id); if(t) t.snoozeUntil=ms; });
    return true;
  }
  /* PP-EXT: inclusive count of days from today to the task's (current-occurrence) due date, ≥1. (No longer used
     since the 'spread' allot mode was removed 2026-07; kept as a small reusable helper.) */
  activeDaysLeft(t){
    const today=this.startOfDay(this.state.nowTick||Date.now());
    const oc = t.recur ? this.currentOcc(t) : {start:t.start, end:t.end};
    const end=this.startOfDay(oc.end);
    return Math.max(1, Math.round((end-today)/this.DAY)+1);
  }
  /* live spent minutes = stored spent + elapsed of this task's running timer (if any) */
  getSpent(t){ let s=t.spent||0; const r=this.state.running&&this.state.running[t.id]; if(r) s+=(this.state.nowTick-r.startedAt)/60000; return Math.max(0,s); }
  /* PP-EXT: spent on a single day (B = any ms in that day). Reads the per-day ledger + the live running
     portion of a timer STARTED that day. This is what computeAllotted subtracts from the day's pool (today's
     work only), and what the Spent-cell "today" toggle shows. */
  getSpentOn(t, B){ const key=this.ymdOf(B); let s=(t.spentByDay&&t.spentByDay[key])||0;
    const r=this.state.running&&this.state.running[t.id]; if(r && this.ymdOf(r.startedAt)===key) s+=(this.state.nowTick-r.startedAt)/60000;
    return Math.max(0,s); }
  /* PP-EXT: the value the Spent column shows, honoring the today/life scope toggle (see toggleSpentScope). */
  spentDisplay(t){ return this.state.spentScope==='life' ? this.getSpent(t) : this.getSpentOn(t, this.startOfToday()); }
  toggleSpentScope(){ const s=this.state.spentScope==='life'?'today':'life'; this.setState({spentScope:s}); this.savePrefs({spentScope:s}); }
  /* PP-EXT V2.3: Focus-row add-time is real tracked work, not a visual counter. Credit lifetime + today's
     ledger through commit() so undo, persistence, sync, and allotment recomputation all observe one mutation. */
  addSpentTime(id, minutes){ const add=Math.max(0,+minutes||0); if(!add) return false; const dk=this.ymdOf(this.startOfToday());
    this.commit(tasks=>{ const t=tasks.find(x=>x.id===id); if(!t) return; t.spent=(t.spent||0)+add;
      const by=Object.assign({},t.spentByDay); by[dk]=(by[dk]||0)+add; t.spentByDay=by; }); return true; }
  isRunning(id){ const key=(id&&id.id!==undefined?id.id:id); return !!(this.state.running && this.state.running[key]); }
  anyRunning(){ const r=this.state.running; return !!(r && Object.keys(r).length); } /* PP-EXT: running is a map (multitasking) */
  /* PP-EXT V2.4: the timer policy lives here so every surface (sheet row, Focus row, timeline block,
     Pomodoro, shape-driven auto-start) obeys it without its own branch. Default `multitask:false` is a
     STRICT single timer — starting one stops every other, crediting each stopped task normally through
     stopTimerAt. Flipping settings.multitask on restores the legacy concurrency. Was: unconditional
     multitasking ("starting a timer does NOT stop the others"). */
  multitaskOn(){ return !!(this.state.settings && this.state.settings.multitask); }
  startTimer(id){ if(this.isRunning(id)) return;
    if(!this.multitaskOn()) this.stopOtherTimers(id);
    const now=Date.now();
    const r=Object.assign({}, this.state.running, {[id]:{startedAt:now, beat:now}});
    this.setState({running:r, nowTick:now}); this.saveRun(r); }
  /* PP-EXT V2.4: stop every running timer except `keepId`. Each stop goes through stopTimerAt so spent /
     spentByDay / undo stay identical to a manual stop; the snapshot is taken first because stopTimerAt
     rewrites state.running underneath the loop. */
  stopOtherTimers(keepId){ Object.keys(this.state.running||{}).forEach(k=>{ if(k!==String(keepId)) this.stopTimerAt(k, Date.now()); }); }
  /* PP-EXT V2.4: click-to-activate. Making a task active starts its timer and pulls it to the front of
     today's plan — V2.1 already gives the active task the first slot (orderingSeam sorts on `active`, and
     its notBefore is clamped to now), so activation needs no scheduling change of its own. Switching
     active stops ONLY the prior active's timer, so independently-started multitask timers keep running;
     in strict mode startTimer then stops the rest anyway. activeTaskId() stays derived from the most
     recent start, so activation persists through pp-run with no new field. */
  activateTask(id){ if(this.isActiveTask({id})) return;
    const prev=this.activeTaskId();
    if(prev!=null && prev!==String(id) && this.isRunning(prev)) this.stopTimer(prev);
    /* already running but not the active one (multitask mode): close its segment and reopen it so the
       derived "most recently started" selector lands on it. stopTimerAt credits, so no time is lost. */
    if(this.isRunning(id)) this.stopTimer(id);
    this.startTimer(id); }
  stopTimer(id){ this.stopTimerAt(id, Date.now()); }
  /* PP-EXT: stop crediting THIS task up to `ts` (clamped to [startedAt, now]). Manual stop and the pinned-end
     auto-pause both credit up to now — a running timer counts wall-clock even across a closed tab / sleep. */
  stopTimerAt(id, ts){ const run=this.state.running||{}; const r=run[id]; if(!r) return;
    const end=Math.min(Math.max(ts, r.startedAt), Date.now());
    const add=Math.max(0,(end-r.startedAt)/60000);
    /* accumulate fractional minutes (fmtDur rounds for display); rounding on every stop lost time
       across many short sessions. */
    /* PP-EXT: credit both the lifetime total and the per-day ledger (keyed by the segment's START day —
       a session running across midnight lumps to its start day, matching the single-credit model; see getSpentOn). */
    const dk=this.ymdOf(r.startedAt);
    this.commit(tasks=>{ const t=tasks.find(x=>x.id===id); if(t){ t.spent=(t.spent||0)+add;
      const by=Object.assign({}, t.spentByDay); by[dk]=(by[dk]||0)+add; t.spentByDay=by; } });
    const nr=Object.assign({}, this.state.running); delete nr[id];
    this.setState({running:nr}); this.saveRun(nr); }
  /* PP-EXT: heartbeat across ALL running timers, called from the 1s run tick and once on mount. Timers persist
     across sleep / a closed tab (owner choice) — there is no inactivity auto-stop; this only refreshes the
     persisted beat every TIMER_BEAT_MS so pp-run stays current. */
  timerHeartbeat(){ const cur=this.state.running||{}; if(!Object.keys(cur).length) return;
    const now=Date.now(); let changed=false; const nr=Object.assign({}, cur);
    Object.keys(cur).forEach(id=>{ const r=cur[id]; if(now-(r.beat||r.startedAt)>=this.TIMER_BEAT_MS){ nr[id]=Object.assign({},r,{beat:now}); changed=true; } });
    if(changed){ this.setState({running:nr}); this.saveRun(nr); } }
  toggleTimer(id){ if(this.isRunning(id)) this.stopTimer(id); else this.startTimer(id); }
  /* PP-EXT: shape-driven auto timers. A fixed appointment auto-starts its timer when the clock reaches its
     start and auto-pauses silently (no prompt) at its end. V2.4: it routes through startTimer, so under the
     default strict single-timer policy the arriving appointment stops whatever was running (you are at the
     appointment now); with `multitask` on it stacks, as it always did. A clocked start
     without an end never auto-starts because it has no defined stop; its notification remains the reminder.
     Decisions are pure (autoTimerPlan) so they're unit-testable; autoTimerTick applies them. */
  autoTimerPlan(now){ const start=[], pause=[]; (this.state.tasks||[]).forEach(t=>{
      if(this.isMilestone(t)||t.archivedAt) return;
      if(!this.isFixedToday(t)) return;
      const oc=this.occOf(t); const startMs=oc.start; const endMs=oc.end; const key=t.id+':'+startMs;
      const running=this.isRunning(t.id);
      if(running&&now>=endMs){ if(!this._autoPaused[key]) pause.push(t.id); return; }
      if(now>=startMs&&now<endMs&&!running&&!this._autoDone[key]) start.push(t.id);
    }); return {start, pause}; }
  autoTimerTick(){ const now=Date.now(); const plan=this.autoTimerPlan(now);
    plan.start.forEach(id=>{ const t=this.state.tasks.find(x=>x.id===id); if(!t) return;
      this._autoDone[id+':'+this.occOf(t).start]=true; this.startTimer(id); });
    plan.pause.forEach(id=>{ const t=this.state.tasks.find(x=>x.id===id); if(!t) return;
      this._autoPaused[id+':'+this.occOf(t).start]=true; this.stopTimer(id); /* PP-EXT: silent — no prompt/note */ }); }

  /* ==== PP-EXT Phase 10: Pomodoro — work/break cycles bound to the existing task timer. Session persists in
     `pp-pomo` so a reload resumes it (transitions only advance while the tab is open — the same "no background
     worker" limit as notifications). The decision logic (pomoState / pomoAdvance) is pure & unit-tested; the
     control methods apply it (bind the task timer, fire the interval-end notification). ==== */
  loadPomo(){ try{ const p=JSON.parse(this.lsGet('pp-pomo')||'null'); return (p&&typeof p==='object'&&p.phase)?p:null; }catch(e){ return null; } }
  savePomo(p){ try{ if(p) this.lsSet('pp-pomo', JSON.stringify(p)); else this.lsRemove('pp-pomo'); }catch(e){} }
  pomoActive(){ return !!this.state.pomo; }
  /* PP-EXT: the task whose block currently spans "now" in today's packed timeline — the pomodoro picker
     defaults to this so starting a session binds the thing you're actually supposed to be doing right now. */
  currentTimelineTaskId(){
    try{ const data=this.buildDayTimeline(this.startOfToday()); const now=this.state.nowTick||Date.now();
      const c=(data.chunks||[]).find(c=>c.id && c.type!=='meal' && c.start!=null && c.end!=null && now>=c.start && now<c.end);
      return c?c.id:null; }catch(e){ return null; }
  }
  /* Lazily seeds the (unset) picker with the active timeline task the first time the picker is shown, without
     stomping a pick the user already made. */
  pomoDefaultPick(){ if(this._pomoPick==null) this._pomoPick=this.currentTimelineTaskId()||''; return this._pomoPick; }
  pomoCfg(){ return Object.assign({work:25,break:5,long:15,cycles:4}, (this.state.settings&&this.state.settings.pomo)||{}); }
  /* PURE: minutes → ms for a phase (min 1 min so a mis-set 0 can't spin). */
  pomoPhaseDur(phase, s){ s=s||this.pomoCfg(); const m = phase==='break'?s.break : phase==='long'?s.long : s.work; return Math.max(1, +m||1)*60000; }
  /* PURE: the live state of a session at `now` — current phase, elapsed/remaining, and whether the phase is done. */
  pomoState(pomo, now, s){ if(!pomo||!pomo.phase) return null; s=s||this.pomoCfg();
    const durMs=this.pomoPhaseDur(pomo.phase, s); const elapsedMs=Math.max(0, now-(pomo.phaseStart||now));
    return { phase:pomo.phase, cycle:pomo.cycle||0, durMs, elapsedMs, remainingMs:Math.max(0, durMs-elapsedMs), done: elapsedMs>=durMs }; }
  /* PURE: the next session after a phase completes. work → break (or long every `cycles` work sessions);
     break/long → work. `phaseStart` restarts at `now` (a closed tab pauses the cycle rather than skipping many). */
  pomoAdvance(pomo, s, now){ s=s||this.pomoCfg(); const cyc=pomo.cycle||0; let phase, cycle;
    if(pomo.phase==='work'){ const nc=cyc+1; if(nc>=Math.max(1, s.cycles||4)){ phase='long'; cycle=nc; } else { phase='break'; cycle=nc; } }
    else if(pomo.phase==='long'){ phase='work'; cycle=0; }
    else { phase='work'; cycle=cyc; }
    return { taskId:pomo.taskId||null, phase, cycle, phaseStart: now }; }
  /* Bind the task timer to the phase: work → its timer runs; break/long → paused. No-op when standalone (no task). */
  applyPomoTimer(pomo){ const tid=pomo&&pomo.taskId; if(!tid || !this.state.tasks.find(t=>t.id===tid)) return;
    const work=pomo.phase==='work';
    if(work && !this.isRunning(tid)) this.startTimer(tid);
    else if(!work && this.isRunning(tid)) this.stopTimer(tid); }
  startPomodoro(taskId){ const now=Date.now(); const pomo={ taskId: taskId||null, phase:'work', phaseStart:now, cycle:0 };
    this.setState({pomo}); this.savePomo(pomo); this.applyPomoTimer(pomo); }
  stopPomodoro(){ const p=this.state.pomo; if(p && p.taskId && p.phase==='work' && this.isRunning(p.taskId)) this.stopTimer(p.taskId);
    this.setState({pomo:null}); this.savePomo(null); }
  /* Manual skip → jump to the next phase now (undo-free; it's ephemeral session state, not a task mutation). */
  skipPomoPhase(){ const p=this.state.pomo; if(!p) return; const next=this.pomoAdvance(p, this.pomoCfg(), Date.now());
    this.setState({pomo:next}); this.savePomo(next); this.applyPomoTimer(next); this.pomoNotify(p.phase, next); }
  /* Called from the tick loops: when the current phase is done, roll to the next and fire the interval-end alert. */
  pomoTick(now){ now=now||Date.now(); const p=this.state.pomo; if(!p) return;
    const st=this.pomoState(p, now); if(!st || !st.done) return;
    const next=this.pomoAdvance(p, this.pomoCfg(), now);
    this.setState({pomo:next}); this.savePomo(next); this.applyPomoTimer(next); this.pomoNotify(p.phase, next); }
  pomoNotify(fromPhase, next){ if(!this.notifyOn('pomodoro')) return; if(this.notifyPermission()!=='granted') return;
    const toBreak = fromPhase==='work';
    const title = toBreak ? (next.phase==='long'?'🍅 Long break':'🍅 Break time') : '🍅 Back to focus';
    const body = toBreak ? ('Work interval done — take a'+(next.phase==='long'?' long':'')+' break.') : 'Break over — start your next focus interval.';
    try{ const n=new Notification(title,{ body, tag:'pomo' }); setTimeout(()=>{ try{ n.close(); }catch(e){} }, 8000); }catch(e){} }
  /* ==== /PP-EXT Phase 10: Pomodoro ==== */

  /* ===== PP-EXT Phase 8: notifications ===== */
  /* Fired-once ledger + last morning-summary day. Persisted so a reload doesn't re-fire a passed trigger.
     Prune fired keys older than a few days so the map stays bounded (they're one-shot per occurrence). */
  loadNotify(){ let n; try{ n=JSON.parse(this.lsGet('pp-notify')||'{}'); }catch(e){ n={}; }
    n=n||{}; if(!n.fired||typeof n.fired!=='object') n.fired={};
    const cut=Date.now()-3*86400000; Object.keys(n.fired).forEach(k=>{ if((+n.fired[k]||0)<cut) delete n.fired[k]; });
    return { fired:n.fired, summaryDay:n.summaryDay||null }; }
  saveNotify(){ try{ this.lsSet('pp-notify', JSON.stringify(this._notify)); }catch(e){} }
  notifyOn(key){ const n=(this.state.settings&&this.state.settings.notify)||{}; return n[key]!==false; } /* default ON */
  notifyPermission(){ try{ return (typeof Notification!=='undefined') ? Notification.permission : 'unsupported'; }catch(e){ return 'unsupported'; } }
  notifySupported(){ return this.notifyPermission()!=='unsupported'; }
  requestNotifyPermission(){ if(!this.notifySupported()) return;

  clockLabel(ms){ const d=new Date(ms); let hh=d.getHours(), mm=d.getMinutes(); const ap=hh<12?'a':'p'; hh=(hh%12)||12; return hh+':'+String(mm).padStart(2,'0')+ap; }

  /* Pure decision: which browser notifications are DUE at `now` and not yet in `fired`. IO-free & unit-tested
     (mirrors autoTimerPlan). Each spec: {key, type, urgent, title, body}. Enable/permission gating is in notifyTick. */
  notifyPlan(now, fired){ const out=[]; fired=fired||{}; const dayKey=this.startOfDay(now);
    (this.state.tasks||[]).forEach(t=>{
      if(this.isMilestone(t)||t.archivedAt) return;
      const active=this.isActiveToday(t); const oc=this.occOf(t);
      /* Urgent: clocked task about to start (T−LEAD .. start) */
      if(active && this.hasStartTime(t) && oc.start!=null){ const k='start:'+t.id+':'+oc.start;
        if(!fired[k] && now>=oc.start-this.NOTIFY_LEAD_MS && now<oc.start)
          out.push({key:k, type:'startPin', urgent:true, title:'Starting soon', body:t.name+' starts at '+this.clockLabel(oc.start)}); }
      /* Normal: a fixed appointment just ended */
      if(active && this.isFixedToday(t) && oc.end!=null){ const k='blockend:'+t.id+':'+oc.end;
        if(!fired[k] && now>=oc.end && now<oc.end+this.NOTIFY_GRACE_MS)
          out.push({key:k, type:'blockEnd', urgent:false, title:'Block ended', body:t.name+' — scheduled block is over'}); }
      /* Urgent: deadline at risk — remaining work exceeds the time left before it's due (throttled once/day) */
      if((+t.pct||0)<100){ const due=this.dueMsOf(t, this.startOfToday());
        if(due!=null && due>now){ const remainingMin=Math.max(0,(+t.planned||0)*(1-(+t.pct||0)/100)); const leftMin=(due-now)/60000;
          if(remainingMin>0 && remainingMin>leftMin){ const k='risk:'+t.id+':'+dayKey;
            if(!fired[k]) out.push({key:k, type:'deadlineRisk', urgent:true, title:'Deadline at risk',
              body:t.name+': needs '+this.fmtDur(Math.round(remainingMin))+' but only '+this.fmtDur(Math.round(leftMin))+' left before due'}); } } }
    }); return out; }

  /* Map a spec's type → its settings toggle. */
  notifyTypeEnabled(type){ return this.notifyOn(type); }
  /* Apply the plan: fire enabled specs whose permission is granted, mark them fired, persist. Also raises the
     once-a-day in-app morning summary. Called from the tick loops (safe to call every tick — dedup guards it). */
  notifyTick(now){ now=now||Date.now();
    if(this.notifyPermission()==='granted'){
      const plan=this.notifyPlan(now, this._notify.fired);
      plan.forEach(spec=>{ if(!this.notifyTypeEnabled(spec.type)) return;
        this._notify.fired[spec.key]=now; /* mark before firing so a throw can't loop it */
        try{ const n=new Notification(spec.title,{ body:spec.body, requireInteraction:!!spec.urgent, tag:spec.key });
          if(!spec.urgent) setTimeout(()=>{ try{ n.close(); }catch(e){} }, 8000); }catch(e){} });
      if(plan.length) this.saveNotify();
    }
    this.maybeMorningSummary(now);
  }
  /* Morning summary: once per calendar day, on the first tick of the day, raise the in-app popup. Gated by the
     toggle; auto-dismisses after SUMMARY_TTL. Persist the day even when toggled off so it stays once-a-day. */
  maybeMorningSummary(now){ now=now||Date.now(); const day=this.startOfDay(now);
    if(this._notify.summaryDay===day) return; this._notify.summaryDay=day; this.saveNotify();
    if(!this.notifyOn('morningSummary')) return;
    const data=this.morningSummaryData(now); this.setState({summary:data});
    clearTimeout(this._summaryT); this._summaryT=setTimeout(()=>this.closeSummary(), this.SUMMARY_TTL_MS); }
  closeSummary(){ clearTimeout(this._summaryT); this.setState({summary:null}); }
  /* Pure-ish snapshot for the popup: today's counts + the tasks that still need planning (Phase 7 'unplanned'). */
  morningSummaryData(now){ now=now||Date.now(); const byId={}; (this.state.tasks||[]).forEach(t=>byId[t.id]=t);
    const live=(this.state.tasks||[]).filter(t=>!t.archivedAt && !this.isMilestone(t));
    const activeToday=live.filter(t=>this.isActiveToday(t));
    const done=activeToday.filter(t=>(+t.pct||0)>=100).length;
    const overdue=live.filter(t=>(+t.pct||0)<100 && this.dueMsOf(t, this.startOfToday())<now).length;
    const unplanned=live.filter(t=>this.matchChip(t,'unplanned',byId));
    return { day:this.startOfDay(now), activeCount:activeToday.length, doneCount:done, overdueCount:overdue,
      unplanned:unplanned.slice(0,8).map(t=>t.name), unplannedTotal:unplanned.length }; }

  /* PP-EXT: the day's schedulable free intervals (ms). window [dayStart,dayEnd] minus meals minus the reserved
     freeTime block (pinned to the end of the window), optionally clamped to `from` for pack-from-now. Single
     source of truth shared by computeAllotted (pool = Σ length) and buildDayTimeline (the bins to pack into). */
  dayIntervals(B, from, extraBusy, keepClear){ /* PP-EXT: extraBusy = pinned-task blocks; keepClear = zero-width Point dividers */
    const s=this.state.settings;
    const winStart=B+this.timeParts(s.dayStart)*60000, winEnd=B+this.timeParts(s.dayEnd)*60000;
    const lo=from!=null?Math.max(winStart,Math.min(from,winEnd)):winStart;
    const busy=[];
    const addBusy=(a,b,note,taskId)=>{ const s0=Math.max(a,winStart),e0=Math.min(b,winEnd); if(e0>s0) busy.push({start:s0,end:e0,note,taskId}); }; /* PP-EXT: taskId marks pinned-task blocks */
    addBusy(B+this.timeParts(s.lunchStart)*60000, B+this.timeParts(s.lunchEnd)*60000, 'Lunch');
    addBusy(B+this.timeParts(s.dinnerStart)*60000, B+this.timeParts(s.dinnerEnd)*60000, 'Dinner');
    const ft=Math.max(0, s.freeTime||0); if(ft>0) addBusy(winEnd-ft*60000, winEnd, 'Free time');
    (extraBusy||[]).forEach(b=>addBusy(b.start, b.end, b.note, b.taskId)); /* PP-EXT */

    if(cur<winEnd) free.push({start:cur,end:winEnd});

    (keepClear||[]).forEach(x=>{ const nf=[];

  /* PP-EXT: the "from now" toggle starts the plan (and pool) at the current time — but ONLY for today's column.
     Future-day timelines always plan the whole day (B ≠ today ⇒ null). B omitted ⇒ today. */
  packStart(B){ const today=this.startOfToday();
    return (this.state.settings.packFromNow && (B==null || B===today)) ? (this.state.nowTick||Date.now()) : null; }

  /* PP-EXT: derived scheduling shapes. A clocked start plus a real, <=1-day end is a fixed appointment;
     a clocked start with no end and no planned duration is a keep-clear Point; an end with an untimed start
     is a hard deadline; everything else packs flexibly. Day-level windows remain enforced by isActiveOn. */
  occOf(t){ return t.recur ? this.currentOcc(t) : {start:t.start, end:t.end}; }
  /* PP-EXT (V1.2 ghost blocks): derive a render-time span for a task whose start and/or end are still
     null, WITHOUT mutating the task — the nulls stay in data (so gcal-outbound keeps skipping dateless
     tasks, and the task can never go overdue on a date it was never given). `today` = start-of-today ms.
     Returns {start,end,ghostStart,ghostEnd}: ghostStart/ghostEnd flag which edge is derived (grey/dotted).
       • solid (both set)      → the real span, no ghosts.
       • double-ghost (both null) → today→today+DAY, re-derived each day (always actionable, never overdue).
       • half-ghost (start set)   → a non-overdue derived end = max(start,today)+DAY.
       • deadline (end set only)  → a ghost start at today (or end-DAY if the deadline is already past),
                                    so the bar runs from now to the due date without inventing a real start. */
  ghostSpan(t, today){
    const DAY=this.DAY, s=t.start, e=t.end;
    if(s!=null && e!=null) return {start:s, end:e, ghostStart:false, ghostEnd:false};
    if(s==null && e==null) return {start:today, end:today+DAY, ghostStart:true, ghostEnd:true};
    if(s!=null && e==null) return {start:s, end:Math.max(s,today)+DAY, ghostStart:false, ghostEnd:true};
    return {start:Math.min(today, e-DAY), end:e, ghostStart:true, ghostEnd:false};
  }
  /* PP-EXT (V1.2 round2): the ghost bar's PAINT, split out of renderBar so it is IO-free and unit-testable.
     Takes an occurrence's ghost flags + the bar's base colour; returns the style pieces or null for a solid
     bar. The key insight is that a half-ghost has no committed *region*, only a committed *edge* — ghostSpan
     derives the whole width — so the paint is an ANCHOR signal, not a real-vs-derived split: the bar is fully
     the task's colour at the edge you actually set and dissolves toward the edge you didn't.
       • solid        → null (caller paints the usual rounded, flat-colour bar).
       • double-ghost → flat grey, dotted outline all round at full opacity, no anchor (nothing is committed).
       • half-ghost   → anchor 'l' (start set, dissolves right) or 'r' (due set, dissolves left); the fill
                        ramps colour→transparent while `mask` ramps the dotted outline transparent→opaque,
                        so dots fade IN exactly as colour fades OUT.
     `anchor` also tells the caller which side gets the solid base-coloured border (the committed edge reads
     as the task, not as an absence). */
  /* PP-EXT (V1.2 round3): the span a ghost is DRAWN across, which is not the span it derives. `ghostSpan` keeps
     its 1-day derived extent in data; this widens the drawing so a ghost stays legible when zoomed out, growing
     AWAY from the committed edge so the anchor never moves:
       • anchor left  (start real, end ghost) → grows right
       • anchor right (due real, start ghost) → grows left, so the due date stays pinned to its column
       • double-ghost (no anchor)             → grows right from today
     A ghost already wider than the floor (e.g. a deadline with a month of runway) is returned untouched — the
     floor is a `max`, never a shrink. Solid bars pass straight through. PURE (ms + px in, ms out) → unit-tested.
     Both the renderer and startBarDrag call this, so a ghost edge is dragged from where it is actually DRAWN
     rather than from its hidden derived date (which would make the bar jump on the first pixel of the gesture). */
  ghostDrawSpan(o, dayW, viewW){
    if(!o || !o.ghost) return {start:o.start, end:o.end};
    const minMs = Math.max(this.DAY, (viewW||0)*this.GHOST_VIEW_FRAC/(dayW||1)*this.DAY);
    if(o.end - o.start >= minMs) return {start:o.start, end:o.end};
    if(o.ghostStart && !o.ghostEnd) return {start:o.end-minMs, end:o.end};   /* anchored on the due date */

  }
  /* PP-EXT: the Gantt viewport width in px (0 before the scroller mounts — callers fall back to the 1-day floor). */
  ganttViewW(){ const el=this.ganttScrollEl; return (el && el.clientWidth) || 0; }
  ghostPaint(o, base){

  /* PP-EXT: the occurrence relevant to day B (multi-day timelines). For today (or B omitted) this is the exact
     current-occurrence behaviour (occOf); for another day it's the occurrence overlapping [B, B+DAY), so a Week
     column schedules that day's own instance of a repeating task. Non-recurring tasks have a single occurrence. */
  occForDay(t, B){
    if(B==null || B===this.startOfToday()) return this.occOf(t);

    const occs=(this._occById&&this._occById[t.id])||this.expandTask(t,this._horizon||t.end);
    const dayEnd=B+this.DAY;

  /* Does this edge carry a user-typed time? A null flag derives from the timestamp; an explicit flag

  hasStartTime(t){ if(t.start==null) return false;

  hasEndTime(t){ if(t.end==null) return false;
    return t.endClock!=null ? !!t.endClock : this.hasClock(t.end); }

  isFixedOn(t, B){

    if(!this.hasStartTime(t)) return false;

    if(oc.start==null || oc.end==null) return false;
    if(this.startOfDay(oc.start)!==B) return false;

     manual end (midnight clock) means "due that day" → end of that day (the old GAS EOD rule). B = the day being
     scheduled (occurrence-for-B); omitted ⇒ today. */
  dueMsOf(t, B){
    const oc=this.occForDay(t, B);
    if(oc.end==null) return (B!=null?B:this.startOfToday())+this.DAY; /* PP-EXT: dateless task — due = end of the day it's scheduled into (today) */
    if(t.allDay) return oc.end;

  /* PP-EXT: drag-pin (Phase 5) — a block dragged in the drawer timeline is fixed at its dropped clock time
     FOR THAT DAY ONLY. Returns the block span {start,end} when the task carries an active pin for today, else
     null. The duration is captured at drop (pin.dur) rather than derived, so it stays stable regardless of
     later allotment churn (mirrors a fixed appointment's clock span — no circular dependency with the pool).
     Stale pins (pin.day ≠ today) are ignored; milestones can't be pinned. A drag-pinned subtask (leaf child)
     leaves its parent's family packing and becomes its own fixed block — see famAllot / distribute / queueFor. */
  dragBlock(t, B){
    const p=t.pin; if(!p || p.day!==B) return null;
    if(this.isMilestone(t)) return null;

  fixedBlocksToday(B, tasks){
    const src=tasks||this.state.tasks;
    const byId={}; src.forEach(t=>byId[t.id]=t); /* PP-EXT: for a pinned subtask's "Parent › Child" label */
    const labelOf=t=>(t.parentId!=null && byId[t.parentId]) ? (byId[t.parentId].name+' › '+t.name) : t.name;
    const out=[];
    src.forEach(t=>{

        const oc=this.occForDay(t, B);
        const a=Math.max(oc.start, B), b=Math.min(oc.end, B+this.DAY);
        if(b>a) out.push({start:a, end:b, note:t.name, taskId:t.id});
        return;
      }
      if(!this.isActiveOn(t, B)) return; /* a drag-pin only holds while the task participates that day */
      const db=this.dragBlock(t, B);

  }
  /* PP-EXT: keep-clear Point: a clocked instant with no end and no duration. It reserves no time,

  isPointOn(t, B){
    if(this.isMilestone(t)) return false;
    if(!this.hasStartTime(t)) return false;
    if(t.end!=null) return false;
    if((t.planned||0) > 0) return false;               /* raw planned — must not touch _allot (called inside computeAllotted) */
    const oc=this.occForDay(t, B);

  /* PP-EXT Track B (Group 2): render-only Point list — same rows as keepClearToday, but richer

  pointsToday(B, tasks){
    const src=tasks||this.state.tasks; const out=[];
    src.forEach(t=>{ if(this.isPointOn(t, B)) out.push({id:t.id, ms:this.notBeforeMsOf(t, B), title:t.name}); });
    return out.sort((a,b)=>a.ms-b.ms);
  }
  /* PP-EXT Track B (Group 2): a "top-hover" agenda item — a dated-but-untimed task that reserves NO time
     (raw planned 0) and isn't otherwise drawn (not a Point, fixed block, drag-pin, or milestone). It
     belongs to the day its date-instant (due if present, else anchor) falls on. Render-only: reserves
     nothing, so pool/allotment math is untouched. Uses raw planned (not _allot) to stay order-independent,
     like isPointOn; uses occForDay so recurring occurrences land on the right day. */
  isTopHoverOn(t, B){
    if(this.isMilestone(t) || t.archivedAt) return false;
    if((t.planned||0) > 0) return false;                         /* packs a block → not a hover line */
    /* PP-EXT V2.11: the any-day `included===false` exclusion left with "Off". */
    if(B===this.startOfToday() && this.isOptedOut(t)) return false; /* today snooze/unpressed */
    if(this.isFixedOn(t, B)) return false;                      /* has a clock span → drawn as a block */
    if(this.isPointOn(t, B)) return false;                      /* clocked anchor → drawn as a caret */
    if(this.hasDragPinToday(t, B)) return false;                /* drawn as a pinned block */
    const oc=this.occForDay(t, B);
    const inst = oc.end!=null ? oc.end : oc.start;
    if(inst==null) return false;                                /* dateless → not a hover line */
    /* A real clock disqualifies; bare dates sit at midnight and remain agenda chips. */
    const clocked = oc.end!=null ? this.hasEndTime(t) : this.hasStartTime(t);
    if(clocked) return false;                                   /* timed → not a hover line */
    return this.startOfDay(inst) === B;                          /* belongs to day B */
  }
  topHoverToday(B, tasks){
    const src=tasks||this.state.tasks;
