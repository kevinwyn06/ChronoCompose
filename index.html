  }
  /* /PP-EXT */
  /* ==== PP-EXT: subtasks (ROADMAP Phase 4) ====
     parentId nests tasks (arbitrary depth in the table, collapsible). Owner's budget model: the parent
     keeps its own Planned; its allotted time is distributed to children proportional to child Planned,
     any unassigned remainder stays with the parent (recursive, so grandchildren partition their parent's
     share). Children never sync to gcal and never compete in the allotment pool themselves. */
  /* PP-EXT V2.3: tag mutations are pure so inline row editing and the detail sheet share exactly the same
     normalization/deduplication rules. Stored labels never include the display-only @ prefix. */
  normalizeTag(raw){ const m=String(raw==null?'':raw).trim().match(/^@?([a-z0-9_-]+)$/i); return m?m[1].toLowerCase():null; }
  addTaskTag(labels, raw){ const tag=this.normalizeTag(raw); const out=(labels||[]).slice();

  removeTaskTag(labels, raw){ const tag=this.normalizeTag(raw); if(!tag) return (labels||[]).slice();

    this.commit(tasks=>{ const t=tasks.find(x=>x.id===id); if(t) t.labels=this.addTaskTag(t.labels,tag); }); return true; }
  removeLabel(id, raw){ const tag=this.normalizeTag(raw); if(!tag) return false;
    this.commit(tasks=>{ const t=tasks.find(x=>x.id===id); if(t) t.labels=this.removeTaskTag(t.labels,tag); }); return true; }
  /* PP-EXT V2.6: Each task appears once. A subtree inherits its ROOT task's section so grouping never tears
     parent/child rows apart — that rule is kept verbatim from V2.3; only the lookup changed, from
     `root.labels[0]` (a tag) to `root.sectionId` (a real container). Section order follows the

     untagged bucket jump around as data changed. */
  /* The one place section render order is decided: `order` ascending, ties broken by id for stability.
     Both the grouping projection and the row menu read this, so the list can never disagree with itself. */

       visible day range actually changes, so scrolling reveals off-screen bars without a per-frame re-render. */

    /* PP-EXT: the structural caches (CPM, slack, recurrence expansion, timeline range) depend only on the task
       data — which is replaced by a NEW array on every edit/undo/redo/drag. Recompute them only when that array
       identity changes, so timer ticks, hovers, and selection (which keep the same tasks array) skip the costly
       recurrence expansion + CPM. The live allotment map is cheap and recomputed every render below. */
    if(this._structTasksRef !== tasks){
      this._structTasksRef = tasks;
      this._cpm = this.computeCPM(tasks);

      const todayStart=this.startOfToday();
      let bmin=Infinity,bmax=-Infinity;
      /* repeats never anchor the timeline to their (possibly long-past) first occurrence — their visible range
         is taken from today-and-future occurrences in the loop below. */
      tasks.forEach(t=>{ if(!this.isScheduled(t)||t.recur) return; bmin=Math.min(bmin,t.start); bmax=Math.max(bmax,t.end); });
      if(!isFinite(bmin)){ bmin=todayStart; bmax=bmin+42*this.DAY; }
      let horizon=bmax;
      if(tasks.some(t=>t.recur)){
        let uMax=-Infinity; tasks.forEach(t=>{ if(t.recur&&t.recur.until!=null) uMax=Math.max(uMax,t.recur.until); });
        horizon=Math.max(bmax+75*this.DAY, isFinite(uMax)?uMax:-Infinity);

          /* PP-EXT (V1.2): a dateless (or half-dated) NON-recurring task still gets one draggable GHOST
             occurrence, derived from today — the task's start/end stay null in data. Recurring tasks need
             real dates to expand, so a rule-less/dateless recur (shouldn't happen) still yields no bar. */
          if(t.recur){ this._occById[t.id]=[]; return; }
          const g=this.ghostSpan(t, todayStart);
          this._occById[t.id]=[{idx:0, start:g.start, end:g.end, ghost:true, ghostStart:g.ghostStart, ghostEnd:g.ghostEnd}];
          gmin=Math.min(gmin,g.start); gmax=Math.max(gmax,g.end); return;

        occs.forEach(o=>{ if(t.recur && (o.start<todayStart || this.occPct(t,o.idx)>=100)) return; /* past/completed repeats don't extend the range */ gmin=Math.min(gmin,o.start); gmax=Math.max(gmax,o.end); }); });

    }
    this._allot = this.computeAllotted(tasks); /* PP-EXT: allotted/remaining map — live (spent/settings), reads memoized _occById */
    /* PP-EXT: month-view — hovering a day glows all its tasks in the sheet + gantt (Phase 6) */
    this._glowIds = this.state.hoverDay!=null ? new Set(this.tasksOnDay(this.state.hoverDay, tasks)) : null;
    return {
      board: this.renderBoard(tasks),
      drawer: this.renderDrawer(),                         /* PP-EXT */
      drawertoggle: this.renderDrawerToggle(),             /* PP-EXT */
      viewtoggle: this.renderViewToggle(),                 /* PP-EXT: Gantt|Calendar main-view toggle */
      topcontext: this.renderTopContext(),                 /* PP-EXT: context-aware top-bar slot (Plan/Focus/Review, Journal nav, Archive count) */

  /* ---------- zoom presets + today ---------- */
  /* PP-EXT: the zoom-preset toolbar (this method) and the "⌖ Jump" button (jumpToday) were removed from the
     top bar in the declutter pass — Gantt zoom is now Ctrl/Cmd+scroll only (onWheelZoom below). */
  onWheelZoom(e){
    if(!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    /* normalize deltaMode (0=px, 1=lines, 2=pages) to pixel-equivalent so trackpad/mouse feel consistent */
    const delta = e.deltaY * (e.deltaMode===1 ? 16 : e.deltaMode===2 ? 400 : 1);
    const el = e.currentTarget || this.ganttScrollEl;
    if(!el){ const nw=this.zoomStep(this.state.dayW,delta); if(nw!==this.state.dayW) this.setState({dayW:nw}); return; }
    /* PP-EXT (V1.3 fix4): smooth cursor-anchored zoom. Two problems the naive version had: (a) each wheel
       event did its own setState → on a trackpad burst that's ~8 re-renders/gesture, each repositioning every
       bar → jitter; (b) the content grows on the async re-render, so scrollLeft has to be re-pinned after it
       lands. Fix: COALESCE — accumulate the target dayW/scrollLeft here, and let ONE requestAnimationFrame
       loop do a single setState + scroll-pin per frame (paint-synced, so no tearing). The cursor anchor
       (scrollLeft + offset + dayW) is captured ONCE per burst so nothing chains off a not-yet-applied
       scrollLeft. A setTimeout backstop guarantees the final landing even in a background tab (rAF paused). */
    const r=el.getBoundingClientRect();
    const now=Date.now();
    const oldW=this.state.dayW;
    const newW=this.zoomStep(oldW, delta);
    if(newW===oldW) return;
    const burstActive = this._zoomAnchor && (now-this._zoomAnchor.t <= this.ZOOM_BURST_MS);
    /* PP-EXT (V1.3 fix6): the app renders inside a `zoom:0.8` wrapper, so getBoundingClientRect (and clientX)
       report RENDERED px while scrollLeft / dayW / scrollWidth are all in the element's LOCAL px. Convert the
       cursor offset back into local px by the element's own measured scale (rect.width / offsetWidth) — else the
       anchor point lands ~0.8× short and the zoom pivots to the LEFT of the cursor. Measured, not hardcoded, so
       it survives any future zoom value. */
    const uiScale = (r.width>0 && el.offsetWidth>0) ? (r.width/el.offsetWidth) : 1;
    if(!burstActive){ this._zoomAnchor={ scrollLeft:el.scrollLeft, off:(e.clientX-r.left)/uiScale, w:oldW }; }
    const za=this._zoomAnchor; za.t=now;
    /* The cursor anchor (scrollLeft + offset + dayW) is captured ONCE per burst so every event's target is the
       ABSOLUTE scrollLeft for the current width — nothing chains off a not-yet-applied scrollLeft (that caused
       trackpad drift). */
    this._zoomTarget=this.zoomScrollAnchor(za.w, newW, za.scrollLeft, za.off);
    /* Hand the pin to componentDidUpdate: React commits the new dayW (grown/shrunk content width) there,
       synchronously after the DOM mutation and BEFORE paint, so setting scrollLeft then lands against the
       already-resized scrollWidth (never clamped short) and the browser paints the new width + new scroll in
       ONE frame. This removes the scroll-vs-render RACE that a rAF/timeout chase loop could only retime, never
       close (the old jitter + burst-end drift). Element cached so the hook needs no re-lookup. */
    this._zoomPinEl=el;
    this.setState({dayW:newW});
  }

  /* ---------- quick add ---------- */

  /* ==== PP-EXT (V1.4): cursor-anchored overlay placement under the app's CSS `zoom` ====
     The whole app renders inside a `zoom:0.8` wrapper (index.html top div). A position:fixed overlay
     INSIDE a zoomed ancestor is laid out in the ancestor's LOCAL px, so `left:X` paints at `X*zoom`,
     while mouse events (clientX/Y) and window.innerWidth are RENDERED px. Every cursor-anchored popup
     (context menu, date picker, %-pop, incl popover) therefore appeared up/left of the pointer by
     (1−zoom)× its distance from the origin — 240px at x=1200, measured live in Chrome. Convert the
     client point into the overlay's own space before using it as left/top. Same unit rule as the gantt
     zoom pin (V1.3 fix6): the scale is MEASURED, never a hardcoded 0.8, so a future wrapper change or a
     zoom-free embed both keep working. */
  scaleFixedPt(x,y,k){ const s=(k&&k>0)?k:1; return {x:x/s, y:y/s}; } /* pure — unit-tested */
  uiScale(){ /* measured render/local ratio of the zoomed subtree the overlays live in (1 when unzoomed) */
    const el=this._uiRootEl;
    if(!el || !el.offsetWidth) return 1;
    const w=el.getBoundingClientRect().width;
    return w>0 ? w/el.offsetWidth : 1;
  }
  uiPt(x,y){ return this.scaleFixedPt(x,y,this.uiScale()); }
  uiViewport(){ /* viewport size in the overlays' local px, so edge-clamping stays in one unit */
    const k=this.uiScale()||1;
    const w=(typeof window!=='undefined'&&window.innerWidth)||1280, hh=(typeof window!=='undefined'&&window.innerHeight)||800;
    return {w:w/k, h:hh/k};
  }

     hatch, null-ing a date back to a V1.2 ghost. Drag can only ever write a date; only this menu (or
     undo) can take one away. Every row funnels through an existing commit()-based mutator, so each

  openBarMenu(e, task, occIdx){

  /* Whether an edge may be nulled back to a ghost. PURE (reads only the task) → unit-tested.

     renders NO bar at all (see the `if(t.recur) return []` branch in renderVals), so de-committing a
     date would make the task silently vanish from the chart. Drop the repeat first. */
  canClearDate(t,key){
    if(!t) return {ok:false, why:''};
    const what = key==='start' ? 'start' : 'due';
    if(t[key]==null) return {ok:false, why:'The '+what+' is already a ghost'};
    if(t.recur) return {ok:false, why:'A repeating task needs a real '+what+' to expand from — remove the repeat first'};
    return {ok:true, why:'Un-set the '+what+' → the edge goes back to a derived ghost'};

  recurPresetKey(t){

    if(!t.recur) return 'none';

  /* Set/clear the repeat rule from a preset key. Occurrence-indexed state (overrides/shifts, and `until`)
     is meaningful only under the rule that produced it, so a rule CHANGE drops it rather than re-applying
     "occurrence 3 was moved" to a different calendar. Re-picking the active preset keeps everything. */
  setRecur(id, k){
    const p=(this.RECUR_PRESETS||[]).find(x=>x.k===k); if(!p) return;
    const today=this.startOfToday();
    this.commit(tasks=>{ const t=tasks.find(x=>x.id===id); if(!t) return;

      /* A repeat needs a real span to expand from, so committing one onto a ghost also commits the
         ghost's derived dates (the only place in V1.4 where an action de-ghosts implicitly). */
      if(t.start==null || t.end==null){ const g=this.ghostSpan(t, today); t.start=g.start; t.end=g.end; }
      const same = !!t.recur && t.recur.kind===p.recur.kind && (t.recur.n||1)===(p.recur.n||1);
      t.recur=Object.assign({}, p.recur, {until: same ? (t.recur.until||null) : null,
        shifts: same ? (t.recur.shifts||[]) : [], overrides: same ? (t.recur.overrides||{}) : {}});
    });

       instead of being pinned onto "now". pins/type come straight from the shaped result. */

       the word "milestone") — the old `\bmile\b|\bms\b` alternatives here were the other half of the
       corruption class the Track A comment above `result.mile` describes: they survived the detection
       fix and kept eating "run a mile" / "email ms johnson" down to "run a" / "email johnson". */
    let name = p.rest.replace(/◇/g,'').replace(/\bmilestone\b/ig,'').replace(/^\s*\*/,'').replace(/\s+/g,' ').trim() || 'New task';
    const recur = p.recur ? {...p.recur, until:(p.until||null), shifts:[], overrides:{}} : null;

       the parse is unambiguous → keep p's fields (no behaviour change). The 'anchor' tuple is identical
       to Track A's interim default, so only a 'due' pick actually changes what gets committed. */

    this.commit(tasks=>{

        planned:f.planned, predicted:0, description:'', labels:p.labels||[], recur, completion:null,
        startClock:f.startClock, endClock:f.endClock});
      if(where==='top') tasks.unshift(t); else tasks.push(t);

    this.setState({quickText:'', quickChoice:'anchor', selectedIds:this._qaId?[this._qaId]:[]}); /* PP-EXT: reset chooser to the safe default for the next entry (Group 3) */
  }

      this.gcalClearError(); /* PP-EXT: a successful sync clears any stale failure banner */

    if(!gone||!gone.length) return;

    const sel=Object.assign({},this.state.gcal.selected);
    const names=gone.map(cid=>{ goneSet[cid]=1; delete sel[cid];
      const c=calById&&calById[cid]; if(c) goneTags[cid]=this.calTag(c); return c&&c.summary?c.summary:cid; });

      const g=this.state.gcal; if(!g||!g.connected||!this._token) return;

      if(this.loadQueue().length || this._gcalFlushing){ this.gcalFlushQueue(); return; }
      const sec=Math.max(20, parseInt(this.state.settings&&this.state.settings.gcalPollSec)||60);

  /* pure — should we (re-)assert watch channels? True when the selection changed, or we never have,
     or the periodic re-assert is due (cheap idempotent insurance against a channel we lost track of). */
  gcalWatchNeedsSync(prevIds, nextIds, lastAt, now, resyncMs){
    const norm=a=>(a||[]).slice().sort().join('␀');
    if(!(nextIds||[]).length) return false;              /* nothing selected -> nothing to watch */
    if(!lastAt) return true;
    if(norm(prevIds)!==norm(nextIds)) return true;
    return (now-lastAt) >= resyncMs;

     DEGRADED, not broken (the poll still imports), so this never raises the gcalError banner — it records
     a push status line for Settings instead, and clears _gcalWatchAt so the next tick retries. */
  gcalWatchSync(){
    if(!this._sb || !this._session) return;
    const g=this.state.gcal; if(!g || !g.connected) return;
    const ids=Object.keys(g.selected||{}).filter(k=>g.selected[k]);
    if(!this.gcalWatchNeedsSync(this._gcalWatchIds, ids, this._gcalWatchAt, Date.now(), this.GCAL_WATCH_RESYNC_MS)) return;
    this._gcalWatchIds=ids; this._gcalWatchAt=Date.now();
    this._sb.functions.invoke('gcal-watch', {body:{action:'sync', calendarIds:ids, clientId:g.clientId}})
      .then(({data, error})=>{ if(error) throw error;
        const n=(data&&data.watched||[]).length, bad=(data&&data.failed||[]);

        if(bad.length) this._gcalWatchAt=0; })

  }
  /* Description disclosure. `openSet`/`toggle` are injected because the sheet's panel is MEASURED for
     Gantt row alignment (`observeDescPanel` → `_descH` → `yOfRow`) while a card's is not — sharing the
     open-state would let a card's height silently offset the Gantt's rows. Same control, separate state. */
  taskDescToggle(t, open, toggle){
    const h=React.createElement;
    return h('span',{onClick:e=>{e.stopPropagation();toggle();}, onMouseDown:e=>e.stopPropagation(),
      title: open?'Hide description':'Show / edit description',
      style:{cursor:'pointer',marginRight:'6px',fontSize:'13px',lineHeight:1,flex:'none',userSelect:'none',
        color: (open||this.hasDesc(t.description))?this._accent:'var(--text-faint)'}}, '☰');
  }
  /* Card-local description open state — deliberately NOT `state.descOpen` (see taskDescToggle). */
  toggleCardDesc(id){ const d=Object.assign({}, this.state.cardDescOpen||{});
    if(d[id]) delete d[id]; else d[id]=true; this.setState({cardDescOpen:d}); }

  /* One card — a task row in card clothing. `zone` is the drop target it currently sits in, used only to
     skip a no-op write on drop.

     PP-EXT V2.11: this was a read-mostly summary (name, due, planned→allotted, a snooze glyph). It now
     carries the SAME controls as the sheet row, from the same builders, plus the sheet's three gestures:
     click opens details, double-click activates, right-click opens the row menu. The `_suppressCardClick`
     guard is what keeps a real drag from also opening the detail panel. */
  planCard(t, zone){
    const h=React.createElement;
    const cd=this.state.cardDrag;
    const dragging=cd && cd.id===t.id;
    const undecided=this.isUndecided(t);
    const d=this.taskDisp(t);
    const descOpen=!!(this.state.cardDescOpen||{})[t.id];
    const st=this.inclState(t);
    const snoozed=st==='snoozed';
    /* V2.1 pressed/active depth, the same channel the sheet row uses — inclusion is depth, not colour. */
    let bsh=dragging?'none':'var(--sh-1)';
    if(st==='active') bsh='inset 0 0 0 2px '+this._accent+', inset 0 4px 9px rgba(0,0,0,0.22)';
    else if(st==='pressed') bsh='inset 0 3px 7px rgba(0,0,0,0.16)';
    const chip=(el,key)=>el?h('span',{key,style:{display:'inline-flex',alignItems:'center',flex:'none'}},el):null;
    return h('div',{key:t.id,'data-card-id':t.id,'data-task-id':t.id,
      onMouseDown:e=>this.cardPointerDown(e,t.id,zone),
      onClick:e=>{ if(this._suppressCardClick){ this._suppressCardClick=false; return; } this.rowClick(e,t.id); },

        border:(undecided?'1px dashed var(--divider)':'1px solid var(--divider)'),
        color:undecided?'var(--text-mut2)':'var(--text)',

  /* --- card drag: shared by both views, vertical-only by construction (see resolveCardZone) --- */
  cardPointerDown(e,id,zone){ if(e.button!==0) return; e.stopPropagation();
    this._suppressCardClick=false; /* PP-EXT: same one-shot leak as rowPointerDown — a card dropped in a
       different zone never fires click on the origin card, so the flag would eat the next real click. */
    this.cardPending={id,zone,x:e.clientX,y:e.clientY}; }
  beginCardDrag(){
    const p=this.cardPending; if(!p) return;
    this.dragSelectSuppress(); /* PP-EXT V2.9 §1: cards are text too */
    this._cardDrag={id:p.id, fromZone:p.zone, overZone:p.zone, x:p.x, y:p.y};
    this.setState({cardDrag:this._cardDrag, menu:null});
  }
  /* Which drop zone the cursor is over. Reads `data-dropzone` off the DOM rather than recomputing geometry,
     because these grids are ordinary flow layout — there is no _yTop-style model to consult. */
  resolveCardZone(clientX, clientY){
    const el=document.elementFromPoint(clientX, clientY);
    const z=el&&el.closest?el.closest('[data-dropzone]'):null;
    return z?z.getAttribute('data-dropzone'):null;
  }
  /* PP-EXT V2.9 §5: the Selection view — three DERIVED columns (Existing · New · Extra) by two rows

     user-initiated, every drop is written immediately and independently, and leaving half-done is a valid
     end state. That is what keeps it from being the "swipe every task into a bucket" ritual that
     product-vision.md §4 rejected as over-prescribing how people use the app. (The §4/§11 amendment is
     still the owner's to write — see the spec's §7.1.) */
  renderSelectionView(tasks){
    const h=React.createElement;
    const p=this.selectionProjection(tasks);
    const cd=this.state.cardDrag;
    /* An empty Extra COLUMN collapses (same rule as the No-section bucket: a fallback earns its space),
       and so does Overdue — the owner's rule is that it "only pops up when there is stuff overdue", which
       is also what keeps it from becoming a permanent guilt column on a clean week.
       Empty CELLS still render — an empty New cell is informative, it means today brought you nothing. */
    const cols=p.keys.filter(k=>(k!=='extra'&&k!=='overdue')||p.colCount[k]>0);

    const cell=(colKey,row)=>{
      const zone='incl:'+row;
      const active=cd && cd.overZone===zone && cd.overZone!==cd.fromZone;
      return h('div',{key:colKey+'-'+row,'data-dropzone':zone,'data-selcell':colKey+'-'+row,
        style:{flex:1,minHeight:0,overflowY:'auto',display:'flex',flexDirection:'column',gap:'6px',
          padding:'8px',background:active?'var(--menu-hover)':'transparent',

        p.cells[colKey][row].map(t=>this.planCard(t, zone)));

        fontSize:'10px',fontWeight:750,letterSpacing:'0.45px',textTransform:'uppercase',color:'var(--tag-text)'}},
      this.originLabel(k),
      h('span',{key:'n',style:{marginLeft:'6px',fontWeight:600,color:'var(--text-faint2)',letterSpacing:0}},p.colCount[k]),
      h('div',{key:'hint',style:{fontSize:'9px',fontWeight:500,letterSpacing:0,textTransform:'none',
        color:'var(--text-faint)'}},this.originHint(k)));

    const rowBand=(row,label)=>h('div',{key:'row-'+row,
      style:{flex:1,minHeight:0,display:'flex',flexDirection:'column',
        borderTop:row==='excluded'?'2px solid '+this._accent:'none'}},
      h('div',{key:'lbl',style:{padding:'4px 10px',fontSize:'10px',fontWeight:750,letterSpacing:'0.45px',
          textTransform:'uppercase',color:'var(--text)',background:'var(--top-bg)',
          borderBottom:'1px solid var(--top-border)',display:'flex',alignItems:'center',gap:'6px'}},
        label,
        h('span',{key:'n',style:{fontWeight:600,color:'var(--text-faint2)',letterSpacing:0}},p.rowCount[row]),

          fontSize:'9px',color:'var(--text-faint)'}},'dashed = not yet decided'):null),
      h('div',{key:'cells',style:{flex:1,minHeight:0,display:'flex'}},
        cols.map(k=>h('div',{key:k,style:{flex:1,minWidth:0,display:'flex',flexDirection:'column',minHeight:0,
          borderLeft:k===cols[0]?'none':'1px solid var(--divider)'}}, cell(k,row)))));

    return h('div',{style:{flex:1,minWidth:0,minHeight:0,display:'flex',flexDirection:'column',
        background:'var(--sheet-bg)'}},
      h('div',{key:'note',style:{padding:'6px 12px',fontSize:'10.5px',color:'var(--text-faint2)',
        borderBottom:'1px solid var(--top-border)'}},

        +'j/k move · space toggles.'),

  /* PP-EXT V2.9 §5: keyboard pass. `j`/`k` walk a flat, render-order cursor over every card; space toggles
     the row the cursor's card is in. Deliberately the only keyboard verbs — this surface is for sweeping. */
  selectionFlat(){
    const p=this.selectionProjection(this._visTasks||this.state.tasks);
    const out=[];
    ['included','excluded'].forEach(row=>p.keys.forEach(k=>p.cells[k][row].forEach(t=>out.push(t))));
    return out;
  }
  selectionKey(k){
    const flat=this.selectionFlat(); if(!flat.length) return;
    let i=flat.findIndex(t=>t.id===this.state.selCursor);
    if(k==='j'){ i=(i<0)?0:Math.min(flat.length-1,i+1); this.setState({selCursor:flat[i].id, selectedIds:[flat[i].id]}); return; }
    if(k==='k'){ i=(i<0)?0:Math.max(0,i-1); this.setState({selCursor:flat[i].id, selectedIds:[flat[i].id]}); return; }
    if(k===' '){ if(i<0) return; const t=flat[i];
      this.setInclusionRow(t.id, this.inclusionRow(t)==='included'?'excluded':'included'); }
  }

  /* PP-EXT V2.9 §3: the Eisenhower matrix. The header states the asymmetry out loud — urgency is computed
     from your dates, importance is read from the priority you set — because a matrix that appears to guess
     both axes is a matrix nobody trusts, and the honesty is what makes the automation acceptable. */
  renderMatrixView(tasks){
    const h=React.createElement;
    const now=this.startOfToday();
    const proj=this.eisenhowerProjection(tasks, now);
    const cd=this.state.cardDrag;
    const quads=this.EISENHOWER_QUADRANTS();

    const quadBox=q=>{
      const zone='quad:'+(q.important?'important':'unimportant');
      const active=cd && cd.overZone===zone && cd.overZone!==cd.fromZone;
      return h('div',{key:q.k,'data-dropzone':zone,'data-quad':q.k,
        style:{flex:1,minWidth:0,minHeight:0,display:'flex',flexDirection:'column',

        h('div',{key:'h',style:{padding:'6px 9px',borderBottom:'1px solid var(--divider)',
            display:'flex',alignItems:'baseline',gap:'6px'}},
          h('span',{key:'l',style:{fontSize:'10px',fontWeight:750,letterSpacing:'0.45px',
            textTransform:'uppercase',color:'var(--text)'}},q.label),
          h('span',{key:'n',style:{fontSize:'9px',fontWeight:600,color:'var(--text-faint2)'}},proj[q.k].length),
          h('span',{key:'hint',style:{fontSize:'9px',color:'var(--text-faint)',marginLeft:'auto'}},q.hint)),
        h('div',{key:'b',style:{flex:1,minHeight:0,overflowY:'auto',display:'flex',flexDirection:'column',
          gap:'6px',padding:'8px'}}, proj[q.k].map(t=>this.planCard(t, zone))));
    };

    return h('div',{style:{flex:1,minWidth:0,minHeight:0,display:'flex',flexDirection:'column',
        background:'var(--sheet-bg)'}},
      h('div',{key:'note',style:{padding:'6px 12px',fontSize:'10.5px',color:'var(--text-faint2)',
        borderBottom:'1px solid var(--top-border)'}},
        'Partially automated: URGENCY is computed from your dates (overdue, due within '
        +(+((this.state.settings||{}).eisenhowerUrgentDays)||2)+' days, or running today). '
        +'IMPORTANCE is the priority you set — drag a card UP or DOWN to change it. '
        +'Dragging sideways does nothing: the only way to change urgency is to change the dates.'),
      h('div',{key:'r1',style:{flex:1,minHeight:0,display:'flex'}}, quads.filter(q=>q.important).map(quadBox)),
      h('div',{key:'r2',style:{flex:1,minHeight:0,display:'flex'}}, quads.filter(q=>!q.important).map(quadBox)));
  }

  /* Focus tab: full-screen, minimalist, distraction-free. Four columns:
     left = Pomodoro + music dock + rich quick-note (bound to *today's* real journal entry — same pp-journal
     store the Journal page reads/writes, so a note here shows up there and vice-versa); habits = today's habits
     as a bare tap-to-check list; tasks = every plan task as a stripped-down checklist (complete inline, click a
     row to open the full detail window to edit); right = today's schedule timeline alone. */
  renderDashFocus(tasks){

  /* PP-EXT: raw scheduled workload for a single day (any ms in that day) — each active task's full Planned
     budget spread evenly across the days its occurrence spans. Uncompressed (NOT day-capacity-capped like
     computeAllotted), so it reflects true workload distribution: which days are over/under-committed. */
  scheduledLoadOn(B){
    B=this.startOfDay(B); let sum=0;
    (this.state.tasks||[]).forEach(t=>{
      if(t.archivedAt||this.isMilestone(t)) return;
      if(!this.isActiveOn(t, B)) return;
      const span=Math.max(1, Math.round(this.durDays(t))||1);

  statsData(now, days){
    now = now || Date.now(); days = days || 14;
    const today = this.startOfToday();
    const tasks = this.state.tasks || [];
    const byId={}; tasks.forEach(t=>byId[t.id]=t);
    const buckets=[]; const idx={};
    for(let i=days-1;i>=0;i--){ const ms=today-i*this.DAY; const ymd=this.ymdOf(ms); idx[ymd]=buckets.length; buckets.push({ms,ymd,spent:0,completed:0}); }
    const byTag={}; let windowSpent=0;
    const stamp=c=>{ if(c==null) return; const j=idx[this.ymdOf(c)]; if(j!=null) buckets[j].completed++; };
    tasks.forEach(t=>{
      if(this.isMilestone(t)) return;
      const by=t.spentByDay||{}; const tag=(t.labels&&t.labels[0])||'untagged';
      for(const k in by){ const m=+by[k]||0; if(!m) continue; const j=idx[k]; if(j!=null){ buckets[j].spent+=m; windowSpent+=m; byTag[tag]=(byTag[tag]||0)+m; } }
      if(t.recur){ const ov=t.recur.overrides||{}; Object.keys(ov).forEach(oi=>{ if(ov[oi]&&ov[oi].completion) stamp(ov[oi].completion); }); }
      else if((+t.pct||0)>=100) stamp(t.completion);
    });
    /* planned-vs-spent accuracy over completed (non-recurring) tasks completed within the window */
    let planSum=0, spentSum=0, accN=0;
    tasks.forEach(t=>{ if(this.isMilestone(t)||t.recur) return; if((+t.pct||0)<100||!t.completion) return;
      if(idx[this.ymdOf(t.completion)]!=null){ planSum+=(+t.planned||0); spentSum+=this.getSpent(t); accN++; } });
    /* today adherence — allotted plan vs actual recorded */
    const allot=this.computeAllotted(tasks, today); let allotted=0, actual=0;
    tasks.forEach(t=>{ if(this.isMilestone(t)) return; const a=allot[t.id]; if(a&&a.active) allotted+=(+a.allotted||0); actual+=this.getSpentOn(t, today); });
    /* current backlog */
    const live=tasks.filter(t=>!t.archivedAt && !this.isMilestone(t));
    const overdue=live.filter(t=>(+t.pct||0)<100 && this.dueMsOf(t, today)<now).length;
    const unplanned=live.filter(t=>this.matchChip(t,'unplanned',byId)).length;
    const tags=Object.keys(byTag).map(k=>({tag:k,min:byTag[k]})).sort((a,b)=>b.min-a.min);
    return { days, buckets, byTag:tags, windowSpent, completedWin:buckets.reduce((a,b)=>a+b.completed,0),

  /* PP-EXT (V1.4): the bar's own context menu — every bar-encoded field in one place, including the
     null-back-to-ghost rows a drag can't express. Deliberately NOT the row menu (renderMenu): that one
     is about the task as a list item (priority/duplicate/archive/delete) and is multi-select; this one
     is about the SPAN under the cursor. Rows that need free-text entry hand off to the popups V1.3
     already built (renderDatePick / renderPctPop) rather than re-implementing entry here. */
  renderBarMenu(){
    const h=React.createElement; const m=this.state.barMenu; if(!m) return null;
    const t=this.state.tasks.find(x=>x.id===m.id); if(!t) return null;
    const W=252, MAXH=430;
    const vp=this.uiViewport();
    const x=Math.max(8, Math.min(m.x, vp.w-W-8)), y=Math.max(8, Math.min(m.y, vp.h-MAXH-8));

    const row=(content,onClick,extra,title)=>h('div',{onClick,title,style:Object.assign({display:'flex',alignItems:'center',gap:'11px',

      onMouseEnter:e=>{ if(onClick) e.currentTarget.style.background='var(--menu-hover)'; },

    const ic=(g)=>h('span',{style:{width:'18px',display:'inline-flex',justifyContent:'center',color:'var(--text-mut2)',fontSize:'13px'}},g);
    const tail=(s)=>h('span',{style:{marginLeft:'auto',fontSize:'11px',color:'var(--text-faint2)'}},s);
    const divider=h('div',{style:{height:'1px',background:'var(--menu-hover)',margin:'5px 0'}});
    const label=(s,title)=>h('div',{title,style:{padding:'7px 14px 3px',fontSize:'11px',fontWeight:600,color:'var(--text-mut)',letterSpacing:'0.3px'}},s);
    const dis={color:'var(--text-faint2)',cursor:'default'};

    /* --- dates: set (hand off to the picker at the same point) / clear back to a ghost --- */
    const dateRow=(key)=>{
      const what = key==='start' ? 'Start' : 'Due';
      const isGhost = t[key]==null;
      const cur = isGhost ? 'ghost' : this.fmtDT(t.allDay&&key==='end' ? t[key]-1 : t[key], !!t.allDay);
      return row([ic(key==='start'?'▸':'◂'), what+'…', tail(cur)],
        ()=>{ this.closeBarMenu(); this.openDatePickAt(t.id, key, m.cx, m.cy); },

    /* --- repeat: presets only; a parser-made custom rule shows read-only so the menu can't silently flatten it --- */

    const recurRows=(this.RECUR_PRESETS||[]).map(p=>row([ic(active===p.k?'✓':' '), p.label],
      ()=>{ this.setRecur(t.id,p.k); this.closeBarMenu(); },

    if(active===null && t.recur) recurRows.unshift(row([ic('✓'),'Custom: '+(t.recur.label||'repeat')],null,
      {color:'var(--text-strong)'},'Set by text (e.g. "every mon, wed") — pick a preset below to replace it'));

    const menu=h('div',{onMouseDown:e=>e.stopPropagation(), onClick:e=>e.stopPropagation(), onContextMenu:e=>e.preventDefault(),
      style:{position:'fixed',left:x+'px',top:y+'px',width:W+'px',maxHeight:MAXH+'px',overflowY:'auto',
        background:'var(--menu-bg)',border:'1px solid var(--divider)',borderRadius:'10px',
        boxShadow:'0 12px 40px rgba(0,0,0,0.55)',padding:'6px 0',zIndex:2100,fontFamily:'inherit'}},
      label(t.name.length>28?(t.name.slice(0,27)+'…'):t.name, t.name),
      recurring?h('div',{style:{padding:'0 14px 4px',fontSize:'10.5px',color:'var(--text-faint2)'}},'occurrence '+(m.occIdx+1)):null,
      divider,
      label('Dates'), dateRow('start'), dateRow('end'), clearRow('start'), clearRow('end'),

      row([ic('◍'),'% done…',tail(pct+'%')],()=>{ this.closeBarMenu(); this.openPctPop(t.id, m.cx, m.cy); }),
      divider,
      label('Repeat'), ...recurRows,
      divider,
      row([ic('⤢'),'Open details'],()=>{ this.closeBarMenu(); this.openDetail(t.id); }));

    return h('div',{onMouseDown:()=>this.closeBarMenu(), onContextMenu:e=>{e.preventDefault(); this.closeBarMenu();},
      style:{position:'fixed',inset:0,zIndex:2050}}, menu);

  /* /PP-EXT */

  /* ---------- detail modal ---------- */
  renderDetail(){
    const h=React.createElement;

    const subBlock=h('div',{style:{marginTop:'22px',marginLeft:'36px'}},

        onMouseEnter:e=>{e.currentTarget.style.background='var(--menu-hover)';e.currentTarget.style.color='var(--danger-strong)';},

    const sidebar=h('div',{style:{flex:'0 0 300px',background:'var(--side-bg)',borderLeft:'1px solid var(--modal-border)',overflow:'auto'}},

      field('Start',valWithX(t.start,null,'start',t.allDay/* PP-EXT */)),
      field('Due',valWithX(t.end, (!done&&t.end!=null&&t.end<Date.now())?'var(--danger)':'var(--text-2)', 'end', t.allDay/* PP-EXT */)),
      field('Duration',valTxt(Math.round(this.durDays(t))+' days · '+(this._cpm.critical[t.id]?'critical path':(Math.max(0,Math.round((this._slack[t.id]||0)*10)/10))+'d slack')+(this._schedWarn?' · ⚠ dependency cycle':''),
        this._cpm.critical[t.id]?'var(--danger-strong)':(this._schedWarn?'var(--warn)':'var(--text-2)'))),
      h('div',{style:{display:'flex'}},
        field('Planned', durInput('planned'),{flex:1,borderRight:'1px solid var(--field-divider)'}),
        field('Spent',spentField,{flex:1})),
      field(h('span',null,'Allotted (remaining)',this.infoNote('Auto-scheduled time for this task today: its share of the day’s free time (window minus meals, reserved free time and fixed blocks), scaled by remaining Planned work and split across active tasks by priority then due date. Click ∿ auto → ✎ manual to pin a fixed amount off the top (a Predict override) instead of the computed value.')),allotField),
      t.eventId?field('Calendar',valTxt('🗓 linked'+(t.labels&&t.labels.length?(' · @'+t.labels[t.labels.length-1]):''),'var(--text-2)')):null,
      field('Priority',prioRow),
      field('Progress',pctBig),
      field('Completed',valWithX(t.completion,t.completion?'var(--success)':'var(--text-faint2)','completion'),{borderBottom:'none'}));

    const card=h('div',{onClick:e=>e.stopPropagation(),onContextMenu:e=>e.stopPropagation(),
      style:{width:'min(940px,94vw)',height:'min(660px,90vh)',background:'var(--card-bg)',border:'1px solid var(--field-border)',
        borderRadius:'14px',boxShadow:'0 24px 80px rgba(0,0,0,0.6)',display:'flex',flexDirection:'column',overflow:'hidden'}},
      header,
      h('div',{style:{display:'flex',flex:1,minHeight:0}}, main, sidebar));

    return h('div',{onMouseDown:e=>{ if(e.target===e.currentTarget) this.closeDetail(); },
      style:{position:'fixed',inset:0,zIndex:2000,background:'rgba(0,0,0,0.55)',display:'flex',alignItems:'center',justifyContent:'center'}},
      card);
  }
}
</script>
</body>
</html>
