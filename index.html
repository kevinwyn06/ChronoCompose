  }
  /* ==== /PP-EXT V3.1 ==== */

  /* ==== PP-EXT V3.2: guided journal — a curated, EDITABLE prompt set (`pp-journal-prompts`).
     Three rules this block exists to enforce:
     1. Prompts are GUIDANCE, NOT persisted Q&A. Nothing typed against a prompt is stored per prompt —
        the day's single free-text entry (pp-journal) remains the only place a day's writing lives. That
        is why there is no `answers` map anywhere here, and why deleting a prompt can never delete text.
     2. The set is the USER'S. Every default can be re-worded, reordered or deleted, and new ones added.
        Absence of the key means "never configured" → the defaults; a STORED empty list means "I deleted
        them all" and is honoured. Those two states must stay distinguishable, hence loadJournalPrompts
        checks for a null raw value rather than falling back on an empty items array.
     3. LOCAL-ONLY, exactly like `pp-scratch` and `pp-sections`. `KV_TABLES` names real Supabase tables;
        a `journal_prompts` table does not exist, so this store cannot ride the kv funnel without a schema
        migration, and no new synced field was invented for it. It joins the deferred sync batch; until
        then `BACKUP_KEYS` is its only portability.

     savouring work), an obstacle review (implementation-intention framing — name the friction, not the
     failure), one concrete intention for tomorrow, and gratitude. The two DERIVED prompts ('scratch' and
     'aging') are the ones the app can answer for you. ==== */
  DEFAULT_JOURNAL_PROMPTS(){ return [
    { id:'scratch',  kind:'scratch', text:'Review your scratchpad — what did today actually leave in it?' },
    { id:'wins',     kind:'text',    text:'Three things that went well today, and what made each one go well.' },
    { id:'friction', kind:'text',    text:'What got in the way? Was it the plan, or was it the day?' },
    { id:'aging',    kind:'aging',   text:'Still relevant? These have been sitting open with no time on them.' },
    { id:'tomorrow', kind:'text',    text:'One thing that would make tomorrow feel good — when will you start it?' },
    { id:'grateful', kind:'text',    text:'One thing you are grateful for right now.' },
  ]; }

  JOURNAL_PROMPT_KINDS(){ return { text:1, scratch:1, aging:1 }; }

  normalizeJournalPrompts(o){

  }

  deleteJournalPrompt(id){ return this.saveJournalPrompts(this.journalPromptList().filter(p=>p.id!==id)); }

    const t=String(text||'').trim(); if(!t) return this.state.journalPrompts;

  }
  /* dir=-1 up, +1 down. A move off either end is a no-op, so holding the button cannot wrap the list. */
  moveJournalPrompt(id, dir){
    const list=this.journalPromptList().slice(); const i=list.findIndex(p=>p.id===id);
    const j=i+(dir<0?-1:1);

  }
  /* Back to "never configured": remove the key so a later default-set change reaches the user, rather
     than freezing today's defaults into their store. */
  resetJournalPrompts(){
    try{ this.lsRemove('pp-journal-prompts'); }catch(e){}
    const rec={ items:this.DEFAULT_JOURNAL_PROMPTS(), updatedAt:0 };
    this.setState({journalPrompts:rec});
    return rec;
  }

  /* ---- "today's lines" in the running scratchpad ----------------------------------------------
     V3.1 deliberately stores ONE html blob with no day marker, and `tests/scratch.test.js` asserts that
     record stays exactly {html,updatedAt}. So the marker lives OUTSIDE the document, in `pp-prefs` as
     `scratchDayMark:{ymd, blocks}` — a high-water mark, not a partition. Consequences, on purpose:
       · the scratchpad document shape is unchanged, so NO migration is needed and no existing pad can be
         damaged by this feature;
       · a user who clears prefs loses only the highlight for the current day, never a line of text;
       · reading is lazy — if the stored mark is not today's, today's lines are simply empty (nothing has
         been typed today yet), so a legacy pad with no mark highlights NOTHING rather than everything. */
  /* PURE: split the stored html into top-level "lines". contentEditable emits one block per line
     (`<div>`/`<p>`, or a bare `<br>` between text runs), so a depth counter over the tags is enough and
     — unlike a DOM parse — it works under Node, which is where this is tested. Nested markup inside a
     block stays with its block. */
  splitScratchBlocks(html){
    const s=String(html==null?'':html); if(!s) return [];
    const BLOCK={ div:1, p:1, ul:1, ol:1, h1:1, h2:1, h3:1, blockquote:1, pre:1 };
    const out=[]; let buf=''; let depth=0; let last=0; let m;
    /* `hasDesc` is the same emptiness test the rest of the app uses, so a block that is only markup
       (`<div></div>`, `<div><br></div>` — what contentEditable leaves behind) is not a line. */
    const flush=()=>{ if(this.hasDesc(buf)) out.push(buf); buf=''; };
    const re=/<(\/?)([a-zA-Z0-9]+)([^>]*)>/g;
    while((m=re.exec(s))){
      buf+=s.slice(last, m.index); last=re.lastIndex;
      const close=(m[1]==='/'), tag=m[2].toLowerCase();
      if(tag==='br' && !close && depth===0){ flush(); continue; } /* a top-level <br> IS a line break */
      if(BLOCK[tag]){
        if(!close){ if(depth===0) flush(); depth++; buf+=m[0]; continue; }
        depth=Math.max(0, depth-1); buf+=m[0];
        if(depth===0) flush();
        continue;
      }
      buf+=m[0];
    }
    buf+=s.slice(last); flush();
    return out;
  }
  /* PURE-ish: {ymd, blocks} where `blocks` is the index the CURRENT day's lines start at. When the stored
     mark is stale (or absent) the answer is "everything so far is previous days" — computed, not written;
     the write happens on the next real edit (stampScratchDayMark). */
  scratchDayMark(){
    const ymd=this.ymdOf(this.startOfToday());
    const n=this.splitScratchBlocks(this.scratchHtml()).length;
    let m=null; try{ m=this.loadPrefs().scratchDayMark; }catch(e){ m=null; }
    if(m && typeof m==='object' && m.ymd===ymd){
      const b=Math.max(0, Math.min(n, Math.floor(+m.blocks||0)));
      return { ymd:ymd, blocks:b };
    }
    return { ymd:ymd, blocks:n };
  }
  /* Called from saveScratchHtml on the first content-changing write of a new day: freeze the mark at the

     Planned, minus time already spent; a manual Predict override takes a fixed slice off the top.

     columns (B ≠ today) allot with spent = 0 ("just simply schedule"). Multi-day timeline views compute a
     per-column map; renderVals caches today's map in _allot for the sheet's Predict column.
     Returns { [id]: {allotted, computed, active} }. `computed` = the auto value (for the override toggle). */

     deliberately retain the full normalized task shape so a future learned implementation can use priority,

      else zeroCount++;

    const afterManual=Math.max(0, Math.max(0,availableMinutes||0)-fixedSum);
    const zeroEach=zeroCount?Math.min(this.DEFAULT_TASK_MINUTES, afterManual/zeroCount):0;
    const pool=Math.max(0, afterManual-zeroEach*zeroCount);

        computed=Math.max(0,share-spent);

      const allotted=f.predictManual?Math.max(0,f.predicted):computed;
      out[f.id]={allotted:allotted,computed:Math.round(computed)};
      if(!f.predictManual) flexRows.push({id:f.id, v:allotted});
      else out[f.id].allotted=Math.round(allotted);

    /* PP-EXT (28a): whole-minute apportionment, NOT independent rounding.
       `Math.round` per row is what let the sheet charge a minute the day cannot draw: the packer fills
       the UNROUNDED pool, so with n flexible tasks Σ round(share) could overshoot it by up to n/2 and
       the last task placed was drawn a minute short of the number printed beside its name — silently,
       with no Unscheduled entry. Largest-remainder (Hamilton) apportionment instead: every row gets
       floor(share), then the leftover whole minutes go to the largest fractional parts, so
       Σ allotted = floor(Σ share) ≤ pool by construction and no row moves by a whole minute.
       Deterministic — ties break on the row's original position, so two calls on the same input agree.
       Manual Predicts are excluded: a manual figure is a promise the user typed, not a share to shave. */
    const total=flexRows.reduce((a,r)=>a+r.v,0);
    const base=flexRows.map(r=>Math.floor(r.v));

      .sort((a,b)=> b.frac-a.frac || a.i-b.i)

        and cleared `_sync` — all synchronously. But assigning scrollTop does not fire `scroll`
        synchronously; the browser dispatches it later, before the next paint. So the guard was always

        reciprocal event. That is harmless only while both panes agree on the value, which is defect 2.

  onWheelZoom(e){

       event did its own setState → on a trackpad burst that's ~8 re-renders/gesture, each repositioning every
       bar → jitter; (b) the content grows on the async re-render, so scrollLeft has to be re-pinned after it
       lands. Fix: COALESCE — accumulate the target dayW/scrollLeft here, and let ONE requestAnimationFrame
       loop do a single setState + scroll-pin per frame (paint-synced, so no tearing). The cursor anchor
       (scrollLeft + offset + dayW) is captured ONCE per burst so nothing chains off a not-yet-applied
       scrollLeft. A setTimeout backstop guarantees the final landing even in a background tab (rAF paused). */
    const r=el.getBoundingClientRect();

       report RENDERED px while scrollLeft / dayW / scrollWidth are all in the element's LOCAL px. Convert the
       cursor offset back into local px by the element's own measured scale (rect.width / offsetWidth) — else the
       anchor point lands ~0.8× short and the zoom pivots to the LEFT of the cursor. Measured, not hardcoded, so
       it survives any future zoom value. */
    const uiScale = (r.width>0 && el.offsetWidth>0) ? (r.width/el.offsetWidth) : 1;

       ABSOLUTE scrollLeft for the current width — nothing chains off a not-yet-applied scrollLeft (that caused

    this._zoomPinEl=el;

  gcalWatchNeedsSync(prevIds, nextIds, lastAt, now, resyncMs){

    const cd=this.state.cardDrag;
    const dragging=cd && cd.id===t.id;
    const undecided=this.isUndecided(t);
    const d=this.taskDisp(t);

    const st=this.inclState(t);
    const snoozed=st==='snoozed';
    /* PP-EXT (owner 2026-08-12): the PRESSED depth is gone here too — the card and the sheet row share

       back out of step.
       PP-EXT (owner 2026-08-13): ACTIVE depth is now gone as well, on both surfaces, for the same reason
       the pressed depth went — the state is already said explicitly elsewhere. Owner: "when a task has its
       timer running, do not highlight that task, just let the pause/play indicator do the work." The ■/▶
       control (taskTimerBtn) reads the same `isRunning`, is per-row, and is the thing you click; the ring
       plus wash was a second, louder rendering of it that fought the striping and the selection ring.
       `inclState` still returns 'active' — the bucket is load-bearing for the popover copy and for
       scheduling — it simply no longer paints. */
    let bsh=dragging?'none':'var(--sh-1)';
    const chip=(el,key)=>el?h('span',{key,style:{display:'inline-flex',alignItems:'center',flex:'none'}},el):null;
    return h('div',{key:t.id,'data-card-id':t.id,'data-task-id':t.id,
      onMouseDown:e=>this.cardPointerDown(e,t.id,zone),
      onClick:e=>{ if(this._suppressCardClick){ this._suppressCardClick=false; return; } this.rowClick(e,t.id); },
      onDoubleClick:e=>this.rowDblClick(e,t.id),

        background:'var(--card-bg)',cursor:'grab',opacity:dragging?0.4:(t.archivedAt?0.5:1),
        /* PP-EXT V2.9 §4.2, still load-bearing after V2.11 retired Off: undecided ("I haven't looked at
           this") must not read as a decision. With Off gone the Excluded row is entirely undecided or
           snoozed, so the dashed edge now distinguishes "not chosen" from "snoozed until a date". */
        border:(undecided?'1px dashed var(--divider)':'1px solid var(--divider)'),
        color:undecided?'var(--text-mut2)':'var(--text)',
        boxShadow:bsh,fontSize:'12px',minWidth:0}},

        this.taskDoneCircle(t,d),

        h('span',{key:'nm',style:{fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',flex:1,minWidth:0}},
          t.name||'Untitled'),
        this.taskInclControl(t)),

        chip(this.taskDueRecurChip(t,d),'due'),

           header because rescheduling is a per-task decision — a "reschedule everything" button is exactly
           the kind of one-click bulk date rewrite the Matrix drag rules already refuse. */
        this.isOverdueToday(t) ? h('span',{key:'resched',title:'Move the due date to today and press it in',
          onMouseDown:e=>e.stopPropagation(),

          style:{display:'inline-flex',alignItems:'center',height:'18px',padding:'0 6px',flex:'none',cursor:'pointer',
            fontSize:'9.5px',fontWeight:700,borderRadius:'var(--r-1)',color:'var(--on-accent)',

      h('div',{key:'a',style:{display:'flex',alignItems:'center',gap:'5px',minWidth:0}},
        h('span',{key:'z',title:snoozed?'Snoozed — click to press back into today':'Snooze until tomorrow',
          onMouseDown:e=>e.stopPropagation(),
          onClick:e=>{e.stopPropagation(); snoozed?this.setIncludedOn(t.id):this.snoozeToday(t.id);},

  /* --- card drag: shared by both views, vertical-only by construction (see resolveCardZone) --- */
  cardPointerDown(e,id,zone){ if(e.button!==0) return; e.stopPropagation();
    this._suppressCardClick=false; /* PP-EXT: same one-shot leak as rowPointerDown — a card dropped in a
       different zone never fires click on the origin card, so the flag would eat the next real click. */
    this.cardPending={id,zone,x:e.clientX,y:e.clientY}; }
  beginCardDrag(){
    const p=this.cardPending; if(!p) return;
    this.dragSelectSuppress(); /* PP-EXT V2.9 §1: cards are text too */
    this._cardDrag={id:p.id, fromZone:p.zone, overZone:p.zone, x:p.x, y:p.y};
    this.setState({cardDrag:this._cardDrag, menu:null});
  }
  /* Which drop zone the cursor is over. Reads `data-dropzone` off the DOM rather than recomputing geometry,
     because these grids are ordinary flow layout — there is no _yTop-style model to consult. */
  resolveCardZone(clientX, clientY){
    const el=document.elementFromPoint(clientX, clientY);
    const z=el&&el.closest?el.closest('[data-dropzone]'):null;
    return z?z.getAttribute('data-dropzone'):null;
  }
  /* PP-EXT V2.9 §5: the Selection view — three DERIVED columns (Existing · New · Extra) by two rows
     (Included / Excluded).

     This is NOT a gate. No modal, no landing interception, no completion state, no nag: entry is always
     user-initiated, every drop is written immediately and independently, and leaving half-done is a valid
     end state. That is what keeps it from being the "swipe every task into a bucket" ritual that
     product-vision.md §4 rejected as over-prescribing how people use the app. (The §4/§11 amendment is
     still the owner's to write — see the spec's §7.1.) */
  renderSelectionView(tasks){
    const h=React.createElement;
    const p=this.selectionProjection(tasks);
    const cd=this.state.cardDrag;
    /* An empty Extra COLUMN collapses (same rule as the No-section bucket: a fallback earns its space),
       and so does Overdue — the owner's rule is that it "only pops up when there is stuff overdue", which
       is also what keeps it from becoming a permanent guilt column on a clean week.
       Empty CELLS still render — an empty New cell is informative, it means today brought you nothing. */
    const cols=this.selectionCols(p);

    const cell=(colKey,row)=>{
      const zone='incl:'+row;
      const active=cd && cd.overZone===zone && cd.overZone!==cd.fromZone;
      return h('div',{key:colKey+'-'+row,'data-dropzone':zone,'data-selcell':colKey+'-'+row,
        style:{flex:1,minHeight:0,overflowY:'auto',display:'flex',flexDirection:'column',gap:'6px',
          padding:'8px',background:active?'var(--menu-hover)':'transparent',
          borderRadius:'var(--r-2)',transition:'background var(--dur-fast) var(--ease-standard)'}},
        p.cells[colKey][row].map(t=>this.planCard(t, zone)));
    };
    const colHead=k=>h('div',{key:'h-'+k,style:{flex:'none',minWidth:0,padding:'6px 8px',
        fontSize:'10px',fontWeight:750,letterSpacing:'0.45px',textTransform:'uppercase',color:'var(--tag-text)',
        borderBottom:'1px solid var(--top-border)'}},
      this.originLabel(k),
      h('span',{key:'n',style:{marginLeft:'6px',fontWeight:600,color:'var(--text-faint2)',letterSpacing:0}},p.colCount[k]),
      h('div',{key:'hint',style:{fontSize:'9px',fontWeight:500,letterSpacing:0,textTransform:'none',
        color:'var(--text-faint)'}},this.originHint(k)));

    /* PP-EXT V5 (24a, F16): ONE HALF OF ONE COLUMN. The layout is now column-major, which is what makes
       the owner's "each column has its own divider" possible at all: with the old row-major bands there
       was a single divider straight across the surface and a single split ratio shared by every column,
       so a busy Existing column and an empty Extra column were forced to the same geometry.

       The flex triple comes from `selectionHalfFlex` — see the note there for why basis-and-inverse-shrink
       is what equalises max scroll. Nothing here measures the DOM, so the surface is stable across a
       re-render and across a window resize. */
    const half=(k,row,label)=>{
      const list=p.cells[k][row], f=this.selectionHalfFlex(list.length);
      /* PP-EXT (owner 2026-08-13): `minHeight:0` here was the whole bug. Owner: "there are instances where
         I'll have 12 included tasks in a column and I won't be able to even see the excluded tasks at all."

         `selectionSplitHeights` applies a SEL_HALF_MIN_PX floor and is unit-tested, so the arithmetic
         looked right and the tests stayed green — but that function is only a JS MIRROR of the layout. The
         thing that actually renders is this flexbox, and it carried no floor at all. Worse, the explicit
         `minHeight:0` disabled flexbox's own automatic min-content floor, which would otherwise have
         saved it. So the equal-absolute-shrink rule ran unchecked: 12 included against 0-3 excluded
         produces a deficit larger than the Excluded half's entire basis, and it shrank to literally 0px.

         Equal max scroll is unachievable at that ratio in any case — a half holding 3 cards cannot absorb
         a 600px deficit — so the floor is not a rounding detail, it is the rule that decides what happens
         once "equal scroll" runs out. Visibility wins: SEL_HALF_MIN_PX is now a whole card plus its band
         label, and `min(px, 45%)` mirrors selectionSplitHeights' `Math.min(MIN, H*0.45)` so the two halves
         plus the column header can never total more than the column. */
      return h('div',{key:'half-'+row,'data-selhalf':k+'-'+row,
        /* A PLAIN px floor, deliberately. The first attempt used `min(112px, 45%)` to stop two floors
           plus the header overflowing a very short column — and measured in Chromium it applied NO floor
           at all: the percentage resolves against the parent's height, the parent is a flex child with
           `minHeight:0` and therefore an indefinite height, so the percentage drops out and takes the
           whole `min()` with it. It looked more careful and did strictly less. The column now clips
           (`overflow:hidden` on it) if it is ever too short for two floors, which is the same thing the
           browser would do and is honest about — and `selectionSplitHeights` models exactly that. */
        style:{display:'flex',flexDirection:'column',minHeight:this.SEL_HALF_MIN_PX+'px',
          flexGrow:f.grow, flexShrink:f.shrink, flexBasis:f.basis+'px',
          /* the per-column divider */
          borderTop:row==='excluded'?'2px solid '+this._accent:'none'}},
        h('div',{key:'lbl',style:{flex:'none',padding:'3px 8px',fontSize:'9px',fontWeight:750,
            letterSpacing:'0.4px',textTransform:'uppercase',color:'var(--text)',background:'var(--top-bg)',
            borderBottom:'1px solid var(--top-border)',display:'flex',alignItems:'center',gap:'5px'}},
          label,
          h('span',{key:'n',style:{fontWeight:600,color:'var(--text-faint2)',letterSpacing:0}},list.length)),
        cell(k,row));
    };

    return h('div',{style:{flex:1,minWidth:0,minHeight:0,display:'flex',flexDirection:'column',
        background:'var(--sheet-bg)'}},
      h('div',{key:'note',style:{padding:'6px 12px',fontSize:'10.5px',color:'var(--text-faint2)',
        borderBottom:'1px solid var(--top-border)'}},
        /* Say what the columns are, because a column you cannot change is confusing until you know why. */
        'Columns are derived from your calendar — drag a card UP or DOWN to include or exclude it. '
        +'j/k move · space toggles. A dashed edge means not yet decided.'),
      h('div',{key:'grid',style:{flex:1,minHeight:0,display:'flex'}},
        /* PP-EXT (owner 2026-08-13): `overflow:hidden` is the other half of the plain-px floor on the two
           halves — it is what makes a column too short for two floors CLIP rather than push the surface
           past the viewport. See the note in `half`. */
        cols.map(k=>h('div',{key:k,style:{flex:1,minWidth:0,minHeight:0,overflow:'hidden',display:'flex',flexDirection:'column',
            borderLeft:k===cols[0]?'none':'1px solid var(--divider)'}},
          colHead(k),
          half(k,'included','Included'),
          half(k,'excluded','Excluded')))));
  }
  /* PP-EXT V2.9 §5: keyboard pass. `j`/`k` walk a flat, render-order cursor over every card; space toggles
     the row the cursor's card is in. Deliberately the only keyboard verbs — this surface is for sweeping. */
  selectionFlat(){
    const p=this.selectionProjection(this._visTasks||this.state.tasks);
    const out=[];
    ['included','excluded'].forEach(row=>p.keys.forEach(k=>p.cells[k][row].forEach(t=>out.push(t))));
    return out;
  }
  selectionKey(k){
    const flat=this.selectionFlat(); if(!flat.length) return;
    let i=flat.findIndex(t=>t.id===this.state.selCursor);
    if(k==='j'){ i=(i<0)?0:Math.min(flat.length-1,i+1); this.setState({selCursor:flat[i].id, selectedIds:[flat[i].id]}); return; }
    if(k==='k'){ i=(i<0)?0:Math.max(0,i-1); this.setState({selCursor:flat[i].id, selectedIds:[flat[i].id]}); return; }
    if(k===' '){ if(i<0) return; const t=flat[i];
      this.setInclusionRow(t.id, this.inclusionRow(t)==='included'?'excluded':'included'); }
  }

  renderMatrixView(tasks){

          background:'var(--sheet-bg)',border:'1px solid var(--divider)',
          transition:'background var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard)'}},

  /* PP-EXT (18): `scheduledLoadOn` was REMOVED here. It summed each active task's Planned budget DIVIDED
     by the number of days its occurrence spans, i.e. spread-across-the-window semantics — while
     computeAllotted grants the full per-day figure on every day a window covers, i.e. it effectively
     MULTIPLIES by the same span. The two answered the same question ("how much work is on day B") 7x
     apart on a 7-day task. The app keeps PER-DAY semantics, so this was the wrong model surviving in one
     corner, not a bug to patch. Deliberately NOT replaced with a per-day equivalent: a capacity /
     over-subscription readout is a separate piece of work to be designed against per-day semantics. */
  statsData(now, days){
    now = now || Date.now(); days = days || 14;
    const today = this.startOfToday();
    const tasks = this.state.tasks || [];
    const byId={}; tasks.forEach(t=>byId[t.id]=t);
    const buckets=[]; const idx={};
    for(let i=days-1;i>=0;i--){ const ms=today-i*this.DAY; const ymd=this.ymdOf(ms); idx[ymd]=buckets.length; buckets.push({ms,ymd,spent:0,completed:0}); }
    const byTag={}; let windowSpent=0;
    const stamp=c=>{ if(c==null) return; const j=idx[this.ymdOf(c)]; if(j!=null) buckets[j].completed++; };
    tasks.forEach(t=>{
      if(this.isMilestone(t)) return;
      const by=t.spentByDay||{}; const tag=(t.labels&&t.labels[0])||'untagged';
      for(const k in by){ const m=+by[k]||0; if(!m) continue; const j=idx[k]; if(j!=null){ buckets[j].spent+=m; windowSpent+=m; byTag[tag]=(byTag[tag]||0)+m; } }
      if(t.recur){ const ov=t.recur.overrides||{}; Object.keys(ov).forEach(oi=>{ if(ov[oi]&&ov[oi].completion) stamp(ov[oi].completion); }); }
      else if((+t.pct||0)>=100) stamp(t.completion);
    });
    /* planned-vs-spent accuracy over completed (non-recurring) tasks completed within the window */
    let planSum=0, spentSum=0, accN=0;
    tasks.forEach(t=>{ if(this.isMilestone(t)||t.recur) return; if((+t.pct||0)<100||!t.completion) return;
      if(idx[this.ymdOf(t.completion)]!=null){ planSum+=(+t.planned||0); spentSum+=this.getSpent(t); accN++; } });
    /* today adherence — allotted plan vs actual recorded */
    const allot=this.computeAllotted(tasks, today); let allotted=0, actual=0;

    /* current backlog */
    const live=tasks.filter(t=>!t.archivedAt && !this.isMilestone(t));
    const overdue=live.filter(t=>(+t.pct||0)<100 && this.dueMsOf(t, today)<now).length;
    const unplanned=live.filter(t=>this.matchChip(t,'unplanned',byId)).length;
    const tags=Object.keys(byTag).map(k=>({tag:k,min:byTag[k]})).sort((a,b)=>b.min-a.min);
    return { days, buckets, byTag:tags, windowSpent, completedWin:buckets.reduce((a,b)=>a+b.completed,0),
      overdue, unplanned, accuracy:{planSum,spentSum,n:accN}, adherence:{allotted,actual} };

      h('div',{style:{fontSize:'13px',color:'var(--text)',textDecoration:'none'/* PP-EXT: completion changes only dates + gantt, not the name */,

    /* PP-EXT V2.11: inclusion / planned→allotted / timer / add-time all come from the shared builders,

    const inclCell=this.taskInclControl(t);

    const grip=h('div',{onMouseDown:e=>this.rowPointerDown(e,t.id,i),onClick:e=>e.stopPropagation(),title:'Drag to reorder row',
      style:{cursor:'grab',color:'var(--text-faint)',fontSize:'12px',lineHeight:1,width:'12px',textAlign:'center',userSelect:'none',opacity:hov?0.8:0.18,flex:'none'}},'⠿');

    const content={
      check:h('div',{style:{display:'flex',alignItems:'center',gap:'3px'}},grip,circle),
      name:nameBlock, planned:flowCell, actions:actionsCell,
    };
    const extras={name:{paddingRight:'6px'}};
    const rd=this.state.rowDrag;
    /* PP-EXT (owner 2026-08-12): the PRESSED depth is gone. Owner: "get rid of the pressed-in effect —
       it's the same thing as the inclusion check, but is super annoying to work with."
       V2.1 made inclusion a depth channel, and V2.9 §2 later stripped every other ambient encoding and
       left this as "the only visual the inclusion model has". That reasoning does not survive contact
       with a real workspace: most rows are included, so an inset shadow meant to mark a state became the
       background texture of the whole sheet, and it was drawn on top of the row striping and the hover
       and selection washes it had to share the surface with. The state is not lost — `taskInclControl`
       renders it as an explicit ☑/☐ glyph per row, which is what the owner means by "the same thing".
       PP-EXT (owner 2026-08-13): ACTIVE depth is gone too. The 2026-08-12 note argued it "does NOT
       duplicate meaningfully" because the inclusion checkbox does not say "running". That was the wrong
       comparison: the row's OWN ■/▶ timer control says exactly that, on the same row, and it is the

    let bsh = crit?'inset 3px 0 0 var(--danger)':(sel?'inset 2px 0 0 '+(this._accent||'#3b82f6'):''); /* PP-EXT (B2): unify sel indicator on this._accent */

    if(this._glowIds && this._glowIds.has(t.id)) bsh = (bsh?bsh+',':'')+'inset 0 0 0 9999px rgba(245,181,54,0.16)';

    if(deco.glow) bsh = (bsh?bsh:'')+deco.glow;
    /* PP-EXT: inline description panel — an in-flow block below the row's cells spanning the sheet (non-Gantt)

    const descPanel = descOpen ? h('div',{onMouseDown:e=>e.stopPropagation(), onClick:e=>e.stopPropagation(), onContextMenu:e=>e.stopPropagation(),
      ref:el=>{ if(!el) return; this._descEls=this._descEls||{}; const prev=this._descEls[t.id]; if(prev===el) return;
        if(prev&&prev._descRo){ prev._descRo.disconnect(); prev._descRo=null; } this._descEls[t.id]=el; this.observeDescPanel(t.id,el); },
      style:{width:totalW+'px',cursor:'default',
        /* PP-EXT: row separator lives on the measured panel (bottom) so the Gantt, which adds descExtra=offsetHeight,

  /* ---------- gantt ---------- */
  renderGantt(tasks){

    /* PP-EXT V2.3: section rails consume identical vertical space on both panes. `_yTop` remains indexed by
       the flattened task list, so bars/arrows/dependency drops continue to target tasks rather than headers. */
    /* Same caching rule as the sheet — see renderSheet: re-projecting the already-flattened _visTasks
       would drop collapsed sections' counts and desynchronise the two panes. */
    const sections=(tasks===this._visTasks && this._visSections) ? this._visSections : this.sectionProjection(tasks);
    const g=this.sectionGeometry(sections);
    const sectionBands=g.secLayout.map((b,si)=>({id:b.id,top:b.top,key:'gsec-'+(b.id||'nosection')+'-'+si}));
    this._yTop=g.yTop; this._secLayout=g.secLayout; const bodyH=g.bodyH;

    for(let d=vd0; d<vd1; d++){

      const dow=date.getDay(); const weekend=(dow===0||dow===6);
      /* PP-EXT (C2): when zoomed to the hour, pin the date to the top of the cell so the bottom row is free for
         hour ticks; otherwise keep it centered as before. */
      dayCells.push(h('div',{key:d,style:{position:'absolute',left:(d*dayW)+'px',width:dayW+'px',boxSizing:'border-box',height:'24px',display:'flex',alignItems:hourZoom?'flex-start':'center',justifyContent:'center',paddingTop:hourZoom?'1px':'0',
        fontSize:'10px',color:weekend?'var(--text-faint)':'var(--text-mut2)',borderRight:'1px solid var(--col-border)',
        background:weekend?'var(--weekend)':'transparent'}}, date.getDate()));

        hourTicks.push(h('div',{key:'ht'+d+'_'+hr,style:{position:'absolute',left:(d*dayW+hr/24*dayW)+'px',bottom:'0',
          fontSize:'8px',color:'var(--text-faint)',transform:'translateX(1px)',pointerEvents:'none',whiteSpace:'nowrap'}}, hlbl(hr))); } }
      if(((date.getDay()+6)%7)===0 || d===vd0){
        const remaining=tl.days-d; const span=Math.min(7-((date.getDay()+6)%7),remaining);
        const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][date.getMonth()];
        weekCells.push(h('div',{key:'w'+d,style:{position:'absolute',left:(d*dayW)+'px',width:(span*dayW)+'px',boxSizing:'border-box',height:'24px',display:'flex',alignItems:'center',
          padding:'0 8px',fontSize:'10.5px',fontWeight:600,color:'var(--text-2)',borderRight:'1px solid var(--top-border)',
          whiteSpace:'nowrap',overflow:'hidden'}}, date.getDate()+' '+mo));

      onClick:e=>{ const r=e.currentTarget.getBoundingClientRect(); const day=Math.floor((e.clientX-r.left)/dayW); this.addMilestoneAt(tl.start+day*this.DAY+12*3600000); },
      /* PP-EXT: NO borderBottom here — this outer div is auto-height (two 24px tiers = 48), so a 1px border would
         add outside → a 49px header that offsets every Gantt row 1px below the sheet's 48px header. The border
         lives on the day tier (fixed 24px → border-box absorbs it), keeping the header exactly headH like the sheet. */
      style:{position:'sticky',top:0,zIndex:6,background:'var(--top-bg)',minWidth:totalW+'px',cursor:'copy'}},
      /* PP-EXT: relative rows host the absolutely-positioned (windowed) header cells */
      h('div',{style:{position:'relative',height:'24px',minWidth:totalW+'px'}},weekCells),
      h('div',{style:{position:'relative',height:'24px',borderTop:'1px solid var(--col-border)',borderBottom:'1px solid var(--top-border)',minWidth:totalW+'px'}}/* PP-EXT: header bottom border here (fixed height absorbs it) so total header = headH, aligned with the sheet */,dayCells,hourTicks/* PP-EXT (C2) */));
      /* /PP-EXT */

    const gridLines=[];
    for(let d=vd0; d<=Math.min(tl.days,vd1); d++){
      const ms=tl.start+d*this.DAY; const dow=new Date(ms).getDay();
      const strong=((new Date(ms).getDay()+6)%7)===0;

        background:strong?'var(--grid-strong)':'var(--grid-weak)'}}));
      /* PP-EXT (C2): hour gridlines within each day when zoomed in — 6/12/18 a touch stronger for orientation.
         Windowed (only visible days) and skipped entirely below the hour-zoom threshold, so no extra render cost
         at normal zoom. Purely decorative (pointer-events default none via being behind bars at low z). */
      if(hourZoom && d<tl.days){ for(let hr=1; hr<24; hr++){
        gridLines.push(h('div',{key:'gh'+d+'_'+hr,style:{position:'absolute',top:0,bottom:0,left:(d*dayW+hr/24*dayW)+'px',width:'1px',
          background:'var(--grid-weak)',opacity:(hr%6===0)?0.7:0.35/* 6/12/18 a touch stronger */}})); } }
    }
    // weekend shading  /* PP-EXT: windowed to [vd0,vd1] */
    const weekendRects=[];
    for(let d=vd0; d<Math.min(tl.days,vd1); d++){
      const dow=new Date(tl.start+d*this.DAY).getDay();
      if(dow===0||dow===6) weekendRects.push(h('div',{key:'we'+d,style:{position:'absolute',top:0,bottom:0,left:(d*dayW)+'px',width:dayW+'px',background:'var(--weekend-col)'}}));
    }
    // today line
    const now=Date.now();
    const todayX=this.xOf(now);
    const todayLine = (now>=tl.start && now<=tl.start+tl.days*this.DAY)
      ? h('div',{style:{position:'absolute',top:0,bottom:0,left:todayX+'px',width:'2px',background:this._accent,opacity:0.8,zIndex:4}},
          h('div',{style:{position:'absolute',top:'-2px',left:'-4px',width:'10px',height:'10px',borderRadius:'50%',background:this._accent}}))
      : null;

    const bars=[];

      }
      occs.forEach(o=>{ if(o.end>=wx0 && o.start<=wx1) bars.push(this.ganttBlock(t,i,o)); });
    });
    // arrows
    const arrows=this.renderArrows(tasks,totalW,bodyH);

    const body=h('div',{ref:el=>this.bodyEl=el, style:{position:'relative',minWidth:totalW+'px',height:bodyH+'px'}},
      ...weekendRects, ...gridLines,
      ...sectionBands.map((sec,si)=>h('div',{key:sec.key,'data-section-id':sec.id||'',
        style:{position:'absolute',left:0,right:0,top:sec.top+'px',height:this.TAG_SECTION_H+'px',zIndex:2,pointerEvents:'none',
          background:'color-mix(in srgb, var(--top-bg) 88%, transparent)',borderTop:si?'1px solid var(--top-border)':'none',
          borderBottom:'1px solid var(--top-border)',boxShadow:'inset 0 -1px 0 color-mix(in srgb, var(--tag-border) 55%, transparent)'}})),
      // row hover stripes
      ...tasks.map((t,i)=>{ const crit=this._showCP&&this._cpm.critical[t.id]; const sel=this.isSel(t.id); const hov=this.state.hoverId===t.id;
        return h('div',{key:'r'+t.id,'data-gantt-task-id':t.id,onMouseEnter:()=>this.setState({hoverId:t.id}),onMouseLeave:()=>this.setState({hoverId:null}),
          onClick:e=>this.rowClick(e,t.id), onDoubleClick:e=>this.rowDblClick(e,t.id), onContextMenu:e=>this.rowMenu(e,t.id),
          /* PP-EXT: stripe spans the FULL expanded row (rowH + its desc panel), so opening a description grows
             the expanded task's own Gantt row — hover/selection/border cover the whole thing — instead of the
             blank space reading as the following row. The bar itself stays centered in the top rowH (see ganttBlock). */
          style:{position:'absolute',left:0,right:0,top:this.yOfRow(i)+'px',height:(this.rowH+this.descExtra(t))+'px',
            /* PP-EXT V2.9 §2: ambient hatch/tint stripped — both branches are now the same expression. */
            background:(sel?'var(--sel-gantt)':(hov?'var(--hover-gantt)':'transparent')),

            boxShadow: (this._glowIds&&this._glowIds.has(t.id)?'inset 0 0 0 9999px rgba(245,181,54,0.16)':(crit?'inset 3px 0 0 rgba(229,72,77,0.5)':'none'))}}); }), /* PP-EXT: month-view day glow */

    /* PP-EXT (owner 2026-08-12): the Gantt's counterpart to the sheet's trailing "+ Add task" row.

       exactly the same height. Without it the sheet is `rowH` taller, so near the bottom of a long list
       the sheet reaches a scrollTop the Gantt cannot, the sync write clamps, and the panes settle at
       different offsets — which is half of the "not fully synced" report (the other half is the echo
       guard in scrollSyncFrom). Height is read from the same `this.rowH` the add-row uses, so a row-mode

  }

  /* PP-EXT: repeat is "too dense" when the on-screen spacing between consecutive occurrence starts falls
     below a comfortable click target — below that, individual blocks are illegible/unclickable and there are
     so many they bog down rendering, so we draw a single summary strip instead. */
  recurTooDense(occs,dayW){

  }
  /* PP-EXT: one hatched bar standing in for a whole dense recurrence — spans first→last occurrence, labeled
     with the repeat rule and count. Selecting/opening acts on the master task; right-click opens the delete
     scope chooser (same as an individual occurrence). Cheap: a single element regardless of occurrence count. */
  ganttRecurStrip(t,rowI,occs){
    const h=React.createElement;
    const a=occs[0].start, b=occs[occs.length-1].end;
    const left=this.xOf(a), w=Math.max(10,this.xOf(b)-left);
    const top=this.yOfRow(rowI)+(this.rowH-this.barH)/2;
    const crit=this._showCP && this._cpm.critical[t.id];
    const sel=this.isSel(t.id);
    const base=crit?'var(--danger)':(this._accent||'#3f7bd6');
    const hatch='repeating-linear-gradient(-45deg,'+base+' 0 2px,transparent 2px 8px)';
    const lbl=(t.recur&&t.recur.label)||'Repeats';
    return h('div',{key:'rs'+t.id,
      /* PP-EXT (V1.5 fix): own the row hover — see the note on hov in ganttBlock. */

      onMouseDown:e=>{e.stopPropagation(); this.setState({selectedIds:[t.id]});},
      /* PP-EXT (owner 2026-08-04): single click opens details on the Gantt; double-click no longer does.
         This strip has no drag machinery of its own, so it takes onClick directly rather than the
         no-drag branch in the bar mouseup. */

            style:{fontSize:'13px',color:col||'var(--text-2)',fontVariantNumeric:'tabular-nums',cursor:'pointer',
              flex:1,padding:'2px 5px',margin:'-2px -5px',borderRadius:'5px'},
            onMouseEnter:e=>e.currentTarget.style.background='var(--menu-hover)',
            onMouseLeave:e=>e.currentTarget.style.background='transparent'}, txt)
        : h('div',{style:{fontSize:'13px',color:col||'var(--text-2)',fontVariantNumeric:'tabular-nums'}}, txt),
      ms!=null?h('div',{onClick:()=>this.clearDate(t.id,key),title:'Clear date',
        style:{width:'20px',height:'20px',borderRadius:'5px',display:'flex',alignItems:'center',justifyContent:'center',
          cursor:'pointer',color:'var(--text-faint2)',fontSize:'14px',flex:'none'},
        onMouseEnter:e=>{e.currentTarget.style.background='var(--menu-hover)';e.currentTarget.style.color='var(--danger-strong)';},
        onMouseLeave:e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.color='var(--text-faint2)';}},'×'):null);
    };

    /* PP-EXT Track B: status line + the same contextual action rows as the table popover
       (inclActionRows), so the two surfaces can never offer different actions for the same state. */
    const inclCtl = this.isMilestone(t)
      ? h('span',{style:{fontSize:'13px',color:'var(--text-faint2)'}},'— (milestone)')
      : (()=>{ const st=this.inclState(t);
          const statusTxt = st==='snoozed' ? ('Snoozed until '+new Date(t.snoozeUntil).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}))
            : st==='active' ? 'Pressed into today · timer running' /* PP-EXT (owner 2026-08-12): the depth
                channel this described was removed for pressed; say what is actually true. */
            : st==='pressed' ? 'Pressed into today'
            : 'Not pressed today';
          const statusColor = st==='active' ? this._accent : st==='pressed' ? 'var(--success)'
            : st==='unpressed' ? 'var(--text-faint2)' : 'var(--warn)';
          return h('div',{style:{display:'flex',flexDirection:'column',gap:'6px'}},
            h('span',{style:{fontSize:'13px',color:statusColor}}, statusTxt),
            h('div',{style:{display:'flex',flexDirection:'column'}}, ...this.inclActionRows(t))); })();
    const durInput=(key)=>h('input',{className:'pp-num',type:'text',key:key+t[key],defaultValue:this.fmtDur(t[key]),
      style:{textAlign:'left',width:'90px',border:'1px solid var(--divider)'},
      onBlur:e=>this.setDur(t.id,key,e.target.value),onKeyDown:e=>{if(e.key==='Enter')e.target.blur();}});
    const prioRow=h('div',{onClick:()=>this.cyclePriority(t.id),title:'Click to change',
      style:{display:'flex',alignItems:'center',gap:'9px',cursor:'pointer'}},
      this.flagSvg(t.priority,t.priority!==4,17),
      h('span',{style:{fontSize:'13px',color:'var(--text-2)'}},this.PNAME[t.priority]));
    const pctBig=h('div',{onClick:e=>{const r=e.currentTarget.getBoundingClientRect();this.setPct(t.id,(e.clientX-r.left)/r.width*100);},
      style:{position:'relative',height:'18px',background:'var(--pct-track)',borderRadius:'4px',overflow:'hidden',cursor:'pointer'}},
      h('div',{style:{position:'absolute',top:0,left:0,bottom:0,width:t.pct+'%',background:done?'var(--success-strong)':(this._accent||'#3f7bd6')}}),
      h('span',{style:{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',fontWeight:600,color:'var(--on-accent)'}},t.pct+'%'));

    /* PP-EXT: detail-panel editors for the new fields */
    /* PP-EXT: chip-based tag editor — each tag is a removable chip (× deletes it); the trailing input adds one
       or more (@a @b or bare words), Enter/blur commits. Much easier than editing one raw "@a @b" string. */
    const removeLabel=(lab)=>this.removeLabel(t.id,lab);
    const addLabels=(val)=>{ const add=(String(val).match(/@?([a-z0-9_-]+)/gi)||[]); add.forEach(tag=>this.addLabel(t.id,tag)); };
    const tagChip=(l)=>h('span',{key:l,style:{display:'inline-flex',alignItems:'center',gap:'4px',fontSize:'11px',color:'var(--tag-text)',
      background:'var(--tag-bg)',border:'1px solid var(--tag-border)',borderRadius:'4px',padding:'1px 4px 1px 6px',whiteSpace:'nowrap'}},
      '@'+l, h('span',{onClick:()=>removeLabel(l),title:'Remove tag',
        style:{cursor:'pointer',color:'var(--text-faint2)',fontSize:'13px',lineHeight:1},
        onMouseEnter:e=>e.currentTarget.style.color='var(--danger-strong)',onMouseLeave:e=>e.currentTarget.style.color='var(--text-faint2)'},'×'));
    const tagsEditor=h('div',{style:{display:'flex',flexWrap:'wrap',gap:'5px',alignItems:'center'}},
      ...(t.labels||[]).map(tagChip),
      h('input',{className:'pp-num',type:'text',key:'addtag'+(t.labels||[]).length,placeholder:(t.labels&&t.labels.length)?'+ tag':'@tag',
        style:{textAlign:'left',flex:'1 0 56px',minWidth:'56px',border:'1px solid var(--divider)'},
        onBlur:e=>{ if(e.target.value.trim()){ addLabels(e.target.value); e.target.value=''; } },
        onKeyDown:e=>{ if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); } }}));
    const goalEditor=h('input',{className:'pp-num',type:'text',key:'dg'+(t.goal||''),defaultValue:t.goal||'',placeholder:'Goal for this task',
      style:{textAlign:'left',width:'100%',border:'1px solid var(--divider)'},
      onBlur:e=>this.setGoal(t.id,e.target.value),onKeyDown:e=>{if(e.key==='Enter')e.target.blur();}});
    /* PP-EXT: detail panel shows lifetime spent + today's slice from the per-day ledger (getSpentOn). */
    const spentToday=this.getSpentOn(t, this.startOfToday());
    const spentField=valTxt(this.fmtDur(this.getSpent(t))+(this.isRunning(t.id)?' ⏱ running':'')+(spentToday>0?'  ·  '+this.fmtDur(spentToday)+' today':''), this.isRunning(t.id)?'var(--success)':'var(--text-2)');
    const al=this.allotOf(t.id);
    const allotField = !al.active
      ? valTxt('— (today outside [start, due])','var(--text-faint2)')
      : h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
          t.predictManual
            ? h('input',{className:'pp-num',type:'text',key:'dp'+t.predicted,defaultValue:this.fmtDur(t.predicted),
                style:{textAlign:'left',width:'90px',border:'1px solid var(--divider)',color:'var(--danger)'},
                onBlur:e=>this.setPredict(t.id,e.target.value),onKeyDown:e=>{if(e.key==='Enter')e.target.blur();}})
            : h('span',{style:{fontSize:'13px',color:'var(--text-2)',fontVariantNumeric:'tabular-nums'}},this.fmtDur(al.allotted)),
          h('span',{onClick:()=>this.togglePredictManual(t.id),title:t.predictManual?'Revert to auto':'Override manually',
            style:{cursor:'pointer',fontSize:'12px',color:t.predictManual?'var(--danger)':'var(--text-faint2)'}}, t.predictManual?'✎ manual':'∿ auto'));

    /* PP-EXT (10): blocking vs background. Only meaningful for a task that HAS a fixed clock span (that is
       what becomes a busy interval), so the row is hidden otherwise rather than shown inert. Three states
       because the field is tri-state: Auto is what an untouched or opaque-imported task holds, and clicking
       the active state returns to it, so a mis-toggle is one click from undone. HIT_MIN_PX per the owner's
       hit-target tenet — the glyph is not the hit box. NOTHING reads this to schedule yet (block 11). */
    const blockingCtl = (!this.isMilestone(t) && this.hasStartTime(t)) ? (()=>{
      const cur = t.blocking;
      const opt=(val,label,title)=>{ const on = (cur===val);
        return h('div',{key:String(val),onClick:()=>this.setBlocking(t.id, on&&val!=null ? null : val),title,
          role:'button',tabIndex:0,'aria-pressed':on,
          onKeyDown:e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); this.setBlocking(t.id, on&&val!=null?null:val); } },
          style:{flex:1,minHeight:this.HIT_MIN_PX+'px',display:'flex',alignItems:'center',justifyContent:'center',
            cursor:'pointer',fontSize:'12px',borderRadius:'var(--r-2)',
            color:on?'var(--on-accent)':'var(--text-mut2)',background:on?(this._accent||'#3f7bd6'):'var(--field-bg)',
            border:'1px solid '+(on?'transparent':'var(--field-border)')}}, label); };
      return h('div',{style:{display:'flex',gap:'5px'}},
        opt(null,'Auto','Inherit the default (blocking), or the calendar event’s busy/free setting on import.'),
        opt(true,'Blocking','Nothing else may be scheduled through this span.'),
        opt(false,'Background','A container you work inside — other tasks may be scheduled within it.')); })() : null;

    /* PP-EXT (owner 2026-08-12): "Everything in the right click menu should be in the more expansive
       detail menu." The row menu had five things this panel did not — task TYPE (new in the same pass),
       section assignment, duplicate, archive and delete — so a user who works from the detail panel
       simply could not reach them. The four blocks below close that gap.

       Milestone ⇄ task. Same segmented shape as Busy type, and the same tri-state courtesy of clicking
       the live option being harmless. Writes `type` only, so the span and planned time survive a round
       trip (see setTypeMulti). Shown for every task: it is the one control that ANSWERS "why does this
       row have no allotment", so hiding it on milestones is exactly backwards. */
    const typeCtl=(()=>{
      const isMs=this.isMilestone(t);
      const opt=(val,label,title)=>{ const on=(isMs ? val===this.MILESTONE_TYPE : val!==this.MILESTONE_TYPE);
        return h('div',{key:val,onClick:()=>{ if(!on) this.setTypeMulti([t.id], val); },title,
          role:'button',tabIndex:0,'aria-pressed':on,
          onKeyDown:e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(!on) this.setTypeMulti([t.id], val); } },
          style:{flex:1,minHeight:this.HIT_MIN_PX+'px',display:'flex',alignItems:'center',justifyContent:'center',
            gap:'6px',cursor:on?'default':'pointer',fontSize:'12px',borderRadius:'var(--r-2)',
            color:on?'var(--on-accent)':'var(--text-mut2)',background:on?(this._accent||'#3f7bd6'):'var(--field-bg)',
            border:'1px solid '+(on?'transparent':'var(--field-border)')}}, label); };
      return h('div',{style:{display:'flex',gap:'5px'}},
        opt(this.DEFAULT_TASK_TYPE,'▭ Task','A span of work: it allots time and draws as a bar.'),
        opt(this.MILESTONE_TYPE,'◇ Milestone','A point in time: it never allots and draws as a diamond at its start. The due date and planned time are kept, so converting back restores them.'));
    })();

    /* Section assignment. The row menu hides this under Group by: None, where there are no section bands
       on screen to move things between; the detail panel shows it always, because here it is a property
       of the task being inspected rather than a move between two visible containers. Routed through the
       same setTaskSectionMulti, so it resolves to the subtree root exactly like the menu does. */
    const secOfRoot=(()=>{ const r=this.state.tasks.find(x=>x.id===this.sectionRootId(this.state.tasks,t.id));
      return r?(r.sectionId||null):null; })();
    const sectionCtl=h('select',{className:'pp-num',value:secOfRoot==null?'':secOfRoot,
      onChange:e=>this.setTaskSectionMulti([t.id], e.target.value===''?null:e.target.value),
      style:{textAlign:'left',width:'100%',border:'1px solid var(--divider)',cursor:'pointer'}},
      h('option',{key:'none',value:''},'No section'),
      ...this.sectionsInOrder().map(s=>h('option',{key:s.id,value:s.id},s.name)));

    const actBtn=(label,onClick,danger)=>h('button',{className:'pp-tbtn',onClick,
      style:{flex:1,minHeight:this.HIT_MIN_PX+'px',cursor:'pointer',
        color:danger?'var(--danger-strong)':undefined}},label);
    /* Duplicate / archive / delete. Delete keeps the row menu's exact behaviour, including handing a
       recurring task off to the scope prompt rather than guessing which occurrences were meant —
       deleteMulti already owns that branch, so this is one more caller, not a second implementation. */
    const actionsCtl=h('div',{style:{display:'flex',flexDirection:'column',gap:'7px'}},
      h('div',{style:{display:'flex',gap:'7px'}},
        actBtn('⧉ Duplicate',()=>this.duplicateMulti([t.id])),
        t.archivedAt ? actBtn('↩ Unarchive',()=>this.unarchiveMulti([t.id]))
                     : actBtn('▣ Archive',()=>this.archiveMulti([t.id]))),
      actBtn('✕ Delete task',()=>this.deleteMulti([t.id]),true));

    const sidebar=h('div',{style:{flex:'0 0 300px',background:'var(--side-bg)',borderLeft:'1px solid var(--modal-border)',overflow:'auto'}},
      field('Project',h('div',{style:{display:'flex',alignItems:'center',gap:'7px',fontSize:'13px',color:'var(--text-2)'}},
        h('span',{style:{color:'var(--text-mut)'}},'#'),this.PROJECT)),
      field(h('span',null,'Include today',this.infoNote('Whether this task counts toward today’s schedule and allotment. Auto = included when today falls in [start, due] (or a derived ghost window if it has no dates); click to force it on/off ("manual"), or snooze it a few days without turning it off entirely. Milestones and tasks with no Planned time never allot. Dates and typed times determine when it happens.')),inclCtl),
      /* PP-EXT: subtasks — parent link + one-click unnest */
      (t.parentId&&byId[t.parentId])?field('Subtask of',h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
        h('span',{onClick:()=>this.openDetail(t.parentId),style:{cursor:'pointer',fontSize:'13px',color:this._accent,
          whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},'↖ '+byId[t.parentId].name),
        h('span',{onClick:()=>this.outdentRows([t.id]),title:'Un-nest (make it a top-level task)',
          style:{cursor:'pointer',fontSize:'11px',color:'var(--text-faint2)'}},'✕'))):null,
      field('Tags',tagsEditor),
      field('Start',valWithX(t.start,null,'start',t.allDay/* PP-EXT */)),
      field('Due',valWithX(t.end, (!done&&t.end!=null&&t.end<Date.now())?'var(--danger)':'var(--text-2)', 'end', t.allDay/* PP-EXT */)),
      field('Duration',valTxt(Math.round(this.durDays(t))+' days · '+(this._cpm.critical[t.id]?'critical path':(Math.max(0,Math.round((this._slack[t.id]||0)*10)/10))+'d slack')+(this._schedWarn?' · ⚠ dependency cycle':''),
        this._cpm.critical[t.id]?'var(--danger-strong)':(this._schedWarn?'var(--warn)':'var(--text-2)'))),
      h('div',{style:{display:'flex'}},
        field('Planned', durInput('planned'),{flex:1,borderRight:'1px solid var(--field-divider)'}),
        field('Spent',spentField,{flex:1})),
      field(h('span',null,'Allotted (remaining)',this.infoNote('Auto-scheduled time for this task today: its share of the day’s free time (window minus meals, reserved free time and fixed blocks), scaled by remaining Planned work and split across active tasks by priority then due date. Click ∿ auto → ✎ manual to pin a fixed amount off the top (a Predict override) instead of the computed value.')),allotField),
      blockingCtl?field(h('span',null,'Busy type',this.infoNote('Whether this appointment’s time is blocking (nothing else is scheduled through it) or background (a container — like a Work day — you deliberately place other tasks inside). Auto follows the imported calendar event’s busy/free setting, and defaults to blocking.')),blockingCtl):null,
      t.eventId?field('Calendar',valTxt('🗓 linked'+(t.labels&&t.labels.length?(' · @'+t.labels[t.labels.length-1]):''),'var(--text-2)')):null,
      field('Priority',prioRow),
      field('Progress',pctBig),
      field('Completed',valWithX(t.completion,t.completion?'var(--success)':'var(--text-faint2)','completion')),
      /* PP-EXT (owner 2026-08-12): parity with the row menu — see the block above renderDetail's sidebar. */
      field(h('span',null,'Type',this.infoNote('A Task is a span of work: it allots time and draws as a bar. A Milestone is a point in time: it never allots and draws as a diamond at its start. Switching keeps the dates and planned time, so you can convert back and forth without losing anything.')),typeCtl),
      field('Section',sectionCtl),
      field('Actions',actionsCtl,{borderBottom:'none'}));

    const card=h('div',{onClick:e=>e.stopPropagation(),onContextMenu:e=>e.stopPropagation(),
      /* PP-EXT (2026-08-12): the card covers most of the viewport, so the second press of a row
         double-click usually lands HERE rather than on the scrim. See detailDblFollowUp. */
      onMouseDown:e=>{ if(this.detailDblFollowUp(e)) e.stopPropagation(); },
      style:{width:'min(940px,94vw)',height:'min(660px,90vh)',background:'var(--card-bg)',border:'1px solid var(--field-border)',
        borderRadius:'14px',boxShadow:'0 24px 80px rgba(0,0,0,0.6)',display:'flex',flexDirection:'column',overflow:'hidden'}},
      header,
      h('div',{style:{display:'flex',flex:1,minHeight:0}}, main, sidebar));

    return h('div',{onMouseDown:e=>{ if(this.detailDblFollowUp(e)) return; if(e.target===e.currentTarget) this.closeDetail(); },
      style:{position:'fixed',inset:0,zIndex:2000,background:'rgba(0,0,0,0.55)',display:'flex',alignItems:'center',justifyContent:'center'}},
      card);
  }
}
</script>
</body>
</html>
